<script>
(() => {
  'use strict';

  const el = (id) => document.getElementById(id);

  // ---------------------------------------------------------------------
  // 1. Geräte-Fakten
  // ---------------------------------------------------------------------
  function facts() {
    el('f-cores').textContent = navigator.hardwareConcurrency ?? 'unbekannt';
    el('f-mem').textContent = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'nicht gemeldet';
    el('f-ua').textContent = navigator.userAgent;
  }

  // ---------------------------------------------------------------------
  // 2. Bausteine — schnelle Fähigkeitsprüfungen vor der eigentlichen Messung
  // ---------------------------------------------------------------------
  const CHECKS = [
    ['worklet',  'AudioWorklet aus Blob-URL'],
    ['wasm',     'WebAssembly aus eingebetteten Bytes'],
    ['simd',     'WASM-SIMD'],
    ['perf',     'performance.now() im Worklet'],
    ['capacity', 'AudioContext.renderCapacity'],
    ['stretch',  'signalsmith-stretch lädt'],
  ];
  const state = {};
  const rowsHost = el('checks');
  for (const [key, label] of CHECKS) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<span class="name"></span><span class="chip" id="chip-' + key + '">offen</span>'
      + '<span class="detail" id="det-' + key + '"></span>';
    row.querySelector('.name').textContent = label;
    rowsHost.append(row);
    state[key] = { label, status: 'offen', detail: '' };
  }

  function mark(key, status, detail) {
    state[key].status = status;
    state[key].detail = detail || '';
    const chip = el('chip-' + key);
    chip.textContent = status;
    chip.className = 'chip ' + (status === 'ja' ? 'ok' : status === 'nein' ? 'bad' : status === 'offen' ? '' : 'warn');
    el('det-' + key).textContent = detail || '';
  }

  // Kleinstes gültiges WASM-Modul: exportiert add(i32,i32)->i32.
  const ADD_WASM = new Uint8Array([
    0x00,0x61,0x73,0x6d, 0x01,0x00,0x00,0x00,
    0x01,0x07,0x01,0x60,0x02,0x7f,0x7f,0x01,0x7f,
    0x03,0x02,0x01,0x00,
    0x07,0x07,0x01,0x03,0x61,0x64,0x64,0x00,0x00,
    0x0a,0x09,0x01,0x07,0x00,0x20,0x00,0x20,0x01,0x6a,0x0b,
  ]);
  // Merkmalsprüfung für SIMD: ein Modul mit einer v128-Instruktion.
  const SIMD_WASM = new Uint8Array([
    0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11,
  ]);

  async function checkWasm() {
    try {
      const { instance } = await WebAssembly.instantiate(ADD_WASM, {});
      const sum = instance.exports.add(19, 23);
      mark('wasm', sum === 42 ? 'ja' : 'nein', 'add(19,23) = ' + sum);
    } catch (err) {
      mark('wasm', 'nein', (err && err.name) + ': ' + (err && err.message));
    }
    try {
      mark('simd', WebAssembly.validate(SIMD_WASM) ? 'ja' : 'nein', 'Merkmalsprüfung über WebAssembly.validate');
    } catch (err) {
      mark('simd', 'nein', String(err && err.name));
    }
  }

  function probeSource() {
    return "class ProbeProcessor extends AudioWorkletProcessor {\n"
      + "  constructor() {\n"
      + "    super();\n"
      + "    this.port.postMessage({\n"
      + "      hasPerf: typeof performance !== 'undefined' && typeof performance.now === 'function',\n"
      + "      sampleRate: sampleRate,\n"
      + "    });\n"
      + "  }\n"
      + "  process() { return false; }\n"
      + "}\n"
      + "registerProcessor('probe', ProbeProcessor);\n";
  }

  async function checkWorklet(ctx) {
    if (!ctx.audioWorklet) { mark('worklet', 'nein', 'ctx.audioWorklet fehlt'); mark('perf', 'nein', 'ohne Worklet nicht prüfbar'); return; }
    const url = URL.createObjectURL(new Blob([probeSource()], { type: 'application/javascript' }));
    try {
      await ctx.audioWorklet.addModule(url);
      const node = new AudioWorkletNode(ctx, 'probe');
      const msg = await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('keine Antwort in 3 s')), 3000);
        node.port.onmessage = (e) => { clearTimeout(t); resolve(e.data); };
      });
      mark('worklet', 'ja', 'addModule(blob:) angenommen, Prozessor meldet sich');
      mark('perf', msg.hasPerf ? 'ja' : 'nein',
        msg.hasPerf ? 'Uhr im Worklet vorhanden' : 'wie erwartet nicht vorhanden');
      node.disconnect();
    } catch (err) {
      mark('worklet', 'nein', (err && err.name) + ': ' + (err && err.message));
      mark('perf', 'nein', 'ohne Worklet nicht prüfbar');
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function checkCapacity(ctx) {
    const has = !!(ctx.renderCapacity && typeof ctx.renderCapacity.start === 'function');
    mark('capacity', has ? 'ja' : 'nein', has ? 'vorhanden' : 'nicht vorhanden — Ersatzmessung über ctx.currentTime');
  }

  async function checkStretch(ctx) {
    if (typeof SignalsmithStretch !== 'function') {
      mark('stretch', 'nein', 'globales SignalsmithStretch fehlt — Skript nicht geladen');
      return;
    }
    try {
      const node = await SignalsmithStretch(ctx);
      node.disconnect();
      mark('stretch', 'ja', 'AudioWorklet-Knoten steht, WASM ohne Netzzugriff aus der eingebetteten data:-URI');
    } catch (err) {
      mark('stretch', 'nein', (err && err.name) + ': ' + (err && err.message));
    }
  }

  // ---------------------------------------------------------------------
  // 3. Durchsatzmessung (Plan Abschnitt 2)
  // ---------------------------------------------------------------------
  const WORKER_SAMPLE_RATE = 48000; // ein gewöhnlicher Worker hat keine Geräte-Abtastrate; konstant, damit js-mono und wasm vergleichbar bleiben

  function runWorkerBench(family, rate, channels) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(new Blob([MESSPLATZ.workerSrc], { type: 'application/javascript' }));
      const worker = new Worker(url);
      const id = Math.random().toString(36).slice(2);
      const done = (result) => {
        clearTimeout(timeout);
        worker.terminate();
        URL.revokeObjectURL(url);
        resolve(result);
      };
      const timeout = setTimeout(() => done({ ok: false, error: 'Zeitüberschreitung (10 s)' }), 10000);
      worker.onmessage = (e) => { if (e.data && e.data.id === id) done(e.data); };
      worker.onerror = (e) => done({ ok: false, error: (e && e.message) || 'Worker-Fehler' });
      worker.postMessage({
        cmd: 'bench', id, family, rate, channels, sampleRate: WORKER_SAMPLE_RATE,
        warmupMaxQuanta: 2000, warmupMaxMs: 800, durationMs: 2000,
      });
    });
  }

  let overloadWorkletReady = null;
  function ensureOverloadWorklet(ctx) {
    if (!overloadWorkletReady) {
      const url = URL.createObjectURL(new Blob([MESSPLATZ.overloadWorkletSrc], { type: 'application/javascript' }));
      overloadWorkletReady = ctx.audioWorklet.addModule(url).finally(() => URL.revokeObjectURL(url));
    }
    return overloadWorkletReady;
  }

  function measureRealtimeRatio(ctx, ms) {
    return new Promise((resolve) => {
      const w0 = performance.now(), a0 = ctx.currentTime;
      setTimeout(() => {
        const dw = (performance.now() - w0) / 1000;
        const da = ctx.currentTime - a0;
        resolve(dw > 0 ? da / dw : 0);
      }, ms);
    });
  }

  function withTimeout(promise, ms, label) {
    let t;
    const timeout = new Promise((_, reject) => {
      t = setTimeout(() => reject(new Error('Zeitüberschreitung bei ' + label + ' (' + ms + ' ms)')), ms);
    });
    return Promise.race([promise, timeout]).finally(() => clearTimeout(t));
  }

  async function runJsWorkletRound(ctx, rate, channels, k) {
    await ensureOverloadWorklet(ctx);
    const node = new AudioWorkletNode(ctx, 'hq-overload', {
      numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1],
      processorOptions: { k, channels, shift: 1 / rate },
    });
    const mute = ctx.createGain();
    mute.gain.value = 0;
    node.connect(mute).connect(ctx.destination);
    await new Promise((r) => setTimeout(r, 150));
    const p = await measureRealtimeRatio(ctx, 2000);
    node.port.postMessage({ type: 'stop' });
    node.disconnect(); mute.disconnect();
    return p;
  }

  // Jeder wasm-Knoten kompiliert und instanziiert sein eigenes WASM-Modul neu
  // — auf dem echten Gerät teuer genug, dass 6 verwerfen und 16 neu bauen
  // (22 Instanzen für eine Tempo/Engine-Kombination) zum Hänger werden kann.
  // Deshalb: den Pool über die Eskalationsrunde hinweg behalten, nur die
  // fehlende Differenz dazubauen.
  async function growWasmPool(ctx, mute, pool, targetK, rate, src) {
    while (pool.length < targetK) {
      const node = await SignalsmithStretch(ctx);
      node.addBuffers([src, src]);
      node.schedule({ rate, semitones: 0, formantCompensation: false, input: 0 });
      node.start();
      node.connect(mute);
      pool.push(node);
    }
  }

  async function runWasmWorkletRound(ctx, mute, pool, targetK, rate, src) {
    await growWasmPool(ctx, mute, pool, targetK, rate, src);
    await new Promise((r) => setTimeout(r, 150));
    return measureRealtimeRatio(ctx, 2000);
  }

  // Nie unbegrenzt hängen: ein Gerät, das K Ströme nicht in angemessener
  // Zeit anlegen kann, ist selbst ein Ergebnis (siehe SLOWPLAY-HQ-HANDOFF.md
  // §6 Punkt 1 — auf einem schnellen Proxy gemessen, dem Gerät nicht
  // zugetraut, dass es teuer ist) und muss als Fehler sichtbar werden statt
  // die Seite einzufrieren.
  const WORKLET_ROUND_TIMEOUT_MS = 8000;

  async function overloadThroughput(family, ctx, rate, channels) {
    const rounds = [];
    let ok = true, error = null;
    if (family === 'wasm') {
      const mute = ctx.createGain();
      mute.gain.value = 0;
      mute.connect(ctx.destination);
      const src = testSignal(ctx.sampleRate, 4);
      const pool = [];
      try {
        let k = 6;
        let p = await withTimeout(runWasmWorkletRound(ctx, mute, pool, k, rate, src), WORKLET_ROUND_TIMEOUT_MS, 'wasm K=' + k);
        rounds.push({ k, p });
        if (p >= 0.95) {
          k = 16;
          p = await withTimeout(runWasmWorkletRound(ctx, mute, pool, k, rate, src), WORKLET_ROUND_TIMEOUT_MS, 'wasm K=' + k);
          rounds.push({ k, p });
        }
      } catch (err) {
        ok = false;
        error = (err && err.message) || String(err);
      }
      for (const node of pool) { try { node.stop(); } catch {} try { node.disconnect(); } catch {} }
      mute.disconnect();
    } else {
      try {
        let k = 6;
        let p = await withTimeout(runJsWorkletRound(ctx, rate, channels, k), WORKLET_ROUND_TIMEOUT_MS, 'js K=' + k);
        rounds.push({ k, p });
        if (p >= 0.95) {
          k = 16;
          p = await withTimeout(runJsWorkletRound(ctx, rate, channels, k), WORKLET_ROUND_TIMEOUT_MS, 'js K=' + k);
          rounds.push({ k, p });
        }
      } catch (err) {
        ok = false;
        error = (err && err.message) || String(err);
      }
    }
    if (rounds.length === 0) return { throughput: 0, rounds: [], ok: false, error };
    const last = rounds[rounds.length - 1];
    return { throughput: last.k * last.p, rounds, ok, error };
  }

  // ---------------------------------------------------------------------
  // 4. Ablauf und Ergebnisdarstellung
  // ---------------------------------------------------------------------
  const RUNS_REQUIRED = [
    { key: 'js-mono', label: 'js-mono', family: 'js', channels: 1 },
    { key: 'wasm', label: 'wasm', family: 'wasm', channels: 1 },
  ];
  const RUNS_EXTRA = [
    { key: 'js-stereo', label: 'js-stereo', family: 'js', channels: 2 },
  ];
  const TEMPI_REQUIRED = [0.6];
  const TEMPI_EXTRA = [0.85, 0.7];

  const messungen = []; // { key, label, rate, worker, worklet }

  function fmtRounds(rounds, digits) {
    return rounds.map((r) => 'K=' + r.k + ' p=' + (r.p * 100).toFixed(digits) + '%').join(', ');
  }

  // Ein Worklet-Fehler (z.B. Zeitüberschreitung) ist selbst ein Ergebnis —
  // nie stumm 0 anzeigen, sondern was tatsächlich passiert ist.
  function fmtWorklet(w, digits) {
    if (!w.ok) {
      const partial = w.rounds.length ? ' (' + fmtRounds(w.rounds, digits) + ' vor dem Abbruch)' : '';
      return 'FEHLER: ' + w.error + partial;
    }
    return fmtRounds(w.rounds, digits) + ' → Durchsatz ' + w.throughput.toFixed(3) + '×';
  }

  function addResultRow(m) {
    const row = document.createElement('div');
    row.className = 'row';
    const workerTxt = m.worker.ok ? m.worker.throughput.toFixed(2) + '×' : 'Fehler';
    const workletTxt = m.worklet.ok ? m.worklet.throughput.toFixed(2) + '×' : 'Fehler';
    row.innerHTML = '<span class="name"></span><span class="chip"></span>'
      + '<span class="detail"></span>';
    row.querySelector('.name').textContent = m.label + ' · ' + m.rate.toFixed(2) + '×';
    const chip = row.querySelector('.chip');
    chip.textContent = workerTxt + ' / ' + workletTxt;
    chip.className = 'chip ' + (m.worker.ok && m.worklet.ok && m.worklet.throughput >= 1 ? 'ok' : m.worker.ok && m.worklet.ok ? 'warn' : 'bad');
    row.querySelector('.detail').textContent =
      'Worker: ' + (m.worker.ok ? m.worker.throughput.toFixed(3) + '× Echtzeit (' + m.worker.blocks + ' Blöcke, ' + m.worker.elapsedMs.toFixed(0) + ' ms)' : 'FEHLER: ' + m.worker.error)
      + ' · Worklet: ' + fmtWorklet(m.worklet, 0);
    el('results').append(row);
  }

  function renderErgebnis() {
    const ctx = window.__messCtx;
    const lines = [];
    lines.push('BVG Audio-Messplatz — Durchsatzmessung — ' + new Date().toISOString());
    lines.push('UA: ' + navigator.userAgent);
    lines.push('Kerne: ' + (navigator.hardwareConcurrency ?? '?') + '   Speicher: ' + (navigator.deviceMemory ?? '?'));
    if (ctx) {
      lines.push('Abtastrate: ' + ctx.sampleRate
        + '   baseLatency: ' + (ctx.baseLatency ?? '?')
        + '   outputLatency: ' + (ctx.outputLatency ?? '?'));
      lines.push('Frist je Render-Quantum: ' + (128 / ctx.sampleRate * 1000).toFixed(2) + ' ms');
    }
    lines.push('');
    lines.push('WASM-SIMD: ' + state.simd.status + '   renderCapacity: ' + state.capacity.status + '   Blob-Worklet: ' + state.worklet.status);
    lines.push('signalsmith-stretch: ' + MESSPLATZ.libVersion + ' (' + MESSPLATZ.libLicense + ')   sha256 ' + MESSPLATZ.libSha256);
    lines.push('js-Motor (aus index.html geschnitten): sha256 ' + MESSPLATZ.engineSha256);
    lines.push('');
    lines.push('Durchsatz — Audiosekunden je Wanduhrsekunde (Worker roh / Worklet K·p, absichtlich überlastet):');
    for (const m of messungen) {
      const workerTxt = m.worker.ok ? m.worker.throughput.toFixed(3) + '×' : 'FEHLER: ' + m.worker.error;
      lines.push('  ' + m.label.padEnd(10, ' ') + m.rate.toFixed(2) + '×'
        + '   Worker ' + workerTxt.padEnd(10, ' ')
        + '   Worklet ' + fmtWorklet(m.worklet, 1)
        + '   Betriebsart: ' + (m.family === 'wasm' ? 'Pufferbetrieb (b)' : 'Direktaufruf, wie im Worklet der App'));
    }
    lines.push('');
    if (hvJudgement) {
      const j = hvJudgement;
      const verdict = j.result === 'same' ? 'kein hörbarer Unterschied' : j.assignment[j.result] + ' bevorzugt';
      lines.push('Hörvergleich — Paar 1 (standard gegen wasm) bei ' + j.rate.toFixed(2) + '×: ' + verdict
        + '   [A=' + j.assignment.A + ', B=' + j.assignment.B + ']'
        + '   Quelle: ' + j.source);
    } else {
      lines.push('Hörvergleich: noch kein Urteil erfasst.');
    }
    el('out').textContent = lines.join('\n');
  }

  async function messeAlle(ctx, mitExtra) {
    const tempi = TEMPI_REQUIRED.concat(mitExtra ? TEMPI_EXTRA : []);
    const runs = RUNS_REQUIRED.concat(mitExtra ? RUNS_EXTRA : []);
    for (const rate of tempi) {
      for (const run of runs) {
        el('status').textContent = 'Messe ' + run.label + ' bei ' + rate.toFixed(2) + '× — Worker …';
        const worker = await runWorkerBench(run.family, rate, run.channels);
        el('status').textContent = 'Messe ' + run.label + ' bei ' + rate.toFixed(2) + '× — Worklet …';
        const worklet = await overloadThroughput(run.family, ctx, rate, run.channels);
        const m = { key: run.key, label: run.label, family: run.family, rate, worker, worklet };
        messungen.push(m);
        addResultRow(m);
        renderErgebnis();
      }
    }
    el('status').textContent = 'Fertig.';
  }

  el('start').addEventListener('click', async () => {
    const btn = el('start');
    btn.disabled = true;
    btn.textContent = 'Messung läuft …';
    el('results').innerHTML = '';
    messungen.length = 0;
    try {
      if (navigator.wakeLock) {
        try { await navigator.wakeLock.request('screen'); } catch { /* z.B. Tab im Hintergrund — egal, nur bestmöglich */ }
      }
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      window.__messCtx = ctx;
      await ctx.resume();
      el('f-sr').textContent = ctx.sampleRate + ' Hz';
      el('f-lat').textContent = 'base ' + (ctx.baseLatency ?? '?') + ' · output ' + (ctx.outputLatency ?? '?');

      el('status').textContent = 'Prüfe Bausteine …';
      await checkWasm();
      await checkWorklet(ctx);
      checkCapacity(ctx);
      await checkStretch(ctx);

      await messeAlle(ctx, el('extra').checked);

      btn.textContent = 'Messung abgeschlossen';
      el('hint').textContent = 'Fertig. Unten das Ergebnis kopieren.';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Nochmal versuchen';
      el('status').textContent = 'Fehlgeschlagen: ' + (err && err.name) + ' — ' + (err && err.message);
    }
    renderErgebnis();
  });

  // ---------------------------------------------------------------------
  // 5. Hörvergleich (Plan Abschnitt 3) — Paar 1: standard gegen wasm
  // ---------------------------------------------------------------------
  let hvCtx = null;
  let hvBuffer = null; // AudioBuffer der gewählten Datei, oder null (dann: eingebauter Vierklang)
  let hvObjectUrl = null;
  let hvFile = null;
  let hvBuiltin = null; // { buffer, objectUrl } — einmal erzeugt, wiederverwendet
  let hvNodes = null;
  let hvAssignment = null; // { A: 'standard'|'wasm', B: 'standard'|'wasm' } — vor dem Urteil nirgends angezeigt
  let hvJudgement = null;

  function hvFormatTime(s) {
    const m = Math.floor(s / 60), sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2, '0');
  }

  // Nur für den eingebauten Vierklang nötig: ein <audio>-Element braucht eine
  // echte Quelle (preservesPitch gibt es nur auf HTMLMediaElement, nicht auf
  // einem AudioBuffer) — bei einer eigenen Datei wird stattdessen direkt die
  // hochgeladene Datei als Objekt-URL verwendet.
  function encodeWav(buffer) {
    const numCh = buffer.numberOfChannels, sr = buffer.sampleRate, len = buffer.length;
    const blockAlign = numCh * 2, dataSize = len * blockAlign;
    const out = new ArrayBuffer(44 + dataSize);
    const view = new DataView(out);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
    writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true); view.setUint32(24, sr, true);
    view.setUint32(28, sr * blockAlign, true); view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, dataSize, true);
    const chans = []; for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
    let off = 44;
    for (let i = 0; i < len; i++) {
      for (let c = 0; c < numCh; c++) {
        const s = Math.max(-1, Math.min(1, chans[c][i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        off += 2;
      }
    }
    return new Blob([out], { type: 'audio/wav' });
  }

  function hvGetBuiltin(ctx) {
    if (hvBuiltin) return hvBuiltin;
    const seconds = 16;
    const mono = testSignal(ctx.sampleRate, seconds);
    const buffer = ctx.createBuffer(2, mono.length, ctx.sampleRate);
    buffer.copyToChannel(mono, 0);
    buffer.copyToChannel(mono, 1);
    hvBuiltin = { buffer, objectUrl: URL.createObjectURL(encodeWav(buffer)) };
    return hvBuiltin;
  }

  el('hv-file').addEventListener('change', async () => {
    const file = el('hv-file').files[0];
    if (!file) return;
    el('hv-filename').textContent = 'lädt: ' + file.name + ' …';
    try {
      const buf = await file.arrayBuffer();
      const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await tmpCtx.decodeAudioData(buf);
      await tmpCtx.close();
      if (hvObjectUrl) URL.revokeObjectURL(hvObjectUrl);
      hvBuffer = audioBuffer;
      hvObjectUrl = URL.createObjectURL(file);
      hvFile = file;
      el('hv-filename').textContent = file.name + ' (' + hvFormatTime(audioBuffer.duration) + ')';
      const maxOffset = Math.max(0, Math.floor(audioBuffer.duration - 15));
      const offsetInput = el('hv-offset');
      offsetInput.max = String(maxOffset);
      offsetInput.value = String(Math.floor(maxOffset * 0.25));
      el('hv-offset-row').hidden = false;
      el('hv-offset-val').textContent = hvFormatTime(Number(offsetInput.value));
    } catch (err) {
      hvBuffer = null;
      el('hv-filename').textContent = 'Fehler beim Laden — Vierklang wird verwendet: ' + (err && err.message);
    }
  });

  el('hv-offset').addEventListener('input', () => {
    el('hv-offset-val').textContent = hvFormatTime(Number(el('hv-offset').value));
  });

  function hvStopPlayback() {
    if (!hvNodes) return;
    try { hvNodes.standardEl.pause(); } catch {}
    try { hvNodes.standardEl.src = ''; } catch {}
    try { hvNodes.wasmNode.stop(); } catch {}
    try { hvNodes.wasmNode.disconnect(); } catch {}
    try { hvNodes.standardGain.disconnect(); } catch {}
    try { hvNodes.wasmGain.disconnect(); } catch {}
    hvNodes = null;
  }

  function hvSwitch(which) {
    if (!hvNodes || !hvAssignment) return;
    const now = hvCtx.currentTime;
    const wantStandard = hvAssignment[which] === 'standard';
    hvNodes.standardGain.gain.setTargetAtTime(wantStandard ? 1 : 0, now, 0.005);
    hvNodes.wasmGain.gain.setTargetAtTime(wantStandard ? 0 : 1, now, 0.005);
    el('hv-a').className = 'secondary' + (which === 'A' ? ' picked' : '');
    el('hv-b').className = 'secondary' + (which === 'B' ? ' picked' : '');
  }

  function hvJudge(result) {
    hvJudgement = {
      result, assignment: hvAssignment, rate: Number(el('hv-rate').value),
      source: hvFile ? hvFile.name : 'eingebauter Vierklang',
    };
    const real = result === 'same' ? 'kein Unterschied' : hvAssignment[result] + ' (' + result + ')';
    el('hv-status').textContent = 'Urteil erfasst: ' + real + '. Aufgelöst: A=' + hvAssignment.A + ', B=' + hvAssignment.B + '.';
    renderErgebnis();
  }

  async function hvStart() {
    const btn = el('hv-start');
    btn.disabled = true;
    btn.textContent = 'lädt …';
    hvStopPlayback();
    try {
      if (!hvCtx) hvCtx = new (window.AudioContext || window.webkitAudioContext)();
      await hvCtx.resume();

      let buffer, sourceUrl;
      if (hvBuffer) {
        buffer = hvBuffer; sourceUrl = hvObjectUrl;
      } else {
        const b = hvGetBuiltin(hvCtx);
        buffer = b.buffer; sourceUrl = b.objectUrl;
      }
      const rate = Number(el('hv-rate').value);
      const offset = hvBuffer ? Number(el('hv-offset').value) : 0;
      const dur = Math.min(15, buffer.duration - offset);
      const loopEnd = offset + dur;

      // standard: natives preservesPitch, nur über ein echtes <audio>-Element zu haben.
      const standardEl = new Audio();
      standardEl.preservesPitch = true;
      standardEl.playbackRate = rate;
      standardEl.src = sourceUrl;
      await new Promise((resolve, reject) => {
        standardEl.addEventListener('loadedmetadata', resolve, { once: true });
        standardEl.addEventListener('error', () => reject(new Error('audio-Element: Ladefehler')), { once: true });
      });
      standardEl.currentTime = offset;
      standardEl.addEventListener('timeupdate', () => {
        if (standardEl.currentTime >= loopEnd - 0.05) standardEl.currentTime = offset;
      });
      const standardSrc = hvCtx.createMediaElementSource(standardEl);
      const standardGain = hvCtx.createGain();
      standardGain.gain.value = 0;
      standardSrc.connect(standardGain).connect(hvCtx.destination);

      // wasm: Pufferbetrieb, sample-genauer eingebauter Loop.
      const wasmNode = await SignalsmithStretch(hvCtx);
      const chL = buffer.getChannelData(0);
      const chR = buffer.numberOfChannels > 1 ? buffer.getChannelData(1) : chL;
      wasmNode.addBuffers([chL, chR]);
      wasmNode.schedule({ rate, semitones: 0, formantCompensation: false, input: offset, loopStart: offset, loopEnd });
      wasmNode.start();
      const wasmGain = hvCtx.createGain();
      wasmGain.gain.value = 0;
      wasmNode.connect(wasmGain).connect(hvCtx.destination);

      await standardEl.play();
      hvNodes = { standardEl, standardGain, wasmNode, wasmGain };

      const flip = Math.random() < 0.5;
      hvAssignment = flip ? { A: 'standard', B: 'wasm' } : { A: 'wasm', B: 'standard' };
      hvSwitch('A');

      el('hv-player').hidden = false;
      el('hv-status').textContent = '';
      el('hv-hint').textContent = 'Läuft. Zwischen A und B umschalten, dann urteilen.';
      btn.textContent = 'Neu starten';
    } catch (err) {
      el('hv-hint').textContent = 'Fehlgeschlagen: ' + (err && err.name) + ' — ' + (err && err.message);
    }
    btn.disabled = false;
  }

  el('hv-start').addEventListener('click', hvStart);
  el('hv-a').addEventListener('click', () => hvSwitch('A'));
  el('hv-b').addEventListener('click', () => hvSwitch('B'));
  el('hv-judge-a').addEventListener('click', () => hvJudge('A'));
  el('hv-judge-b').addEventListener('click', () => hvJudge('B'));
  el('hv-judge-same').addEventListener('click', () => hvJudge('same'));

  el('copy').addEventListener('click', async () => {
    const btn = el('copy');
    try {
      await navigator.clipboard.writeText(el('out').textContent);
      btn.textContent = 'Kopiert';
    } catch {
      const sel = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el('out'));
      sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = 'Markiert — von Hand kopieren';
    }
    setTimeout(() => { btn.textContent = 'Ergebnis kopieren'; }, 2500);
  });

  facts();
  renderErgebnis();
})();
</script>
