<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Einsingen</title>
<!--
  EINSINGEN — eigenständiges Tool (Einstellungen → Tools → Einsingen),
  herausgelöst aus dem früheren Einsingen-Reiter des Spielplatzes
  (uebe-lab.html). Wie Metronom und Ausbildung als Vollbild-iframe
  eingebettet (?embedded=1, siehe openToolFrame in app.js; der
  Schließen-Knopf gehört der App), offline über SHELL_OPTIONAL in sw.js,
  keine STRINGS (vorerst nur Deutsch), keine Abhängigkeiten —
  funktioniert auch direkt im Browser geöffnet.

  Zwei Wege: ein geführtes Einsing-Programm (mehrere Übungen laufen
  automatisch nacheinander: lockern → Resonanz → Beweglichkeit → Höhe →
  sanft zurück) oder eine einzelne Übung in Dauerschleife.

  Aufbau: Übungen (Stufen in Dur + Dauer in Sechzehnteln) → buildPlan()
  legt daraus für Stimme/Richtung/Programm eine Folge von Runden auf einem
  Sechzehntel-Raster an (jede Runde: Akkord, Übung, einen Halbton weiter)
  → Lookahead-Scheduler auf der Audio-Uhr spielt den Plan ab → Anzeige per
  requestAnimationFrame folgt den tatsächlich geplanten Zeiten.

  Tonräume: je Stimme eine bewusst vorsichtige Spanne für Laienchöre
  (PRACTICE_RANGES in harmony.js, bei gemessenem Umfang practiceRange());
  jede Übung legt fest, wo ihr tiefster Ton startet (lowStart) und wie hoch
  ihr höchster Ton höchstens steigt (top), beides in Halbtönen über floor.
  Kein Ton verlässt floor…ceil.

  Stimmlage und persönlichen Umfang liest das Tool aus dem gemeinsamen
  Stimmprofil der App (window.parent.chorVoiceProfile, app.js); ein Tipp auf
  einen Stimm-Chip schreibt die Wahl dorthin zurück, sie gilt dann in allen
  Tools. Direkt geöffnet gilt die im Tool gespeicherte Stimme.

  Einstellungen merkt sich das Tool über window.parent.chorToolStorage
  (Tool-ID 'einsingen', IndexedDB in app.js) — nicht localStorage, der ist
  in dieser App dem Fehlerprotokoll vorbehalten. Direkt geöffnet gibt es
  diese Ablage nicht; dann gilt der Stand nur bis zum Neuladen.
-->
<style>
  :root {
    --accent: #F868B0; --accent-rgb: 248,104,176;
    --bg: #fff7ec; --surface: #ffffff; --surface-2: #fff1e2; --line: #f1ddd0;
    --text: #241b3d; --muted: #8c81a6; --ok: #2f9e5b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; color: var(--text);
    background: radial-gradient(120% 90% at 12% -10%, rgba(var(--accent-rgb), .14), transparent 55%), var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  header { padding: max(14px, env(safe-area-inset-top)) 16px 10px; }
  /* In der App eingebettet: rechts Platz für den Schließen-Knopf der App. */
  html.is-embedded header { padding-right: 68px; }
  h1 { font-size: 1.32rem; margin: .15em 0 0; letter-spacing: -.02em; font-weight: 800; }
  h1 span { color: var(--accent); }

  .tab-bar { display: flex; gap: 4px; padding: 0 16px 12px; }
  .tab-btn { flex: 1 1 0; padding: 9px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: .74rem; font-weight: 700; }
  .tab-btn[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 16px 18px; }
  .panel { border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .panel-head h2 { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0; font-weight: 800; }
  .sub-label { display: flex; align-items: center; gap: 6px; font-size: .62rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 6px; }
  .sub-label:first-child { margin-top: 0; }
  .foot-note { text-align: center; color: var(--muted); font-size: .68rem; line-height: 1.4; margin: 10px 0 0; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 7px 12px; font-size: .74rem; font-weight: 700; color: var(--muted); }
  .chip[aria-pressed="true"] { background: rgba(var(--accent-rgb), .16); border-color: var(--accent); color: var(--accent); }
  .chip small { font-weight: 600; opacity: .75; }

  .help-btn { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .7rem; font-weight: 800; line-height: 1; display: inline-grid; place-items: center; padding: 0; text-transform: none; letter-spacing: 0; }
  .help-btn.is-lg { width: 30px; height: 30px; font-size: .82rem; }

  .switch-row { display: flex; gap: 10px 18px; flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 9px; font-size: .78rem; font-weight: 700; cursor: pointer; position: relative; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch-track { width: 40px; height: 24px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
  .switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(36,27,61,.3); transition: transform .15s; }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::after { transform: translateX(16px); }
  .switch input:focus-visible + .switch-track { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- Bühne: aktuelle Übung ---- */
  .stage { border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 14px 14px 12px; margin-bottom: 12px; }
  .stage-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .stage-group { font-size: .62rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; min-height: 1.2em; }
  .stage-title { font-size: 1.2rem; font-weight: 800; margin: 2px 0 0; letter-spacing: -.01em; }
  .contour { display: flex; align-items: flex-end; gap: 3px; margin: 14px 0 4px; min-height: 40px; }
  .syl { flex: 1 1 auto; min-width: 0; max-width: 54px; padding: 7px 1px; border-radius: 9px; background: var(--surface-2); font-weight: 800; font-size: .86rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: clip; transition: background .08s, color .08s; }
  .contour.is-dense .syl { font-size: .7rem; padding: 6px 0; border-radius: 6px; }
  .contour.is-wordy .syl { font-size: .74rem; padding: 7px 2px; }
  .contour.is-flat .syl { max-width: 64px; }
  .syl.is-now { background: var(--accent); color: #fff; }
  /* Körperübungen: Anweisung groß, darunter ein Countdown-Ring. */
  .body-stage { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 14px 0 4px; }
  .body-move { font-size: 1.05rem; font-weight: 800; line-height: 1.35; margin: 0; }
  .body-ring { width: 58px; height: 58px; position: relative; }
  .body-ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
  .body-ring circle { fill: none; stroke-width: 6; }
  .body-ring .ring-bg { stroke: var(--surface-2); }
  .body-ring .ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  .body-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; }
  .contour.is-waiting .syl { opacity: .45; }
  .stage-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; font-size: .74rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stage-key { color: var(--text); font-weight: 800; }
  .progress { height: 6px; border-radius: 999px; background: var(--surface-2); margin-top: 10px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .25s linear; }
  .stage-prog { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: .72rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .skip-btn { border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); padding: 6px 12px; font-size: .72rem; font-weight: 800; color: var(--text); }

  /* ---- Programme ---- */
  .prog-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prog-card { text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px 12px; }
  .prog-card strong { display: block; font-size: .86rem; }
  .prog-card span { display: block; font-size: .68rem; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .prog-card[aria-pressed="true"] { border-color: var(--accent); background: rgba(var(--accent-rgb), .12); }
  .prog-card[aria-pressed="true"] strong { color: var(--accent); }
  .prog-card-wrap { position: relative; }
  .prog-card-wrap .prog-card { width: 100%; height: 100%; padding-right: 34px; }
  .prog-menu { position: absolute; top: 2px; right: 2px; width: 34px; height: 34px; border-radius: 10px; color: var(--muted); font-weight: 800; font-size: 1rem; }
  .prog-card.is-add { border-style: dashed; color: var(--accent); display: grid; place-items: center; min-height: 58px; }
  .prog-card small { display: block; font-size: .64rem; color: var(--muted); font-weight: 700; margin-top: 2px; }
  /* Editor eigener Programme */
  .ed-name { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 700; }
  .ed-meta { font-size: .74rem; font-weight: 700; color: var(--muted); margin: 8px 0 0; }
  .ed-warn { font-size: .74rem; font-weight: 700; color: #b07e00; margin: 6px 0 0; }
  .ed-list { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .ed-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .ed-row-head { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: .82rem; }
  .ed-row-head span { flex: 1; min-width: 0; }
  .ed-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 800; }
  .ed-btn:disabled { opacity: .35; }
  .ed-row .chip-row { margin-top: 6px; }
  .ed-row .chip { padding: 5px 9px; font-size: .68rem; }
  .ed-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .ed-actions button { padding: 11px 18px; border-radius: 999px; font-weight: 800; font-size: .82rem; border: 1px solid var(--line); background: var(--surface-2); }
  .ed-actions .is-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ed-actions .is-danger { color: #c0392b; }
  .ed-actions button:disabled { opacity: .45; }
  .ed-hint { color: #c0392b; font-size: .72rem; font-weight: 700; text-align: center; min-height: 1.2em; margin: 8px 0 0; }
  .menu-list { display: grid; gap: 8px; }
  .menu-list button { text-align: left; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; }
  .prog-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; counter-reset: item; }
  .prog-item { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: .8rem; font-weight: 700; }
  .prog-item .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .66rem; font-weight: 800; color: var(--muted); }
  .prog-item .syl-hint { font-size: .68rem; color: var(--muted); font-weight: 700; }
  .prog-item.is-done { opacity: .55; }
  .prog-item.is-done .num { background: var(--ok); color: #fff; }
  .prog-item.is-now { border-color: var(--accent); background: rgba(var(--accent-rgb), .1); }
  .prog-item.is-now .num { background: var(--accent); color: #fff; }

  footer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }
  .transport-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .play { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 6px 20px -6px rgba(var(--accent-rgb), .7); }
  .tempo { display: grid; gap: 2px; min-width: 0; }
  .bpm-out { font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bpm-out small { font-weight: 700; color: var(--muted); font-size: .7rem; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .tap-btn { height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-2); color: var(--muted); font-size: .72rem; font-weight: 800; }
  .status { font-size: .68rem; color: var(--muted); text-align: center; margin: 8px 0 0; min-height: 1.2em; }

  .sheet { position: fixed; inset: 0; background: rgba(36,27,61,.35); display: flex; align-items: flex-end; justify-content: center; z-index: 5; }
  .sheet-card { width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 16px 16px max(18px, env(safe-area-inset-bottom)); }
  .sheet-card h2 { font-size: 1rem; margin: 0; }
  .sheet-body { font-size: .86rem; line-height: 1.5; }
  .sheet-body p { margin: 0 0 .7em; }
  .sheet-body ul { margin: 0 0 .7em; padding-left: 1.2em; }
  .sheet-close { display: block; margin: 12px auto 0; padding: 11px 22px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 800; font-size: .82rem; }
  .icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Ein<span>singen</span></h1>
</header>

<nav class="tab-bar" role="tablist" aria-label="Art">
  <button class="tab-btn" type="button" role="tab" data-mode="program" aria-selected="true">Programm</button>
  <button class="tab-btn" type="button" role="tab" data-mode="single" aria-selected="false">Einzelne Übung</button>
</nav>

<main>
  <section class="stage" aria-label="Aktuelle Übung">
    <div class="stage-top">
      <div>
        <div class="stage-group"></div>
        <h2 class="stage-title"></h2>
      </div>
      <button class="help-btn is-lg" type="button" data-help="exercise" aria-label="So geht die Übung">?</button>
    </div>
    <div class="contour" aria-hidden="true"></div>
    <div class="body-stage" hidden>
      <p class="body-move" aria-live="polite"></p>
      <div class="body-ring" aria-hidden="true"><svg viewBox="0 0 58 58"><circle class="ring-bg" cx="29" cy="29" r="25"/><circle class="ring-fg" cx="29" cy="29" r="25" stroke-dasharray="157.1" stroke-dashoffset="0"/></svg><span></span></div>
    </div>
    <div class="stage-meta"><span class="stage-key"></span><span class="stage-range"></span></div>
    <div class="stage-program">
      <div class="progress" aria-hidden="true"><i></i></div>
      <div class="stage-prog"><span class="prog-text"></span><button class="skip-btn" type="button" data-action="skip">Nächste Übung ›</button></div>
    </div>
  </section>

  <section class="panel">
    <span class="sub-label">Stimme <button class="help-btn" type="button" data-help="voice" aria-label="Welche Stimme wählen?">?</button></span>
    <div class="chip-row" data-chips="voice"></div>
    <span class="sub-label">Begleitung <button class="help-btn" type="button" data-help="options" aria-label="Was die Schalter tun">?</button></span>
    <div class="switch-row">
      <label class="switch"><input type="checkbox" role="switch" data-switch="guide"><span class="switch-track"></span>Melodie</label>
      <label class="switch"><input type="checkbox" role="switch" data-switch="drone"><span class="switch-track"></span>Liegeton</label>
    </div>
    <span class="sub-label">Belastung <button class="help-btn" type="button" data-help="load" aria-label="Was die Belastung ändert">?</button></span>
    <div class="chip-row" data-chips="load"></div>
    <span class="sub-label">Einzähler</span>
    <div class="chip-row" data-chips="countIn"></div>
    <span class="sub-label">Einstimmung</span>
    <div class="chip-row" data-chips="cue"></div>
  </section>
  <section class="panel" data-panel="program">
    <div class="panel-head"><h2>Einsing-Programm</h2><button class="help-btn" type="button" data-help="program" aria-label="Wie das Programm funktioniert">?</button></div>
    <div class="prog-cards" data-programs></div>
    <ol class="prog-list"></ol>
  </section>

  <section class="panel" data-panel="single" hidden>
    <div class="panel-head"><h2>Übung wählen</h2></div>
    <div data-groups></div>
    <span class="sub-label">Richtung</span>
    <div class="chip-row" data-chips="direction"></div>
  </section>

  <p class="foot-note">Nie pressen: bei Kratzen, Druck oder Schmerz Pause machen. Hohe Runden darf man auslassen.</p>
</main>

<div class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="panel-head"><h2 id="sheet-title"></h2>
      <button class="icon-btn" type="button" data-action="close-help" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheet-body"></div>
    <button class="sheet-close" type="button" data-action="close-help">Verstanden</button>
  </div>
</div>

<footer>
  <div class="transport-row">
    <button class="play" type="button" aria-label="Starten"></button>
    <label class="tempo"><output class="bpm-out">92 BPM</output><input class="bpm" type="range" min="40" max="160" value="92" aria-label="Tempo der Übung"></label>
    <button class="tap-btn" type="button" aria-label="Tempo eintippen">Tap</button>
  </div>
  <p class="status" role="status">Bereit — am besten mit Kopfhörern.</p>
</footer>

<script src="./harmony.js"></script>
<script>
(function () {
  'use strict';

  if (new URLSearchParams(location.search).has('embedded')) document.documentElement.classList.add('is-embedded');
  // In der App eingebettet: deren Akzentfarbe übernehmen (gleiche Herkunft).
  try {
    if (window.parent !== window) {
      const appStyle = getComputedStyle(window.parent.document.documentElement);
      const accent = appStyle.getPropertyValue('--accent').trim();
      const rgb = appStyle.getPropertyValue('--accent-rgb').trim();
      if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
      if (/^\d+,\s*\d+,\s*\d+$/.test(rgb)) document.documentElement.style.setProperty('--accent-rgb', rgb);
    }
  } catch { /* eigenständig geöffnet oder fremde Herkunft: Standardfarbe */ }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const mod = (n, m) => ((n % m) + m) % m;
  const noteHz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  // Modi, Tonnamen und Satz aus harmony.js (gemeinsam mit Groove Lab,
  // Ausbildung und Piano).
  const H = window.ChorHarmony;
  const { MAJOR, spell, noteLabel, spellCheck } = H;
  /** Halbtöne der Stufe `deg` über dem Grundton — in Dur oder (natürlichem) Moll. */
  const degreeSemis = (deg, mode = 'major') => H.degreeSemis(H.modeSteps(mode), deg);

  // Deutsche Tonnamen: Tonart groß („Es-Dur“), Einzeltöne in Helmholtz-
  // Schreibweise (F, c, c′, c″), wie sie in Chorproben üblich ist.
  const keyLabel = (root, mode = 'major') => (mode === 'minor' ? `${spell(root, root, 'minor').toLowerCase()}-Moll` : `${spell(root, root, 'major')}-Dur`);

  /* ------------------------------------------------------------------------
     INHALT
     ------------------------------------------------------------------------ */

  // Ein Schritt ist eine Sechzehntel; das Tempo meint Viertel. Jede Runde:
  // CUE Schritte Akkord (Anfangston finden), dann die Übung, dann Luft bis
  // zum nächsten vollen Takt — so steht der Akkord immer auf der Eins.
  // Mit Einstimmung „Kadenz“ ist die erste Runde einer Übung einen ganzen
  // Takt lang Kadenz (CUE_CADENCE: I auf 1–2, V7 auf 3, I auf 4).
  const BAR = 16;
  const CUE = 8;
  const CUE_CADENCE = 16;
  const BREATH = 4; // Standard-Atemluft in 16teln; je Übung über `breath`
  const PAUSE = 16; // ein Takt zwischen zwei Programm-Übungen
  const BREATH_IN = 4; // Atemübung: Schläge einatmen …
  const BREATH_EXHALES = [8, 10, 12, 14]; // … und ausatmen, je Runde
  const BODY_BPM = 60; // Körperübungen: Tempo fest
  // Belastung (gemeinsam mit dem Stimmprofil der App): Obergrenze der Übung
  // verschieben, höchstens so viele Rückungen, Tempo-Faktor auf das pro

  // Übung „Akkord“: je Stimme erst der eigene Akkordton (acht Schläge),
  // dann I–IV–V–I (je vier Schläge) mit dem Ton aus dem vierstimmigen
  // Satz. Gerechnet in C mit Grundton 48 für alle Stimmen; die Stufen
  // gelten dann relativ zum Grundton der Runde. Start: jede Stimme auf
  // ihrem Akkordton (S e′, A g, T e, B c), so beginnt der Satz dort.
  const CHORD_HOME = { S: 9, A: 4, T: 2, B: 0 };
  const CHORD_STEPS = { ...Object.fromEntries(MAJOR.map((semis, deg) => [semis, deg])) };
  const semisToDegree = (semis) => CHORD_STEPS[mod(semis, 12)] + 7 * Math.floor(semis / 12);
  function chordExerciseSatb() {
    let prev = { S: 48 + degreeSemis(CHORD_HOME.S), A: 48 + degreeSemis(CHORD_HOME.A), T: 48 + degreeSemis(CHORD_HOME.T), B: 48 };
    const out = [];
    let prevLeading = null;
    for (const deg of [0, 3, 4, 0]) {
      const pcs = [0, 2, 4].map((o) => mod(degreeSemis(deg + o), 12));
      const leading = deg === 4 ? 11 : null;
      prev = voiceChord(pcs, prev, { leading, prevLeading });
      prevLeading = leading;
      out.push(prev);
    }
    return out;
  }

  // starts: Einsatz jedes Tons in 16teln ab dem Ende des Akkords (also
  // inklusive `delay`); die Position in der Runde ist cue + starts[i].
  const roundSteps = (ex, cue) => Math.ceil((cue + ex.length + (ex.breath ?? BREATH)) / BAR) * BAR;
  /** Tonlose Übung (Atem, Körper) — keine Töne, keine Rückungen. */
  const toneless = (ex) => ex.kind === 'breath' || ex.kind === 'body';
  /** Töne der Übung für eine Stimme (nur „Akkord“ hat je Stimme eigene). */
  const notesOf = (ex, voiceId = state.voice) => ex.voiceNotes?.[voiceId] || ex.notes;
  /** Halbtöne eines Tons über dem Grundton: Stufe im Modus plus `alt`. */
  const noteSemis = (ex, note) => degreeSemis(note[0], ex.mode) + (note[3] || 0);
  /** Tiefster und höchster Ton (Halbtöne über dem Grundton) für eine Stimme. */
  function spanOf(ex, voiceId) {
    if (toneless(ex)) return { min: 0, max: 0 };
    const semis = notesOf(ex, voiceId).map((n) => noteSemis(ex, n));
    return { min: Math.min(...semis), max: Math.max(...semis) };
  }
  function prepareExercise(ex) {
    if (ex.chord) {
      const satb = chordExerciseSatb();
      ex.satb = satb;
      ex.voiceNotes = Object.fromEntries(SATB.map((v) => [v, [[CHORD_HOME[v], 32], ...satb.map((c) => [semisToDegree(c[v] - 48), 16])]]));
      ex.notes = ex.voiceNotes.A;
      // Begleitung: Grundton und Quinte zum gehaltenen Ton, dann der Satz
      // (in C mit Grundton 48, beim Spielen transponiert).
      ex.accompany = [[0, [48, 55], 32], ...satb.map((c, k) => [32 + 16 * k, [c.B, c.T, c.A, c.S], 16])];
    }
    if (ex.kind === 'body') { ex.notes = []; ex.syllables = []; }
    let at = ex.delay || 0;
    ex.starts = ex.notes.map(([, len]) => { const start = at; at += len; return start; });
    ex.length = at;
    ex.steps = roundSteps(ex, CUE);
    Object.assign(ex, spanOf(ex, 'A'));
  }
  EXERCISES.forEach(prepareExercise);
  // Fassung für Belastung „leicht“: dieselbe Übung (gleiche ID, gleiches
  // gemerktes Tempo) mit kürzerem Tonraum.
  EXERCISES.forEach((ex) => {
    if (!ex.easyNotes) return;
    ex.easy = { ...ex, notes: ex.easyNotes, syllables: ex.easySyllables, hint: ex.easyHint, isEasy: true };
    prepareExercise(ex.easy);
  });
  const exById = (id) => EXERCISES.find((x) => x.id === id);
  /** Die Fassung einer Übung, die bei der aktuellen Belastung klingt. */
  const variantOf = (ex) => (ex && state.load === 'leicht' && ex.easy ? ex.easy : ex);

  // einer Chorprobe: lockern → Resonanz → Beweglichkeit → Höhe → sanft
  // zurück (Summen abwärts als Ausklang).
  // about: Untertitel der Karte.
  const PROGRAMS = [
    { id: 'kurz', name: 'Kurz', about: 'Der Klassiker vor der Probe', items: [['lippen', 3], ['mimemamomu', 4], ['nja', 3], ['dreiklang', 4], ['oktave', 3], ['summen', 3, 'down']] },
    { id: 'lang', name: 'Ausführlich', about: 'Alles einmal, in Ruhe', items: [['atem'], ['lippen', 4], ['sirene', 3], ['zwerchfell', 3], ['summen', 3], ['mimemamomu', 4], ['nja', 3],
      ['vokale', 2], ['moll5', 3], ['katze', 3], ['dreiklang', 4], ['koloratur', 3], ['oktave', 4], ['summen', 4, 'down']] },

  const DIRECTIONS = [['updown', 'auf und ab'], ['up', 'aufwärts'], ['down', 'abwärts']];

  const HELP = {
    program: ['Einsing-Programm', ['Das Programm spielt mehrere Übungen automatisch nacheinander — wie der Anfang einer Chorprobe: erst lockern und summen, dann Resonanz und Vokale, dann Beweglichkeit, zum Schluss die Höhe und ein ruhiger Ausklang.',
      'Jede Übung beginnt mit einem Akkord und steigt dann Runde für Runde einen Halbton, bevor sie wieder zurückgeht. Zwischen zwei Übungen ist ein Takt Pause.',
