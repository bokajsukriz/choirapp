      const rm = lick.root - 12 * Math.floor((lick.root - 55) / 12);
      ui.drone = engine.drone(rm, engine.master);
      setFeedback('Grundton und Quinte liegen. Welcher Ton beginnt den Lick?');
    });
  }
  /** Eine Taste gedrückt (Schritt 3: Startton finden): nur ausprobieren und auswählen —
   *  erst „Ton einloggen“ prüft, sonst führte schon der erste Tipp zur Lösung. */
  function onOwnKey(midi) {
    const lick = currentLick();
    if (!lick || ui.step !== 3 || ui.running || ui.foundKey !== null || ui.review) return;
    ui.pickedKey = midi;
    setFeedback('Ton ausgewählt. Passt er zum Anfang des Licks? Dann logg ihn ein.', '');
    renderPanel(lick, itemOf(lick.id));
  }
  /** „Ton einloggen“: die ausgewählte Taste gegen den ersten Ton prüfen. */
  function lockStart() {
    const lick = currentLick();
    if (!lick || ui.step !== 3 || ui.pickedKey === null || ui.foundKey !== null) return;
    const first = lick.root + lick.notes[0][2];
    const midi = ui.pickedKey;
    if (mod(midi, 12) === mod(first, 12)) {
      ui.foundKey = midi; ui.pickedKey = null;
      releaseDrone();
      const it = itemOf(lick.id);
      it.step = Math.max(it.step, 3);
      setFeedback(`Gefunden – das ist die ${degreeLabel(lick.notes[0][2])}.`, 'good');
      persist();
    } else {
      ui.startFails++; ui.pickedKey = null;
      setFeedback(ui.startFails >= 3 ? 'Noch nicht. Hör den Lick nochmal an – wie beginnt er?' : 'Das ist es noch nicht – probier eine andere Taste.', '');
    }
    renderPanel(lick, itemOf(lick.id));
    paintKeys();
  }
  /** Schritt 3 verlassen: gefundene und ausgewählte Taste, Fehlversuche und Grundton weg. */
  function resetStartton() {
    ui.foundKey = null; ui.pickedKey = null; ui.startFails = 0;
    releaseDrone();
  }
  function showMe() {
    const lick = currentLick();
    const first = lick.root + lick.notes[0][2] + 12 * octaveOf(lick);
    const cand = [...keyEls.keys()].filter((m) => mod(m, 12) === mod(first, 12)).sort((a, b) => Math.abs(a - first) - Math.abs(b - first))[0];
    ui.foundKey = cand ?? first; ui.pickedKey = null;
    releaseDrone();
    const it = itemOf(lick.id);
    it.step = Math.max(it.step, 3);
    setFeedback(`Das ist die ${degreeLabel(lick.notes[0][2])} – der erste Ton.`, 'good');
    persist();
    renderLick();
  }

  /* Schritt 4: stückweise */
  function partBars(lick, part) {
    const [a, b] = part;
    const k0 = Math.floor(lick.notes[a][0] / TICKS_BAR), k1 = Math.floor(lick.notes[b - 1][0] / TICKS_BAR);
    return { k0, k1, n: k1 - k0 + 1, only: lick.notes.map((_, i) => i).filter((i) => i >= a && i < b) };
  }
  function stepPart() {
    const lick = currentLick();
    const partNo = clamp(ui.part, 0, lick.parts.length - 1);
    const { k0, k1, n, only } = partBars(lick, lick.parts[partNo]);
    const octave = octaveOf(lick);
    const tl = makeTimeline(lick);
    let bar = tl.countIn(0);
    // Vorbild: nur dieser Teil, Groove full; danach ein Takt Groove weiter.
    for (let b = 0; b < n; b++) tl.groove(bar + b, 'full');
    tl.lick(bar, { from: k0, to: k1 + 1, only, octave });
    bar += n;
    tl.groove(bar, 'full'); bar++;
    // Du: ein Takt (bei Teilen über die Taktmitte hinaus zwei) mit Groove backbeat.
    const you = bar;
    for (let b = 0; b < n; b++) tl.groove(you + b, 'backbeat');
    tl.lick(you, { from: k0, to: k1 + 1, only, expect: true, octave });
    tl.end(you + n);
    beginRun('part', tl, (info) => {
      const exp = tl.expected;
      const tol = toleranceFor(minGapSec(exp));
      const window = timeIn(info.taps, info.t0 + you * tl.barSec - tol, info.t0 + (you + n) * tl.barSec + .25);
      const got = window.map((x) => ({ midi: x.midi, t: x.t - window[0].t }));
      const want = exp.map((e) => ({ midi: e.midi, t: e.t - exp[0].t }));
      const msg = window.length ? partMessage({ want, got, tol }) : { ok: false, text: 'Da kam noch nichts. Hör den Teil nochmal – dann bist du nach dem einen Takt Groove dran.' };
      // Anzeige relativ zum eigenen ersten Ton.
      const shift = window.length ? window[0].t - info.t0 - exp[0].t : 0;
      const mapped = assign(exp.map((e) => ({ t: e.t + info.t0 + shift, pc: e.pc })), window, tol);
      ui.result = { kind: 'part', part: partNo, ok: msg.ok, span: n * tl.barSec, bars: n, barSec: tl.barSec, ...relTimes(mapped, info.t0 + you * tl.barSec + shift), hits: mapped.hits };
      setFeedback(msg.text, msg.ok ? 'good' : '');
    });
  }
  /** Zeiten einer Zuordnung relativ zu `origin` (für die Zeitleiste). */
  function relTimes(m, origin) {
    return { exp: m.exp.map((e) => ({ ...e, t: e.t - origin })), taps: m.taps.map((x) => ({ ...x, t: x.t - origin })) };
  }
  function partNext() {
    const lick = currentLick();
    const it = itemOf(lick.id);
    const partNo = clamp(ui.part, 0, lick.parts.length - 1);
    it.parts = Math.max(it.parts, partNo + 1);
    ui.result = null; setFeedback('');
    if (partNo === lick.parts.length - 1) { it.step = Math.max(it.step, 4); ui.step = 5; }
    else ui.part = partNo + 1;
    persist(); renderLick();
  }

  /* Schritt 5: ganz */
  function stepWhole() {
    const lick = currentLick();
    const it = itemOf(lick.id);
    const r = Math.min(it.whole, 2);
    const level = ['full', 'backbeat', 'snare'][r];
    const octave = octaveOf(lick);
    const tl = makeTimeline(lick);
    let bar = tl.countIn(0);
    for (let b = 0; b < lick.bars; b++) tl.groove(bar + b, level);
    tl.lick(bar, { octave });
    bar += lick.bars;
    const you = bar;
    for (let b = 0; b < lick.bars; b++) tl.groove(you + b, level);
    tl.lick(you, { expect: true, octave });
    tl.end(you + lick.bars);
    beginRun('whole', tl, (info) => {
      const exp = tl.expected;
      const tol = toleranceFor(minGapSec(exp));
      const start = info.t0 + you * tl.barSec;
      const window = timeIn(info.taps, start - tol - .1, start + lick.bars * tl.barSec + tol);
      noteRunDelay(exp.map((e) => e.t + info.t0), info.taps.filter((x) => x.t >= start - .1 && x.t <= start + lick.bars * tl.barSec + .45).map((x) => x.t));
      const abs = assign(exp.map((e) => ({ t: e.t + info.t0, pc: e.pc })), window, tol);
      const success = abs.hits === exp.length;
      let text;
      if (success) text = 'Genau so!';
      else if (!window.length) text = 'Da kam noch nichts. Hör den Lick nochmal – nach dem Vorbild bist du dran.';
      else {
        const want = exp.map((e) => ({ midi: e.midi, t: e.t - exp[0].t }));
        const got = window.map((x) => ({ midi: x.midi, t: x.t - window[0].t }));
        const pm = partMessage({ want, got, tol });
        if (pm.ok && pm.text.startsWith('Genau')) {
          const offs = abs.exp.filter((e) => e.off !== undefined).map((e) => e.off);
          const mean = offs.length ? offs.reduce((a, b) => a + b, 0) / offs.length : (window[0].t - (exp[0].t + info.t0));
          text = `Die Töne und der Rhythmus stimmen – du bist als Ganzes etwas ${mean < 0 ? 'früh' : 'spät'} eingesetzt. Zähl den Einzähler innerlich weiter.`;
        } else text = pm.text;
      }
      ui.result = { kind: 'whole', ok: success, span: lick.bars * tl.barSec, bars: lick.bars, barSec: tl.barSec, ...relTimes(abs, start), hits: abs.hits };
      setFeedback(text, success ? 'good' : '');
      if (success) { it.whole = Math.min(3, it.whole + 1); if (it.whole >= 3) it.step = Math.max(it.step, 5); persist(); }
    });
  }

  /* Schritt 6: durchhalten */
  function tlHold(lick, stageNo, withDemo) {
    const st = HOLD_STAGES[stageNo - 1];
    const plan = holdPlan(stageNo);
    const octave = octaveOf(lick);
    const tl = makeTimeline(lick);
    let bar = tl.countIn(0);
    if (withDemo) {
      for (let b = 0; b < lick.bars; b++) tl.groove(bar + b, 'full');
      tl.lick(bar, { octave });
      bar += lick.bars;
      bar = tl.countIn(bar);
    }
    const start = bar;
    plan.forEach((snare, b) => { if (snare) tl.groove(start + b, 'snare'); });
    // Der Lick läuft nicht mit: eigenes Spiel über `bars` Takte, der Baustein wiederholt sich.
    for (let rep = 0; rep < st.bars / lick.bars; rep++) tl.lick(start + rep * lick.bars, { expect: true, octave });
    // Schlussschlag auf der Eins nach dem letzten Takt.
    tl.events.push({ t: (start + st.bars) * tl.barSec, type: 'drum', kind: 'kick' }, { t: (start + st.bars) * tl.barSec, type: 'drum', kind: 'open' });
    tl.end(start + st.bars + .5);
    return { tl, start, plan, st };
  }
  function stepHold() {
    const lick = currentLick();
    const it = itemOf(lick.id);
    const stageNo = ui.holdStage;
    const withDemo = !ui.lastRunAt[lick.id] || Date.now() - ui.lastRunAt[lick.id] > 10 * 60 * 1000;
    const { tl, start, plan, st } = tlHold(lick, stageNo, withDemo);
    beginRun('hold', tl, (info) => {
      ui.lastRunAt[lick.id] = Date.now();
      const exp = tl.expected;
      const tol = toleranceFor(minGapSec(exp));
      const taps = timeIn(info.taps, info.t0 + start * tl.barSec - tol - .1, info.t0 + (start + st.bars) * tl.barSec + tol).map((x) => ({ t: x.t, pc: x.pc }));
      noteRunDelay(exp.map((e) => e.t + info.t0), info.taps.filter((x) => x.t >= info.t0 + start * tl.barSec - .1 && x.t <= info.t0 + (start + st.bars) * tl.barSec + .45).map((x) => x.t));
      const result = judgeHold({ expected: exp.map((e) => ({ t: e.t + info.t0, pc: e.pc })), taps, barStart: info.t0 + start * tl.barSec, barSec: tl.barSec, tol, plan });
      ui.result = { kind: 'hold', stage: stageNo, ...result };
      setFeedback(holdMessage(result, stageNo), result.held ? 'good' : '');
      if (result.held && stageNo === it.hold + 1) { it.hold = Math.min(4, stageNo); persist(); }
      reportRun(lick, result.held, st.bars * tl.barSec);
    });
  }
  function reportRun(lick, right, seconds) {
    if (selfTesting || !progressApi) return;
    try { progressApi.add({ area: 'licks', level: lick.level, right: !!right, seconds: Math.min(600, seconds) }); } catch { /* App weg */ }
  }

  /* Schritt 7: Notenbild, Mitspielen */
  function stepRoll() {
    const lick = currentLick();
    beginRun('roll', tlHear(lick, 1), () => {
      const it = itemOf(lick.id);
      it.step = Math.max(it.step, 7);
      persist();
    });
  }
  /** Marke und leuchtende Tasten im Notenbild (nur dort, nur im Schritt „Notenbild“). */
  function rollFrame() {
    requestAnimationFrame(rollFrame);
    const lick = currentLick();
    const ph = $('#roll-ph');
    if (!lick || ui.step !== 7 || !ph) return;
    if (run.playing && run.tl && ui.running === 'roll') {
      const now = engine.ctx.currentTime - run.t0 - run.tl.tickSec * 0; // ab Einzähler
      const total = lick.bars * TICKS_BAR * run.tl.tickSec;
      const t = now - run.tl.barSec; // Lick beginnt nach dem Einzähler
      const roll = $('[data-roll]');
      const left = Number(roll.dataset.left), right = Number(roll.dataset.right);
      if (t >= 0 && t <= total) {
        const x = left + (t / total) * (right - left);
        ph.setAttribute('x1', x.toFixed(1)); ph.setAttribute('x2', x.toFixed(1)); ph.style.visibility = 'visible';
      } else ph.style.visibility = 'hidden';
      const lit = new Set();
      const octave = octaveOf(lick);
      lick.notes.forEach((n) => { const s = n[0] * run.tl.tickSec, e = s + n[1] * run.tl.tickSec; if (t >= s && t < e) lit.add(lick.root + n[2] + 12 * octave); });
      setLit(lit);
    } else { ph.style.visibility = 'hidden'; setLit(new Set()); }
  }

  /* ---- Einschätzung und Wiederholen ---- */
  function setRating(id, rating) {
    const it = itemOf(id);
    if (rating === 'solid' && it.hold < 2) return;
    const { due, streak } = nextDue(rating, it.streak, localDate());
    Object.assign(it, { rating, due, streak });
    ui.visitRated = true;
    persist();
  }

  function startReview() {
    const ids = dueIds(state.items, localDate());
    if (!ids.length) { ui.review = 'none'; show('list'); renderList(); return; }
    ui.review = { queue: ids, i: 0, phase: 'hear' };
    openReviewItem();
  }
  function openReviewItem() {
    const r = ui.review;
    const id = r.queue[r.i];
    r.phase = 'hear';
    openLick(id, 1);
    ui.review = r;
    ui.holdStage = clamp(itemOf(id).hold, 1, 4);
    ui.result = null;
    renderLick();
  }
  function reviewPanelHtml(lick, it) {
    const r = ui.review;
    const head = `<p class="note" style="margin-top:0">Wiederholen ${r.i + 1} von ${r.queue.length}</p>`;
    if (r.phase === 'hear') {
      return `${head}<p>${esc(lick.intro)}</p>${placeholderHtml()}
        <div class="actions"><button class="btn primary" type="button" data-act="review-hear"${ui.running ? ' disabled' : ''}>▶ Anhören</button>${stopBtn('hear')}
        <button class="btn" type="button" data-act="review-phase" data-phase="hold">Weiter: Durchhalten</button></div>`;
    }
    if (r.phase === 'hold') {
      const st = HOLD_STAGES[ui.holdStage - 1];

    if (t.dataset.step) { const k = Number(t.dataset.step); const lick = currentLick(); if (lick && stepUnlocked(lick, k)) { stopRun(true); if (ui.step === 3 && k !== 3) resetStartton(); releaseDrone(); ui.step = k; ui.result = null; setFeedback(''); renderLick(); } return; }

        ui.askedLeave = false; ui.review = null; show('list'); renderList(); break;

      case 'delay-reset': calib.tapMs = 0; delayHint.list.length = 0; delayHint.open = null; delayHint.dismissed = false; saveCalibration(); renderSheet(); break;

      case 'stop': stopRun(true); releaseDrone(); rerender(); break;
      case 'next-step': { const it = itemOf(lick.id); if (ui.step <= 3) it.step = Math.max(it.step, ui.step); if (ui.step === 3) resetStartton(); ui.step = Math.min(ui.step + 1, stepsShown().length); ui.result = null; setFeedback(''); persist(); renderLick(); break; }
      case 'hear': stepHear(); break;
      case 'sing': stepSing(); break;
      case 'startton': stepStartton(); break;
      case 'show-me': showMe(); break;
      case 'lock-start': lockStart(); break;
      case 'part-run': stepPart(); break;
      case 'part-next': partNext(); break;
      case 'part-prev': ui.part = Math.max(0, ui.part - 1); ui.result = null; setFeedback(''); renderLick(); break;
      case 'whole-run': stepWhole(); break;
      case 'hold-run': stepHold(); break;
      case 'hold-next': ui.holdStage = Math.min(4, ui.holdStage + 1); ui.result = null; setFeedback(''); renderLick(); break;
      case 'roll-run': stepRoll(); break;
      case 'roll-done': { const it = itemOf(lick.id); it.step = Math.max(it.step, 7); persist(); stopRun(true); renderLick(); break; }

  /* ------------------------------------------------------------------------
     SELBSTPRÜFUNG — Konsole des iframes: licks.selfCheck() → Liste der Fehler
     (leer = bestanden). Die judgeHold-Vektoren stehen wortgleich in uebe-lab.html.
     ------------------------------------------------------------------------ */
  /** Gemeinsame Testvektoren für judgeHold (4/4, 90 BPM, Backbeat: Soll auf 2 und 4 je Takt, tol 0,1 s). */
  function holdVectors() {
    const errors = [];
    const barSec = 4 * 60 / 90, tol = .1;
    const expectedFor = (bars) => Array.from({ length: bars }, (_, b) => [b * barSec + barSec / 4, b * barSec + 3 * barSec / 4]).flat();
    const judge = (bars, taps, stageNo, expected = expectedFor(bars)) => judgeHold({ expected, taps, barStart: 0, barSec, tol, plan: holdPlan(stageNo) });
    // 1. alle Anschläge exakt
    let r = judge(16, expectedFor(16), 4);
    if (!r.held || r.tendency !== 'steady' || r.lostAt !== null) errors.push(`Vektor 1: ${r.held}/${r.tendency}/${r.lostAt}`);
    // 2. jeder Anschlag 8 ms früher als der vorige (16 Takte)
    r = judge(16, expectedFor(16).map((t, i) => t - .008 * i), 4);
    if (r.tendency !== 'faster') errors.push(`Vektor 2: ${r.tendency}`);
    // 3. Anschläge nur bis einschließlich Takt 9 (16 Takte)
    r = judge(16, expectedFor(9), 4);
    if (r.lostAt !== 10 || r.held) errors.push(`Vektor 3: lostAt ${r.lostAt}, held ${r.held}`);
    // 4. Stufe 3, stille Takte 3–4 um 0,12 s verschoben: Takt 5 exakt → 'good', Takt 5 und 6 daneben → 'late'
    const shifted = (bars, fn) => expectedFor(bars).map((t) => fn(Math.floor(t / barSec) + 1, t));
    r = judge(8, shifted(8, (bar, t) => (bar === 3 || bar === 4 ? t + .12 : t)), 3);
    if (r.reentry !== 'good') errors.push(`Vektor 4a: reentry ${r.reentry}`);
    r = judge(8, shifted(8, (bar, t) => (bar >= 3 && bar <= 6 ? t + .12 : t)), 3);
    if (r.reentry !== 'late') errors.push(`Vektor 4b: reentry ${r.reentry}`);
    // 5. doppelt so viele Anschläge wie Soll
    const e8 = expectedFor(8);
    r = judge(8, [...e8, ...e8.map((t) => t + .02)], 2);
    const base = judge(8, e8, 2);
    if (!(r.bars.reduce((a, b) => a + b.extra, 0) > 0) || r.bars.reduce((a, b) => a + b.hit, 0) !== base.bars.reduce((a, b) => a + b.hit, 0)) errors.push('Vektor 5: extra/Treffer');
    // Tonklassen: falsche Tonklasse trifft nicht
    r = judgeHold({ expected: [{ t: 1, pc: 0 }, { t: 2, pc: 4 }], taps: [{ t: 1, pc: 0 }, { t: 2, pc: 5 }], barStart: 0, barSec: 4, tol, plan: [true] });
    if (r.bars[0].hit !== 1) errors.push(`Tonklasse: ${r.bars[0].hit} statt 1 Treffer`);
    return errors;
  }

  function selfCheck() {
    const errors = [];
    // --- Inhalt
    const ids = new Set();
    let lastCat = null;
    for (const l of LICKS) {
      const w = `Lick ${l.id}`;
      if (ids.has(l.id)) errors.push(`${w}: doppelte ID`);
      ids.add(l.id);
      if (!CATS.some(([c]) => c === l.cat) || !PRESET_NAMES.includes(l.preset) || !SYNTH_PRESETS.some((p) => p.name === l.preset)) errors.push(`${w}: Kategorie oder Preset`);
      if (!(l.intro.length <= 160) || !(l.more.length <= 185)) errors.push(`${w}: Text zu lang (${l.intro.length}/${l.more.length})`);
      let end = 0;
      l.notes.forEach((n, i) => {
        if (n[0] < end) errors.push(`${w}: Ton ${i + 1} überlappt oder liegt vor dem vorigen`);
        end = n[0] + n[1];
        if (n[1] % 3 || n[0] % 3) errors.push(`${w}: Ton ${i + 1} nicht auf dem Sechzehntelraster`);
        if (end > l.bars * TICKS_BAR) errors.push(`${w}: Ton ${i + 1} über das Ende hinaus`);
        const midi = l.root + n[2];
        if (midi < 28 || midi > 88) errors.push(`${w}: Ton ${i + 1} MIDI ${midi}`);
        if (n[3] && n[3].glide && (i === 0 || Math.abs(n[2] - l.notes[i - 1][2]) > 2)) errors.push(`${w}: Glide auf Ton ${i + 1} ungültig`);
      });
      let next = 0;
      l.parts.forEach(([a, b], i) => {
        if (a !== next) errors.push(`${w}: Teil ${i + 1} beginnt bei ${a}, erwartet ${next}`);
        next = b;
        if (b - a < 2 || b - a > 8) errors.push(`${w}: Teil ${i + 1} hat ${b - a} Töne`);
        if (b > a && b <= l.notes.length && l.notes[b - 1][0] + l.notes[b - 1][1] - l.notes[a][0] > TICKS_BAR) errors.push(`${w}: Teil ${i + 1} länger als ein Takt`);
      });
      if (next !== l.notes.length) errors.push(`${w}: Teile enden bei ${next} statt ${l.notes.length}`);
      // Groove: Bassdrum/Snare nur auf Hauptschlägen, Hi-Hat gleichmäßig; Raster 3 genau bei Tönen auf t % 6 ≠ 0
      for (const level of ['full', 'backbeat', 'snare', 'off']) {
        const g = grooveFor(l, level);
        if ([...g.kick, ...g.snare].some((t) => t % 12)) errors.push(`${w}/${level}: Bassdrum oder Snare nicht auf einem Hauptschlag`);
        if (level !== 'full' && g.hat.length) errors.push(`${w}/${level}: Hi-Hat in ausgedünnter Stufe`);
        if (level === 'off' && (g.kick.length || g.snare.length)) errors.push(`${w}: Stufe off spielt`);
        if (level === 'snare' && (g.kick.length || g.snare.join() !== '12,36')) errors.push(`${w}: Stufe snare`);
        if (level === 'backbeat' && (g.kick.join() !== '0,24' || g.snare.join() !== '12,36')) errors.push(`${w}: Stufe backbeat`);
        if (level === 'full') {
          const step = l.notes.some((n) => n[0] % 6) ? 3 : 6;
          if (g.hat.length !== TICKS_BAR / step || g.hat.some((t, i) => t !== i * step)) errors.push(`${w}: Hi-Hat-Raster (${g.hat.length})`);
        }
      }
      // Tastatur
      for (const shift of [-1, 0, 1]) {
        const [lo, hi] = keyboardRange(l, shift);
        const whites = whitesBetween(lo, hi);
        const s = 12 * shift;
        const ok = l.notes.every((n) => l.root + n[2] + s >= lo && l.root + n[2] + s <= hi);
        if (!isWhite(lo) || !isWhite(hi) || whites < MIN_WHITES || lo < KEY_MIN || hi > KEY_MAX) errors.push(`${w}: Tastatur ${shift}: ${lo}–${hi} (${whites} weiße)`);
        if (shift === 0 && (whites > 12 || !ok)) errors.push(`${w}: Tastatur 0: ${whites} weiße Tasten, Töne ${ok ? 'drin' : 'außerhalb'}`);
        if (shift !== 0 && !ok && octaveLimits(l)[shift > 0 ? 1 : 0] === shift) errors.push(`${w}: Tastatur ${shift} schneidet Töne ab`);
      }
      void lastCat; lastCat = l.cat;
    }
    const hatThree = LICKS.filter((l) => hatStep(l) === 3).map((l) => l.id).sort().join();
    if (hatThree !== ['arpMoll', 'hookAufA', 'bassFunk16', 'fillGlideBlue', 'hookBlueThird'].sort().join()) errors.push(`Hi-Hat-Raster 3 bei: ${hatThree}`);
    if (LICKS.length !== 8) errors.push(`${LICKS.length} Licks`);
    // --- holdPlan
    const t = true, f = false;
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    if (!eq(holdPlan(1), Array(4).fill(t)) || !eq(holdPlan(2), Array(8).fill(t))) errors.push('holdPlan Stufe 1/2');
    if (!eq(holdPlan(3), [t, t, f, f, t, t, f, f])) errors.push(`holdPlan Stufe 3: ${holdPlan(3)}`);
    if (!eq(holdPlan(4), [t, t, f, f, f, f, t, t, f, f, f, f, t, t, f, f])) errors.push(`holdPlan Stufe 4: ${holdPlan(4)}`);
    if (HOLD_STAGES.length !== 4) errors.push('HOLD_STAGES');
    errors.push(...holdVectors());
    // --- holdMessage: jede Zeile der Tabelle
    const msg = (res, st) => holdMessage({ held: false, tendency: 'steady', lostAt: null, reentry: null, bars: [], ...res }, st);
    const M = [
      [msg({ held: true }, 2), 'Durchgehalten – 8 Takte, ruhig und gleichmäßig.'],
      [msg({ held: true, tendency: 'faster' }, 1), 'Durchgehalten! Zum Ende hin bist du etwas schneller geworden – lass die Pausen ruhig lang.'],
      [msg({ held: true, tendency: 'slower' }, 1), 'Durchgehalten! Zum Ende hin bist du etwas langsamer geworden – denk an den Backbeat.'],
      [msg({ lostAt: 6, reentry: 'late' }, 3), 'Bis Takt 5 lief es stabil. In der Stille zählst du beim nächsten Mal leise mit.'],
      [msg({ lostAt: 6, reentry: 'good' }, 3), 'Bis Takt 5 lief es stabil. Danach ist der Faden gerissen – das ist beim Durchhalten ganz normal.'],
      [msg({ lostAt: 6, reentry: 'late' }, 2), 'Bis Takt 5 lief es stabil. Danach ist der Faden gerissen – das ist beim Durchhalten ganz normal.'],
      [msg({ tendency: 'faster' }, 2), 'Fast! Du bist nach und nach schneller geworden. Nochmal – diesmal bewusst gemütlich.'],
      [msg({ tendency: 'slower' }, 2), 'Fast! Du bist nach und nach langsamer geworden. Nochmal – die Snare zieht dich.'],
      [msg({}, 2), 'Fast! Ein paar Takte waren wackelig. Nochmal – ruhig und gleichmäßig.'],
    ];
    M.forEach(([got, want], i) => { if (got !== want) errors.push(`holdMessage ${i + 1}: „${got}“`); });
    // --- partMessage
    const pm = (want, got) => partMessage({ want: want.map(([midi, t]) => ({ midi, t })), got: got.map(([midi, t]) => ({ midi, t })), tol: .08 }).text;
    const P = [
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [64, 1]]), 'Genau so!'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [64, 1.3]]), 'Die Töne stimmen! Der 3. kam etwas spät.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .3], [64, 1]]), 'Die Töne stimmen! Der 2. kam etwas früh.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5]]), 'Das waren 2 Töne, im Teil sind es 3. Hör ihn nochmal.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [64, 1], [65, 1.5]]), 'Das waren 4 Töne, im Teil sind es 3. Hör ihn nochmal.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [61, .5], [64, 1]]), 'Fast! Die Richtung stimmt bis Ton 1. Ton 2 liegt einen halben Schritt höher.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [66, 1]]), 'Fast! Die Richtung stimmt bis Ton 2. Ton 3 liegt einen ganzen Schritt tiefer.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [70, 1]]), 'Fast! Die Richtung stimmt bis Ton 2. Ton 3 liegt weiter tiefer.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[61, 0], [62, .5], [64, 1]]), 'Der erste Ton liegt einen halben Schritt tiefer.'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [64, 1]].map(([m, x]) => [m + 12, x])), 'Genau so! (eine Oktave höher – geht auch)'],
      [pm([[60, 0], [62, .5], [64, 1]], [[60, 0], [62, .5], [64, 1]].map(([m, x]) => [m - 12, x])), 'Genau so! (eine Oktave tiefer – geht auch)'],
    ];
    P.forEach(([got, want], i) => { if (got !== want) errors.push(`partMessage ${i + 1}: „${got}“ statt „${want}“`); });
    if (!partMessage({ want: [{ midi: 60, t: 0 }, { midi: 62, t: .5 }], got: [{ midi: 60, t: 0 }, { midi: 62, t: .9 }], tol: .08 }).ok) errors.push('partMessage: richtige Töne mit falschem Rhythmus zählen als geschafft');
    // --- degreeLabel
    const want = ['1', '♭2', '2', '♭3', '3', '4', '♭5', '5', '♭6', '6', '♭7', '7'];
    for (let s = -12; s <= 24; s++) if (degreeLabel(s) !== want[mod(s, 12)]) errors.push(`degreeLabel ${s}`);
    // --- nextDue
    const nd = (r, s, d = '2026-03-10') => JSON.stringify(nextDue(r, s, d));
    if (nd('shaky', 2) !== '{"due":"2026-03-11","streak":0}') errors.push(`nextDue wackelig: ${nd('shaky', 2)}`);
    if (nd('ok', 1) !== '{"due":"2026-03-13","streak":0}') errors.push(`nextDue geht schon: ${nd('ok', 1)}`);
    if (nd('solid', 0) !== '{"due":"2026-03-17","streak":1}' || nd('solid', 1) !== '{"due":"2026-03-31","streak":2}' || nd('solid', 2) !== '{"due":"2026-05-09","streak":2}') errors.push(`nextDue sitzt: ${nd('solid', 0)} ${nd('solid', 1)} ${nd('solid', 2)}`);
    if (nd('shaky', 1, '2026-12-31') !== '{"due":"2027-01-01","streak":0}' || nd('ok', 0, '2026-12-30') !== '{"due":"2027-01-02","streak":0}' || nd('solid', 0, '2026-02-25') !== '{"due":"2026-03-04","streak":1}') errors.push('nextDue: Monats-/Jahreswechsel');

    // Folge 7 → 21 → 60 und Zurücksetzen
    { let s = 0, d = [];

      if (d.join() !== '2026-01-08,2026-01-22,2026-03-02,2026-03-02') errors.push(`Streak-Folge: ${d}`);

    errors.push(...stateCheck());

    errors.push(...flowCheck());
    errors.push(...delayCheck());

  /** Speichern/Laden: neu, leer, kaputt, unbekannte IDs, Begrenzungen. */
  function stateCheck() {
    const errors = [];
    const canon = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a.localeCompare(b))) : x));
    const eq = (a, b) => canon(a) === canon(b);
    if (!eq(sanitizeLicksState(null), freshState()) || !eq(sanitizeLicksState({}), freshState()) || !eq(sanitizeLicksState('x'), freshState()) || !eq(sanitizeLicksState({ v: 2, lick: 'arpMoll' }), freshState())) errors.push('sanitize: leer/kaputt/ohne v');
    const good = { v: 1, lick: 'arpMoll', notes: 'off', glide: false, octave: { arpMoll: 1, hookPenta: -1 }, sound: { arpMoll: 'Soft Brass' },
      items: { arpMoll: { step: 5, parts: 4, whole: 2, hold: 3, rating: 'ok', streak: 1, due: '2026-05-01' } } };
    const s = sanitizeLicksState(JSON.parse(JSON.stringify(good)));
    if (!eq(s, { ...good, sound: { arpMoll: 'Soft Brass' } })) errors.push(`sanitize: Roundtrip ${JSON.stringify(s)}`);
    if (!eq(sanitizeLicksState(JSON.parse(JSON.stringify(s))), s)) errors.push('sanitize: nicht idempotent');
    const bad = sanitizeLicksState({ v: 1, lick: 'quatsch', notes: 5, glide: 'ja', octave: { arpMoll: 7, unbekannt: 1 }, sound: { arpMoll: 'Fagott' },
      items: { unbekannt: { step: 1 }, arpMoll: { step: 99, parts: 50, whole: -3, hold: 1.5, rating: 'toll', streak: 9, due: 'irgendwann' }, hookPenta: 'kaputt' } });
    const it = bad.items.arpMoll;
    if (bad.lick !== 'hookPenta' || bad.notes !== 'last' || bad.glide !== true || 'arpMoll' in bad.octave || 'unbekannt' in bad.octave || 'arpMoll' in bad.sound) errors.push(`sanitize: kaputte Werte → Standard (${JSON.stringify(bad).slice(0, 120)})`);
    if ('unbekannt' in bad.items || 'hookPenta' in bad.items || !it || it.step !== 7 || it.parts !== 4 || it.whole !== 0 || it.hold !== 0 || it.rating !== null || it.streak !== 2 || it.due !== null) errors.push(`sanitize: Begrenzungen ${JSON.stringify(it)}`);
    return errors;
  }

  /** Lauf und Anzeige: Zeitleiste je Stufe, Platzhalter, Schrittleiste, Sichtbarkeit. */
  function flowCheck() {
    const errors = [];
    const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const saved = { view: ui.view, step: ui.step, running: ui.running, result: ui.result, feedback: ui.feedback, lick: state.lick, notes: state.notes, items: state.items, html: $('#panel').innerHTML, holdStage: ui.holdStage, review: ui.review, foundKey: ui.foundKey, pickedKey: ui.pickedKey, startFails: ui.startFails };
    selfTesting = true;
    try {
      // Zeitleiste Durchhalten: Snare nur in Snare-Takten, in stillen Takten weder Schlagzeug noch Klick, Schlussschlag.
      for (const lick of LICKS) {
        for (let stageNo = 1; stageNo <= 4; stageNo++) {
          const { tl, start, plan, st } = tlHold(lick, stageNo, false);
          const inBar = (ev) => Math.floor(ev.t / tl.barSec + 1e-9) - start;
          const inRun = tl.events.filter((ev) => inBar(ev) >= 0 && inBar(ev) < st.bars);
          if (inRun.some((ev) => ev.type === 'click' || ev.type === 'tone')) errors.push(`Hold ${lick.id}/${stageNo}: Klick oder Vorbild im Lauf`);
          for (const ev of inRun) if (!plan[inBar(ev)] || ev.kind !== 'snare') errors.push(`Hold ${lick.id}/${stageNo}: ${ev.kind} in Takt ${inBar(ev) + 1}`);
          for (let b = 0; b < st.bars; b++) {
            const n = inRun.filter((ev) => inBar(ev) === b).length;
            if (n !== (plan[b] ? 2 : 0)) errors.push(`Hold ${lick.id}/${stageNo}: Takt ${b + 1} hat ${n} Schläge`);
          }
          const endHits = tl.events.filter((ev) => Math.abs(ev.t - (start + st.bars) * tl.barSec) < 1e-9).map((ev) => ev.kind).sort().join();
          if (endHits !== 'kick,open') errors.push(`Hold ${lick.id}/${stageNo}: Schlussschlag ${endHits}`);
          if (tl.expected.length !== lick.notes.length * st.bars / lick.bars) errors.push(`Hold ${lick.id}/${stageNo}: ${tl.expected.length} Soll-Punkte`);
          if (st.bars % lick.bars) errors.push(`Hold ${lick.id}/${stageNo}: Takte kein Vielfaches`);
          if (tl.expected.some((e) => e.bar < start || e.bar >= start + st.bars)) errors.push(`Hold ${lick.id}/${stageNo}: Soll außerhalb der Takte`);
        }
        // Wiederholungszahl bei bars: 2
        if (lick.bars === 2) { const { tl } = tlHold(lick, 1, false); if (tl.expected.length !== lick.notes.length * 2) errors.push(`Hold ${lick.id}: Wiederholungen`); }
        // Keine Doppelschläge im Raster über 8 Takte
        const tl = makeTimeline(lick);
        for (let b = 0; b < 8; b++) tl.groove(b, 'full');
        const seen = new Set();
        for (const ev of tl.events) { const key = `${Math.round(ev.t * 1e6)}|${ev.kind}`; if (seen.has(key)) errors.push(`Groove ${lick.id}: Doppelschlag`); seen.add(key); }
        if (tl.events.length !== 8 * (2 + 2 + TICKS_BAR / hatStep(lick))) errors.push(`Groove ${lick.id}: ${tl.events.length} Ereignisse über 8 Takte`);
      }
      // Platzhalter: identisch für verschiedene Bausteine, ohne Zähler, ohne Notenbild und Raster
      const panels = {};
      for (const id of ['bassOktav', 'arpMoll']) {
        state.lick = id; ui.view = 'lick';
        for (const step of [1, 2, 3, 4, 5, 6]) {
          Object.assign(ui, { step, running: step === 1 ? 'hear' : step === 2 ? 'sing' : step === 3 ? 'startton' : step === 4 ? 'part' : step === 5 ? 'whole' : 'hold', result: null, review: null });
          state.items = { [id]: { step: 5, parts: LICKS.find((l) => l.id === id).parts.length, whole: 3, hold: 2, rating: null, streak: 0, due: null } };
          renderPanel(lickById(id), itemOf(id));
          const p = $('#panel');
          panels[`${id}/${step}`] = p.querySelector('[data-placeholder]')?.outerHTML || '';
          if (!panels[`${id}/${step}`]) errors.push(`Platzhalter fehlt: ${id}/${step}`);
          if (p.querySelector('[data-roll], [data-result], .strip, .tl, .ph')) errors.push(`Lauf ${id}/${step}: Raster, Notenbild oder Ergebnis sichtbar`);
          if (/Takt \d+ von|Takt \d+\/\d+|Noch \d+ Takte/.test(p.textContent)) errors.push(`Lauf ${id}/${step}: Taktzähler`);
          if (keyEls.size && $$('#keyboard .is-lit').length) errors.push('Tasten leuchten während eines Laufs');
        }
      }
      const first = panels['bassOktav/5'];
      if (Object.values(panels).some((h) => h !== first)) errors.push('Platzhalter hängt vom Baustein oder Schritt ab');
      if (!first.includes('Nach Gehör')) errors.push('Platzhalter ohne Text');
      // Schrittleiste
      state.lick = 'hookPenta'; Object.assign(ui, { running: '', result: null });
      state.notes = 'last';
      if (stepsShown().length !== 7 || stepsShown()[6].name !== 'Notenbild') errors.push('Schrittleiste mit Notenbild');
      state.notes = 'off';
      if (stepsShown().length !== 6 || stepsShown().some((s) => s.name === 'Notenbild') || stepUnlocked(lickById('hookPenta'), 7)) errors.push('Schrittleiste ohne Notenbild');
      state.notes = 'last';
      // „Sitzt“ erst nach 8 Takten Durchhalten
      state.items = { hookPenta: { step: 5, parts: 3, whole: 3, hold: 1, rating: null, streak: 0, due: null } };
      let html = rateHtml(lickById('hookPenta'), itemOf('hookPenta'));
      if (!/data-rate="solid" disabled/.test(html) || !html.includes('Erst 8 Takte durchhalten')) errors.push('„Sitzt“ bei hold < 2 nicht gesperrt');
      state.items.hookPenta.hold = 2;
      html = rateHtml(lickById('hookPenta'), itemOf('hookPenta'));
      if (/data-rate="solid" disabled/.test(html)) errors.push('„Sitzt“ bei hold 2 gesperrt');
      setRating('hookPenta', 'solid');
      if (state.items.hookPenta.rating !== 'solid' || state.items.hookPenta.streak !== 1 || !DATE_RE.test(state.items.hookPenta.due)) errors.push('Einschätzung „sitzt“ wird nicht gespeichert');
      state.items.hookPenta.hold = 1; setRating('hookPenta', 'solid');
      if (state.items.hookPenta.streak !== 1) errors.push('„Sitzt“ trotz hold < 2 übernommen');
      // Ergebnisse erscheinen erst nach dem Lauf
      ui.running = '';
      const res = judgeHold({ expected: [1, 2, 3, 4], taps: [1, 2, 3, 4], barStart: 0, barSec: 4, tol: .1, plan: [true] });
      Object.assign(ui, { step: 6, holdStage: 1, result: { kind: 'hold', stage: 1, ...res } });
      renderPanel(lickById('hookPenta'), itemOf('hookPenta'));
      if (!$('#panel').querySelector('.strip')) errors.push('Taktstreifen nach dem Lauf fehlt');
      const silent = holdPlan(3);
      const res3 = judgeHold({ expected: [1, 5, 9, 13, 17, 21, 25, 29], taps: [1, 5, 9, 13, 17, 21, 25, 29], barStart: 0, barSec: 4, tol: .1, plan: silent });
      ui.result = { kind: 'hold', stage: 3, ...res3 };
      ui.holdStage = 3; state.items.hookPenta.hold = 2;
      renderPanel(lickById('hookPenta'), itemOf('hookPenta'));
      if ($('#panel').querySelectorAll('.strip .is-silent').length !== 4) errors.push(`Taktstreifen: ${$('#panel').querySelectorAll('.strip .is-silent').length} schraffierte Takte statt 4`);
      // Startton: Tippen wählt nur aus, erst „Ton einloggen“ prüft; die Tastatur wird dabei nicht neu gebaut
      {
        state.lick = 'hookPenta'; state.items = {};
        Object.assign(ui, { view: 'lick', step: 3, running: '', result: null, review: null, foundKey: null, pickedKey: null, startFails: 0, feedback: '' });
        buildKeyboard();
        const lick = lickById('hookPenta'), firstMidi = lick.root + lick.notes[0][2];
        const keyNode = keyEls.get(firstMidi);
        if (!keyNode) errors.push('Startton: Taste des ersten Tons fehlt');
        onOwnKey(firstMidi);
        if (ui.foundKey !== null || ui.pickedKey !== firstMidi || /Gefunden/.test(ui.feedback)) errors.push('Startton: der erste Tipp führt schon zur Lösung');
        if (!$('#panel [data-act="lock-start"]') || $('#panel [data-act="lock-start"]').disabled) errors.push('Startton: „Ton einloggen“ nach der Auswahl nicht wählbar');
        if (!keyNode.classList.contains('is-picked') && (paintKeys(), !keyNode.classList.contains('is-picked'))) errors.push('Startton: ausgewählte Taste nicht markiert');
        if (keyNode.querySelector('.key-mark')?.textContent === '1') errors.push('Startton: Auswahl verrät die Stufe');
        lockStart();
        if (ui.foundKey !== firstMidi || !/^Gefunden – das ist die 1\./.test(ui.feedback) || !stepDone(lick, 3)) errors.push(`Startton: Einloggen der richtigen Taste (${ui.foundKey}, „${ui.feedback}“)`);
        if (keyEls.get(firstMidi) !== keyNode) errors.push('Startton: Tastatur wurde nach dem Fund neu gebaut (hängender Ton)');
        if (keyNode.querySelector('.key-mark')?.textContent !== '1') errors.push('Startton: Stufenmarke fehlt nach dem Fund');
        resetStartton(); paintKeys();
        if (ui.foundKey !== null || keyNode.querySelector('.key-mark')) errors.push('Startton: Marke bleibt nach dem Verlassen hängen');
        for (let i = 1; i <= 6; i++) {
          onOwnKey(firstMidi + 2);
          if (ui.foundKey !== null) errors.push('Startton: falsche Taste gilt als gefunden');
          lockStart();
          if (ui.startFails !== i || ui.pickedKey !== null) errors.push(`Startton: Fehlversuch ${i} → ${ui.startFails}/${ui.pickedKey}`);
          const p = $('#panel').innerHTML;
          if (/data-act="startton">Lick nochmal/.test(p) !== (i >= 3) || /data-act="show-me"/.test(p) !== (i >= 6)) errors.push(`Startton: Knöpfe nach ${i} Fehlversuchen`);
        }
        lockStart(); // ohne Auswahl passiert nichts
        if (ui.startFails !== 6 || ui.foundKey !== null) errors.push('Startton: Einloggen ohne Auswahl');
        resetStartton();
      }
      // Notenbild-Zeilen: Töne, Zählzeilen
      const roll = rollHtml(lickById('arpMoll'));
      if ((roll.match(/class="roll-note"/g) || []).length !== 16 || !roll.includes('>e<') || !roll.includes('>a<')) errors.push('Notenbild arpMoll: Töne oder Zählzeilen');
      if (!rollHtml(lickById('fillGlideBlue')).includes('roll-glide') || rollHtml(lickById('hookPenta')).includes('roll-glide')) errors.push('Notenbild: Glide-Verbindung');
      void eq;
    } finally {
      selfTesting = false;
      Object.assign(ui, { view: saved.view, step: saved.step, running: saved.running, result: saved.result, feedback: saved.feedback, holdStage: saved.holdStage, review: saved.review, foundKey: saved.foundKey, pickedKey: saved.pickedKey, startFails: saved.startFails });
      state.lick = saved.lick; state.notes = saved.notes; state.items = saved.items;
      $('#panel').innerHTML = saved.html;
    }
    return errors;
  }

  /** Verzögerung erkennen: gemeinsame Vektoren, Vorschlag, Übernehmen, gemeinsame Ablage. */
  function delayCheck() {
    const errors = [...delayVectors()];
    const saved = { tap: calib.tapMs, mic: calib.micMs, hint: JSON.stringify(delayHint), running: ui.running };
    selfTesting = true;
    const reset = () => { delayHint.list.length = 0; delayHint.dismissed = false; delayHint.open = null; };
    try {
      calib.tapMs = 20; reset(); ui.running = '';
      noteDelayEstimate(200); noteDelayEstimate(195);
      if (delayHint.open) errors.push('Verzögerung: Vorschlag schon nach zwei Läufen');
      noteDelayEstimate(205);
      if (!delayHint.open || delayHint.open.ms !== 200) errors.push('Verzögerung: kein Vorschlag nach drei Läufen');
      if (!/data-delay="apply"/.test(delayCardHtml()) || !/data-delay="later"/.test(delayCardHtml())) errors.push('Verzögerung: Karte unvollständig');
      ui.running = 'hold';
      if (delayCardHtml() !== '') errors.push('Verzögerung: Karte während eines Laufs sichtbar');
      ui.running = '';
      applyDelaySuggestion();
      if (calib.tapMs !== 220 || delayHint.open || delayHint.list.length) errors.push(`Verzögerung: Übernehmen ergibt ${calib.tapMs}`);
      calib.tapMs = 290; reset(); [200, 200, 200].forEach(noteDelayEstimate); applyDelaySuggestion();
      if (calib.tapMs !== 300) errors.push(`Verzögerung: nicht begrenzt (${calib.tapMs})`);
      reset(); [180, 185, 180].forEach(noteDelayEstimate); delayHint.dismissed = true; delayHint.open = null;
      [180, 185, 180].forEach(noteDelayEstimate);
      if (delayHint.open) errors.push('Verzögerung: Vorschlag trotz „Später“');
      reset(); [200, null, 200, null, null].forEach(noteDelayEstimate);
      if (delayHint.open) errors.push('Verzögerung: Vorschlag trotz Läufen ohne Befund');
      applyCalibration({ v: 1, tapMs: 180.4, micMs: 90 });
      if (calib.tapMs !== 180 || calib.micMs !== 90) errors.push(`Verzögerung: Kalibration laden (${calib.tapMs}/${calib.micMs})`);
      applyCalibration({ v: 2, tapMs: 999 }); applyCalibration(null); applyCalibration({ v: 1, tapMs: 'x', micMs: 99999 });
      if (calib.tapMs !== 180 || calib.micMs !== 400) errors.push('Verzögerung: kaputte Kalibration');
    } finally {
      selfTesting = false;
      calib.tapMs = saved.tap; calib.micMs = saved.mic; reset(); Object.assign(delayHint, JSON.parse(saved.hint)); ui.running = saved.running;
    }
    return errors;
  }

  /** Tonerzeugung prüfen (asynchron): `await licks.selfCheckAudio()` — Pegel Lick gegen Schlagzeug. */
  async function selfCheckAudio() {
    const errors = [];
    const Offline = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Offline) return ['OfflineAudioContext fehlt'];
    const sr = 48000;
    const hpRms = (x, fc = 300) => { const rc = 1 / (2 * Math.PI * fc), a = rc / (rc + 1 / sr); let y = 0, e = 0; for (let i = 1; i < x.length; i++) { y = a * (y + x[i] - x[i - 1]); e += y * y; } return Math.sqrt(e / x.length); };
    const render = async (fn) => {
      const ctx = new Offline(1, sr * 2, sr);
      const save = { ctx: engine.ctx, master: engine.master, noise: engine.noise };
      engine.ctx = ctx; engine.master = ctx.destination;
      engine.noise = ctx.createBuffer(1, sr * .3, sr);
      const d = engine.noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      try { fn(); return (await ctx.startRendering()).getChannelData(0); } finally { Object.assign(engine, save); engine.lastMidi = {}; }
    };
    const drum = {};
    for (const kind of ['kick', 'snare', 'rim', 'hat', 'open']) drum[kind] = hpRms(await render(() => engine.drum(kind, .1, 1, null)));
    for (const lick of LICKS) {
      const sound = soundFromPreset(lick.preset);
      const n = lick.notes[Math.min(2, lick.notes.length - 1)];
      const x = await render(() => engine.playTone(sound, lick.root + n[2], .1, LEAD_VELOCITY, Math.max(.25, n[1] * tickSecOf(lick)), { layer: 'lead', dest: null }));
      const peak = x.reduce((a, b) => Math.max(a, Math.abs(b)), 0);
      if (!(peak > .01)) errors.push(`${lick.id}: kein Ton`);
      const level = hpRms(x);
      // Der Lick liegt (nach Hochpass) mindestens auf dem Pegel der Snare, deutlich über Rim und Hi-Hat.
      if (!(level > 1.0 * drum.snare)) errors.push(`${lick.id}: Pegel ${(level * 1000).toFixed(2)} nicht über der Snare ${(drum.snare * 1000).toFixed(2)}`);
      if (!(level > 2 * Math.max(drum.hat, drum.rim))) errors.push(`${lick.id}: Pegel nicht deutlich über Rim/Hi-Hat`);
    }
    return errors;
  }

  window.licks = {
    LICKS, HOLD_STAGES, holdPlan, judgeHold, holdMessage, partMessage, degreeLabel, nextDue, statusOf, grooveFor, keyboardRange,
    sanitizeLicksState, selfCheck, selfCheckAudio,
    // für Konsole und Prüfungen
    estimateRunDelay, detectDelay, delayVectors, delayCheck, calib, delayHint, dueIds, toleranceFor, tlHold, makeTimeline, placeholderHtml, rollHtml, state, ui, engine, run, octaveLimits, stepsShown, holdVectors, ownNoteOn, ownNoteOff,
  };

  /* ------------------------------------------------------------------------
     START
     ------------------------------------------------------------------------ */
  function init() {
    show('list');
    renderList();
    requestAnimationFrame(rollFrame);
    if (new URLSearchParams(location.search).get('review') === '1') startReview();
  }
  if (storage) {
    Promise.all([Promise.resolve(storage.load(STORAGE_ID)), Promise.resolve(storage.load(CALIBRATION_ID)).catch(() => null)]).then(([raw, cal]) => {
      const s = sanitizeLicksState(raw);
      for (const k of Object.keys(state)) delete state[k];
      Object.assign(state, s);
      applyCalibration(cal);
    }).catch(() => { /* nichts gespeichert */ }).then(init);
  } else init();
})();
</script>
