<title>Licks &amp; Grooves</title>
<!--
  LICKS (Datei: licks.html) — kurze Synthesizer-Linien nach Gehör lernen:
  hören, mitsingen, Startton finden, stückweise nachspielen, ganz spielen,
  durchhalten (4 bis 16 Takte, zuletzt mit stillen Takten ohne Schlagzeug),
  das Notenbild (Piano-Roll) kommt zuletzt und ist abschaltbar. Dazu Status
  (Neu → Lerne → Sitzt) und Wiederholen mit Abstand („Heute wiederholen“ auf
  der Tools-Seite, ?review=1). Hören statt Sehen: Während des eigenen Spielens
  gibt es keine laufende Marke, kein Raster, keine leuchtenden Tasten und
  keinen Taktzähler — nur den neutralen Platzhalter „Nach Gehör“.

  In der App: Tools-Reiter → Licks & Grooves → Synth-Licks (Vollbild-iframe,
  ?embedded=1, der Schließen-Knopf gehört der App). Ablage über
  window.parent.chorToolStorage (Datensatz „licks“); Fortschritt meldet die
  Seite an window.parent.chorProgress (Bereich „licks“). Offline über
  SHELL_OPTIONAL und TOOL_PAGES in sw.js. Nur Deutsch, keine Abhängigkeiten,
  kein Mikrofon (Eingabe über die Bildschirmtasten).

  Klänge ohne Samples (Web Audio). Kopien, damit die Tools eigenständig
  bleiben (Blöcke mit „Kopie aus …“ gekennzeichnet):
  - Synth: playTone() mit SOUND_DEFAULTS, WAVE_LEVEL und fünf Presets aus
    groove-lab.js — ohne Hall und Echo,
  - Schlagzeug: drum()/tone()/noiseHit() aus metronom.html.
-->
<style>

  .lick-row .play svg { fill: currentColor; stroke: none; }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .68rem; font-weight: 700; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; border: 1px solid rgba(36,27,61,.2); }

  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .ladder button { min-height: 52px; padding: 4px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 800; font-size: .7rem; line-height: 1.2; }

  .white:last-child { border-right: 0; }

  .black { position: absolute; top: 0; height: 60%; z-index: 2; border-radius: 0 0 6px 6px; background: linear-gradient(#3a3350, #1c1730 88%); box-shadow: inset 0 -4px 0 rgba(255,255,255,.08), 0 3px 5px rgba(0,0,0,.35); }
  .black.is-down { background: linear-gradient(#2a2340, rgb(var(--accent-rgb))); }
  .white.is-lit { background: linear-gradient(#ffe0f0, rgba(var(--accent-rgb), .55)); }

  .white.is-picked, .black.is-picked { box-shadow: inset 0 0 0 3px var(--accent); }
  .key-mark.is-pick { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
  .key-mark { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: var(--accent); color: #fff; font-size: .68rem; font-weight: 800; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
  .black .key-mark { bottom: 6px; }

  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(36,27,61,.45); display: flex; align-items: flex-end; }
  .sheet-card { width: 100%; background: var(--bg); border-radius: 20px 20px 0 0; padding: 16px 16px max(20px, env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }

  .sub-label { display: block; margin: 12px 0 4px; font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
</style>
</head>

<script>
(function () {
  'use strict';

  if (new URLSearchParams(location.search).has('embedded')) document.documentElement.classList.add('is-embedded');
  // In der App eingebettet: deren Akzentfarbe übernehmen (gleiche Herkunft).
  try {
    if (window.parent !== window) {
      const appStyle = getComputedStyle(window.parent.document.documentElement);
      const accent = appStyle.getPropertyValue('--accent').trim();
      const rgb = appStyle.getPropertyValue('--accent-rgb').trim();
      if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
      if (/^\d+,\s*\d+,\s*\d+$/.test(rgb)) document.documentElement.style.setProperty('--accent-rgb', rgb);
    }
  } catch { /* eigenständig geöffnet oder fremde Herkunft: Standardfarbe */ }

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const mod = (n, m) => ((n % m) + m) % m;
  const { noteLabel } = window.ChorHarmony;

  /* ------------------------------------------------------------------------
     INHALT — Licks. `notes` = [Tick, Dauer, Halbtöne über root, Optionen?],
     12 Ticks = Viertel, ein 4/4-Takt = 48 Ticks; Pausen sind Lücken zwischen
     den Tönen. `parts` = Notenbereiche [von, bis) für „Stückweise“. `root`
     als MIDI-Nummer; der Startton-Schritt bezieht Stufen auf `root`.
     Lick-IDs sind fest (gespeichert), neue Licks nur anhängen.
     ------------------------------------------------------------------------ */
  const TICKS_BAR = 48;
  const LICKS = [
    { id: 'hookPenta', cat: 'hook', level: 1, name: 'Pentatonik-Hook', preset: 'Analog Lead', bpm: 96, bars: 2, root: 57,
      notes: [[0, 12, 0], [12, 6, 3], [18, 6, 5], [24, 18, 7], [42, 6, 10], [48, 12, 7], [60, 6, 5], [66, 6, 3], [72, 24, 0]],
      parts: [[0, 3], [3, 5], [5, 9]],
      intro: 'Fünf Töne, zwei Takte: hinauf bis zur kleinen Septime, dann zurück nach Hause. Sing ihn zuerst auf „du“ – die Finger folgen der Stimme.',
      more: 'Die Moll-Pentatonik ist die Tonleiter unzähliger Pop-, Soul- und Rock-Hooks. Auf ihr klingt fast jede Tonfolge richtig, deshalb ist sie der beste Einstieg.' },
    { id: 'bassOktav', cat: 'bass', level: 1, name: 'Oktav-Disco-Bass', preset: 'Growl Bass', bpm: 100, bars: 2, root: 40,
      notes: [[0, 6, 0], [6, 6, 12], [12, 6, 0], [18, 6, 12], [24, 6, 0], [30, 6, 12], [36, 6, 0], [42, 6, 12],
        [48, 6, 5], [54, 6, 17], [60, 6, 5], [66, 6, 17], [72, 6, 7], [78, 6, 19], [84, 6, 7], [90, 6, 19]],
      parts: [[0, 4], [4, 8], [8, 12], [12, 16]],
      intro: 'Achtel, immer im Wechsel tief und eine Oktave höher. Erst auf der 1, dann auf der 4, dann auf der 5. Der tiefe Ton trägt, der hohe federt.',
      more: 'Der Oktavbass treibt viele Disco- und Dance-Titel. Er ist rhythmisch einfach und schult trotzdem das Wichtigste: gleichmäßige Achtel über lange Strecken.' },
    { id: 'fillGlideBlue', cat: 'fill', level: 2, name: 'Glide-Fill mit Blue Note', preset: 'Analog Lead', bpm: 92, bars: 1, root: 57,
      notes: [[0, 6, 0], [6, 6, 3], [12, 6, 5], [18, 3, 6], [21, 9, 7, { glide: true }], [30, 6, 5], [36, 6, 3], [42, 6, 0]],
      parts: [[0, 3], [3, 5], [5, 8]],
      intro: 'Hinauf zur ♭5 und von dort in die 5 gleiten, dann zurück. Die ♭5 ist nur ein Sechzehntel lang – ein Durchgang, kein Ziel.',
      more: 'Die ♭5 ist die typischste Blue Note. Mit Glide in die 5 gezogen klingt sie wie ein Schleifer in der Stimme – ein Klang, den man im Chor gut nachsingen kann.' },
    { id: 'arpMoll', cat: 'arp', level: 2, name: 'Moll-Arp in Sechzehnteln', preset: 'Neon Pluck', bpm: 88, bars: 1, root: 57,
      notes: [[0, 3, 0], [3, 3, 3], [6, 3, 7], [9, 3, 12], [12, 3, 7], [15, 3, 3], [18, 3, 0], [21, 3, 3],
        [24, 3, -2], [27, 3, 2], [30, 3, 5], [33, 3, 10], [36, 3, 5], [39, 3, 2], [42, 3, -2], [45, 3, 2]],
      parts: [[0, 4], [4, 8], [8, 12], [12, 16]],
      intro: 'Vier Sechzehntel je Schlag: erst den Moll-Dreiklang hinauf und zurück, dann den Dur-Dreiklang einen Ganzton tiefer. Gleichmäßig, ohne Betonung.',

    { id: 'riffPush', cat: 'hook', level: 2, name: 'Synthpop-Riff mit Vorziehen', preset: 'Bright Saw', bpm: 108, bars: 1, root: 62,
      notes: [[0, 6, 0], [6, 6, 0], [12, 6, 3], [18, 12, 5], [30, 6, 3], [36, 12, 0]],

      more: 'Das ist dieselbe vorgezogene Drei wie im Rhythmus-Kurs, nur mit Tönen. Synthpop-Riffs leben von solchen Pushes: Die Betonung kommt ein Achtel zu früh.' },
    { id: 'hookBlueThird', cat: 'fill', level: 2, name: 'Blue-Third-Schleifer', preset: 'Soft Brass', bpm: 84, bars: 1, root: 60,
      notes: [[0, 6, 0], [6, 3, 3], [9, 9, 4, { glide: true }], [18, 6, 0], [24, 12, 7], [36, 6, 9], [42, 6, 7]],
      parts: [[0, 3], [3, 7]],

      more: 'Die Blue Third liegt zwischen Moll und Dur. Sänger:innen treffen sie, indem sie von unten hineinziehen – genau das macht hier der Glide.' },
    { id: 'hookAufA', cat: 'hook', level: 3, name: 'Einsatz auf dem „a“', preset: 'Analog Lead', bpm: 92, bars: 1, root: 64,
      notes: [[9, 3, 7], [12, 6, 10], [18, 6, 12], [24, 3, 10], [27, 3, 7], [30, 6, 5], [36, 12, 3]],
      parts: [[0, 3], [3, 7]],
      intro: 'Die Eins bleibt leer. Der erste Ton kommt ein Sechzehntel vor der Zwei, auf dem „a“. Zähl „1 e + a“ und spiel auf „a“.',
      more: 'Viele Hooks beginnen knapp vor einem Schlag. Wer auf der Zwei einsetzt, kommt zu spät. Dieselbe Figur gibt es im Rhythmus-Kurs als Klatsch-Lektion.' },
    { id: 'bassFunk16', cat: 'bass', level: 3, name: 'Funk-Bass mit Sechzehnteln', preset: 'Growl Bass', bpm: 96, bars: 1, root: 43,
      notes: [[0, 3, 0], [9, 3, 12], [12, 6, 10], [21, 3, 7], [27, 6, 0], [36, 3, -3], [42, 3, -2], [45, 3, -1]],
      parts: [[0, 4], [4, 8]],
      intro: 'Kurze Töne, viel Luft dazwischen. Die Eins sitzt, alles andere fällt auf „e“ und „a“. Die letzten drei Töne laufen chromatisch in die nächste Eins.',
      more: 'Im Funk zählt die Pause so viel wie der Ton. Spiel die Töne kurz und trocken – die Lücken sind der Groove.' },
  ];
  const CATS = [['all', 'Alle'], ['hook', 'Hooks'], ['bass', 'Bass'], ['arp', 'Arps'], ['fill', 'Fills']];
  const lickById = (id) => LICKS.find((l) => l.id === id) || null;

  /* ------------------------------------------------------------------------
     DURCHHALTEN — Leiter (je Baustein gespeichert als `hold` = Zahl der
     geschafften Stufen, 0–4). on/off: Takte mit Snare / still, im Wechsel.
     ------------------------------------------------------------------------ */
  const HOLD_STAGES = [
    { bars: 4,  on: 0, off: 0, name: '4 Takte' },                // Snare durchgehend
    { bars: 8,  on: 0, off: 0, name: '8 Takte' },                // Snare durchgehend
    { bars: 8,  on: 2, off: 2, name: '8 Takte mit Lücken' },     // 2 Takte Snare, 2 Takte still, …
    { bars: 16, on: 2, off: 4, name: '16 Takte mit Lücken' },    // 2 Takte Snare, 4 Takte still, …
  ];
  const stageOf = (stage) => (typeof stage === 'number' ? HOLD_STAGES[clamp(stage, 1, 4) - 1] : stage);
  const stageHasGaps = (stage) => stageOf(stage).on > 0;

  /** Plan der Begleitung je Takt: true = Snare, false = still. Stufe 1–4
   *  oder ein Eintrag aus HOLD_STAGES. */
  function holdPlan(stage) {
    const st = stageOf(stage);
    if (!st.on) return Array(st.bars).fill(true);
    const period = st.on + st.off;
    return Array.from({ length: st.bars }, (_, b) => b % period < st.on);
  }

  /** Trefferfenster: knapp unter der halben kürzesten Notenlänge, höchstens 130 ms.
   *  Gleiche Formel wie uebe-lab.html (toleranceFor). */
  const toleranceFor = (gapSec) => Math.min(.13, Math.max(.035, gapSec * .45));

  /**
   * Auswertung eines Durchhalten-Laufs (Kopie in uebe-lab.html — beide
   * Fassungen müssen identisch bleiben, gleiche Testvektoren).
   *   expected: Soll-Zeitpunkte im ABSOLUTEN Raster (Sekunden), nie am ersten
   *             Anschlag neu ausgerichtet; Zahlen oder { t, pc } (Tonklasse).
   *   taps:     Anschläge (Sekunden) — Zahlen oder { t, pc }.
   *   barStart / barSec: Anfang des ersten Takts und Taktdauer.
   *   tol:      Trefferfenster (s). plan: je Takt true (Snare) / false (still).
   * → { bars: [{ expected, hit, meanOffset, extra, silent }], held, tendency,
   *     lostAt (1-basiert oder null), reentry ('good' | 'late' | null) }
   */
  function judgeHold({ expected, taps, barStart, barSec, tol, plan }) {
    const nBars = plan.length;
    const timeOf = (x) => (typeof x === 'number' ? x : x.t);
    const exp = expected.map((e) => ({ t: timeOf(e), pc: typeof e === 'number' ? null : e.pc })).sort((a, b) => a.t - b.t);
    const tp = taps.map((x) => ({ t: timeOf(x), pc: typeof x === 'number' ? null : x.pc, used: false })).sort((a, b) => a.t - b.t);
    const barOf = (t) => Math.floor((t - barStart) / barSec + 1e-9);
    const bars = Array.from({ length: nBars }, (_, b) => ({ expected: 0, hit: 0, meanOffset: 0, extra: 0, silent: plan[b] === false, sum: 0 }));
    const hits = [];
    for (const e of exp) {
      const b = barOf(e.t);
      if (b < 0 || b >= nBars) continue;
      bars[b].expected++;
      let best = null;
      for (const x of tp) {
        if (x.used || Math.abs(x.t - e.t) > tol) continue;
        if (e.pc !== null && x.pc !== null && e.pc !== x.pc) continue;
        if (!best || Math.abs(x.t - e.t) < Math.abs(best.t - e.t)) best = x;
      }
      if (!best) continue;
      best.used = true;
      bars[b].hit++; bars[b].sum += best.t - e.t;
      hits.push({ t: e.t, off: best.t - e.t });
    }
    for (const x of tp) {
      if (x.used) continue;
      const b = barOf(x.t);
      if (b >= 0 && b < nBars) bars[b].extra++;
    }
    for (const b of bars) { b.meanOffset = b.hit ? b.sum / b.hit : 0; delete b.sum; }
    // Tendenz: lineare Regression der Abweichungen über der Zeit; Unterschied
    // Anfang → Ende des Laufs (über die Spanne der Soll-Punkte).
    let tendency = 'steady';
    if (hits.length >= 6) {
      const n = hits.length;
      const mt = hits.reduce((a, h) => a + h.t, 0) / n, mo = hits.reduce((a, h) => a + h.off, 0) / n;
      let num = 0, den = 0;
      for (const h of hits) { num += (h.t - mt) * (h.off - mo); den += (h.t - mt) ** 2; }
      const slope = den ? num / den : 0;
      const span = exp.length ? exp[exp.length - 1].t - exp[0].t : 0;
      const change = slope * span;
      tendency = change < -tol / 2 ? 'faster' : change > tol / 2 ? 'slower' : 'steady';
    }
    // Faden gerissen: zwei aufeinanderfolgende Takte mit weniger als der Hälfte der Soll-Punkte.
    const weak = (b) => bars[b].expected > 0 && bars[b].hit < bars[b].expected / 2;
    let lostAt = null;
    for (let b = 0; b + 1 < nBars; b++) if (weak(b) && weak(b + 1)) { lostAt = b + 1; break; }
    // Wiedereinstieg nach Lücken: jeweils der erste Snare-Takt nach einer Lücke.
    let reentry = null;
    if (plan.includes(false)) {
      const firsts = bars.map((_, b) => b).filter((b) => plan[b] && b > 0 && plan[b - 1] === false && bars[b].expected > 0);
      if (firsts.length) reentry = firsts.reduce((a, b) => a + bars[b].hit / bars[b].expected, 0) / firsts.length >= .75 ? 'good' : 'late';
    }
    const okBar = (b) => !bars[b].expected || bars[b].hit >= .75 * bars[b].expected;
    const lastTwo = bars.slice(-2).filter((b) => b.expected > 0);
    const held = bars.every((_, b) => okBar(b)) && lastTwo.every((b) => Math.abs(b.meanOffset) <= tol);
    return { bars, held, tendency, lostAt, reentry };
  }

  /* ---- Verzögerung erkennen (übungsübergreifende Kalibration). Kommen alle
     Anschläge ungefähr gleich viel zu spät (Touchscreen, Bluetooth-Kopfhörer),
     verfehlt man bei mehr als etwa 130 ms jede Note — die Auswertung sieht dann
     nur „daneben“, nicht „alles 200 ms verschoben“. Deshalb wird hier über die
     ganze Phrase nach einer gemeinsamen Verschiebung gesucht.
     Diese Funktionen stehen wortgleich in uebe-lab.html und licks.html (gleiche
     Testvektoren, delayVectors). ---- */
  const DELAY_MIN_MS = 80, DELAY_MAX_MS = 350;
  /** Verschiebung eines Laufs in ms (Anschlag − Soll, positiv = zu spät) oder null.
   *  expected/taps in Sekunden. Gesucht wird die Verschiebung, bei der die meisten
   *  Anschläge auf Soll-Punkte fallen (±50 ms); bei mehreren gleichwertigen die kleinste
   *  (regelmäßige Muster passen auch um einen Notenabstand verschoben). Gilt nur, wenn
   *  fast alle Soll-Punkte getroffen werden, ohne Verschiebung aber kaum einer. */
  function estimateRunDelay(expected, taps) {
    const n = expected.length;
    if (n < 3 || taps.length < 3 || taps.length > n * 1.5) return null;
    const hitsAt = (s) => expected.filter((e) => taps.some((t) => Math.abs(t - (e + s)) <= .05)).length;
    const s0 = hitsAt(0);
    let best = 0, bestHits = s0;
    for (let ms = 20; ms <= 400; ms += 10) { const h = hitsAt(ms / 1000); if (h > bestHits) { bestHits = h; best = ms; } }
    if (best < DELAY_MIN_MS || bestHits < .7 * n || s0 > .35 * n || bestHits - s0 < .3 * n) return null;
    const offs = [];
    for (const e of expected) {
      const t = taps.find((x) => Math.abs(x - (e + best / 1000)) <= .05);
      if (t !== undefined) offs.push(t - e);
    }
    offs.sort((a, b) => a - b);
    return Math.round(offs[offs.length >> 1] * 1000);
  }
  /** Aus den Verschiebungen der letzten Läufe (ms) einen Vorschlag machen oder null: mindestens
   *  drei der letzten fünf Läufe (Läufe ohne Befund zählen mit) liegen innerhalb von ±45 ms um den Median, und der liegt
   *  zwischen 80 und 350 ms. Rückgabe { ms } auf 5 ms gerundet. */
  function detectDelay(estimates) {
    const recent = estimates.slice(-5).filter((x) => Number.isFinite(x)); // Läufe ohne Befund zählen als Platz ohne Wert
    if (recent.length < 3) return null;
    const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
    const m = median(recent);
    const close = recent.filter((x) => Math.abs(x - m) <= 45);
    if (close.length < 3 || close.length < .6 * recent.length) return null;
    const ms = Math.round(median(close) / 5) * 5;
    return ms >= DELAY_MIN_MS && ms <= DELAY_MAX_MS ? { ms } : null;
  }
  /** Gemeinsame Testvektoren (wortgleich in uebe-lab.html und licks.html). */
  function delayVectors() {
    const errors = [];
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const jitter = (ms) => (rnd() * 2 - 1) * ms / 1000;
    // unregelmäßiges Muster (Abstände .25 / .5 / .75 s), 16 Soll-Punkte
    const gaps = [.5, .25, .25, .75, .5, .25, .5, .25, .75, .25, .5, .5, .25, .25, .75];
    const expected = [2]; gaps.forEach((g) => expected.push(expected[expected.length - 1] + g));
    const shifted = (ms, j = 20) => expected.map((e) => e + ms / 1000 + jitter(j));
    let r = estimateRunDelay(expected, shifted(200));
    if (r === null || Math.abs(r - 200) > 15) errors.push(`Verzögerung: 200 ms → ${r}`);
    r = estimateRunDelay(expected, shifted(130));
    if (r === null || Math.abs(r - 130) > 15) errors.push(`Verzögerung: 130 ms → ${r}`);
    for (const ms of [0, 40, 60, 500]) if (estimateRunDelay(expected, shifted(ms)) !== null) errors.push(`Verzögerung: ${ms} ms sollte keinen Vorschlag geben`);
    if (estimateRunDelay(expected, shifted(-150)) !== null) errors.push('Verzögerung: zu früh sollte keinen Vorschlag geben');
    if (estimateRunDelay(expected, shifted(200).filter((_, i) => i % 2)) !== null) errors.push('Verzögerung: nur halbe Anschläge sollten keinen Vorschlag geben');
    const mash = Array.from({ length: 40 }, () => 2 + rnd() * 7);
    if (estimateRunDelay(expected, mash) !== null) errors.push('Verzögerung: wildes Tippen sollte keinen Vorschlag geben');
    if (estimateRunDelay(expected.slice(0, 2), shifted(200).slice(0, 2)) !== null) errors.push('Verzögerung: zu wenige Soll-Punkte');
    r = estimateRunDelay(expected.slice(0, 3), shifted(200, 10).slice(0, 3));
    if (r === null || Math.abs(r - 200) > 15) errors.push(`Verzögerung: drei Soll-Punkte → ${r}`);
    // Nur jede zweite Note gespielt, aber gleichmäßig 200 ms zu spät, ist kein Beleg (zu wenige Treffer) — s. o.
    // regelmäßiges Muster (Achtel, .3 s): 200 ms zu spät wird nicht als „100 ms zu früh“ gedeutet
    const even = Array.from({ length: 16 }, (_, i) => 2 + i * .3);
    r = estimateRunDelay(even, even.map((e) => e + .2 + jitter(15)));
    if (r === null || Math.abs(r - 200) > 15) errors.push(`Verzögerung: regelmäßiges Muster → ${r}`);
    // Vorschlag aus mehreren Läufen
    const D = (x) => JSON.stringify(detectDelay(x));
    if (D([200, 195, 210]) !== '{"ms":200}') errors.push(`detectDelay 3 gleiche: ${D([200, 195, 210])}`);
    if (D([205, 190, 210, 90, 200]) !== '{"ms":205}') errors.push(`detectDelay mit Ausreißer: ${D([205, 190, 210, 90, 200])}`);
    if (D([200, 205]) !== 'null') errors.push('detectDelay: zwei Läufe reichen nicht');
    if (D([200, 100, 300, 50, 250]) !== 'null') errors.push('detectDelay: streuende Werte');
    if (D([60, 65, 60]) !== 'null' || D([400, 410, 405]) !== 'null') errors.push('detectDelay: außerhalb 80–350 ms');
    if (D([null, NaN, 200, 200, 205]) !== '{"ms":200}') errors.push('detectDelay: ungültige Werte');
    if (D([]) !== 'null') errors.push('detectDelay: leer');
    if (D([200, 200, null, null, null]) !== 'null' || D([200, 205, null, 195, null]) !== '{"ms":200}') errors.push('detectDelay: Läufe ohne Befund zählen mit');
    if (D([90, 40, 300, 200, 200, 205, 195]) !== '{"ms":200}') errors.push('detectDelay: nur die letzten fünf zählen');
    return errors;
  }

  /* ---- Verzögerungs-Vorschlag: erkennt die Seite, dass alles etwa gleich viel zu spät
     kommt (Touchscreen, Bluetooth), bietet sie eine Kalibration für alle Übungen an. Die
     gemeinsame Ablage `calibration` (tapMs, micMs) gilt auch in uebe-lab.html. ---- */
  const CALIBRATION_ID = 'calibration';
  const calib = { tapMs: 0, micMs: 0 };
  const delayHint = { list: [], dismissed: false, open: null };
  function saveCalibration() {
    if (!storage || selfTesting) return;
    Promise.resolve(storage.save(CALIBRATION_ID, { v: 1, tapMs: calib.tapMs, micMs: calib.micMs })).catch(() => {});
  }
  function applyCalibration(cal) {
    if (!cal || typeof cal !== 'object' || cal.v !== 1) return;
    if (Number.isFinite(cal.tapMs)) calib.tapMs = clamp(Math.round(cal.tapMs), -50, 300);
    if (Number.isFinite(cal.micMs)) calib.micMs = clamp(Math.round(cal.micMs), 0, 400);
  }
  function noteDelayEstimate(ms) {
    delayHint.list.push(ms);
    if (delayHint.list.length > 8) delayHint.list.shift();
    const sug = detectDelay(delayHint.list);
    delayHint.open = sug && !delayHint.dismissed ? { ms: sug.ms } : null;
  }
  /** Ein Lauf: Soll-Zeitpunkte und Anschläge (Sekunden, absolut auf der Audio-Uhr). */
  function noteRunDelay(expected, taps) { if (!selfTesting) noteDelayEstimate(estimateRunDelay(expected, taps)); }
  function applyDelaySuggestion() {
    const h = delayHint.open;
    if (!h) return;
    calib.tapMs = clamp(calib.tapMs + h.ms, -50, 300);
    delayHint.list.length = 0; delayHint.open = null;
    saveCalibration();
  }
  /** Karte mit dem Vorschlag (nur außerhalb eines Laufs). */
  function delayCardHtml() {
    const h = delayHint.open;
    if (!h || ui.running) return '';
    return `<div class="delay-hint" role="status"><p><b>Deine Töne kommen im Schnitt etwa ${h.ms} ms zu spät.</b> Das liegt oft am Gerät (Touchscreen, Bluetooth-Kopfhörer), nicht an dir. Soll die Verzögerung in allen Übungen ausgeglichen werden?</p>
      <div class="actions" style="margin-top:0"><button class="btn primary" type="button" data-delay="apply">${h.ms} ms ausgleichen</button><button class="btn" type="button" data-delay="later">Später</button></div></div>`;
  }

  /** Rückmeldung nach dem Durchhalten (erste passende Zeile gewinnt). */
  function holdMessage(result, stage) {
    const st = stageOf(stage);
    const gaps = stageHasGaps(st);
    if (result.held && result.tendency === 'steady') return `Durchgehalten – ${st.bars} Takte, ruhig und gleichmäßig.`;
    if (result.held && result.tendency === 'faster') return 'Durchgehalten! Zum Ende hin bist du etwas schneller geworden – lass die Pausen ruhig lang.';
    if (result.held && result.tendency === 'slower') return 'Durchgehalten! Zum Ende hin bist du etwas langsamer geworden – denk an den Backbeat.';
    if (result.lostAt && gaps && result.reentry === 'late') return `Bis Takt ${result.lostAt - 1} lief es stabil. In der Stille zählst du beim nächsten Mal leise mit.`;
    if (result.lostAt) return `Bis Takt ${result.lostAt - 1} lief es stabil. Danach ist der Faden gerissen – das ist beim Durchhalten ganz normal.`;
    if (result.tendency === 'faster') return 'Fast! Du bist nach und nach schneller geworden. Nochmal – diesmal bewusst gemütlich.';
    if (result.tendency === 'slower') return 'Fast! Du bist nach und nach langsamer geworden. Nochmal – die Snare zieht dich.';
    return 'Fast! Ein paar Takte waren wackelig. Nochmal – ruhig und gleichmäßig.';
  }

  /** Stufenbezeichnung eines Tons (Halbtöne über root, mod 12). */
  const DEGREES = ['1', '♭2', '2', '♭3', '3', '4', '♭5', '5', '♭6', '6', '♭7', '7'];
  const degreeLabel = (semis) => DEGREES[mod(semis, 12)];

  /** Rückmeldung zu „Stückweise“. want/got: [{ midi, t }] (t in Sekunden,
   *  relativ zum eigenen ersten Ton), tol: Trefferfenster. → { ok, text }. */
  function partMessage({ want, got, tol }) {
    if (got.length !== want.length) return { ok: false, text: `Das waren ${got.length} Töne, im Teil sind es ${want.length}. Hör ihn nochmal.` };
    // Tonklassen prüfen: erster falscher Ton.
    for (let i = 0; i < want.length; i++) {
      if (mod(got[i].midi, 12) === mod(want[i].midi, 12)) continue;
      const d = mod(want[i].midi - got[i].midi + 6, 12) - 6; // wo der richtige Ton liegt, vom gespielten aus
      const dist = Math.abs(d) === 1 ? 'einen halben Schritt' : Math.abs(d) === 2 ? 'einen ganzen Schritt' : 'weiter';
      const dir = d > 0 ? 'höher' : 'tiefer';
      const lead = i === 0 ? 'Der erste Ton liegt' : `Fast! Die Richtung stimmt bis Ton ${i}. Ton ${i + 1} liegt`;
      return { ok: false, text: `${lead} ${dist} ${dir}.` };
    }
    // Oktavabweichung (nur ein Hinweis).
    const shift = got.map((g, i) => Math.round((g.midi - want[i].midi) / 12)).find((s) => s !== 0);
    const octave = shift ? ` (eine Oktave ${shift > 0 ? 'höher' : 'tiefer'} – geht auch)` : '';
    // Rhythmus relativ zum eigenen ersten Ton.
    for (let i = 1; i < want.length; i++) {
      const diff = (got[i].t - got[0].t) - (want[i].t - want[0].t);
      if (Math.abs(diff) > tol) return { ok: true, text: `Die Töne stimmen! Der ${i + 1}. kam etwas ${diff < 0 ? 'früh' : 'spät'}.${octave}` };
    }
    return { ok: true, text: `Genau so!${octave}` };
  }

  /* ------------------------------------------------------------------------
     STATUS UND WIEDERHOLEN MIT ABSTAND
     ------------------------------------------------------------------------ */
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  /** Datum + n Tage (lokale Zeit, wie progressDate in der App). */
  function addDays(date, n) {
    const [y, m, d] = date.split('-').map(Number);
    return localDate(new Date(y, m - 1, d + n));
  }
  /** Nächste Fälligkeit: noch wackelig → morgen; geht schon → 3 Tage; sitzt →
   *  7, beim nächsten Mal 21, danach 60 Tage (streak 0/1/2+); jede andere
   *  Einschätzung setzt streak auf 0. */
  function nextDue(rating, streak, today) {
    if (rating === 'shaky') return { due: addDays(today, 1), streak: 0 };
    if (rating === 'ok') return { due: addDays(today, 3), streak: 0 };
    if (rating === 'solid') {
      const s = Number.isInteger(streak) && streak > 0 ? Math.min(streak, 2) : 0;
      return { due: addDays(today, [7, 21, 60][s]), streak: Math.min(2, s + 1) };
    }
    return { due: null, streak: 0 };
  }
  /** Neu (nie eingeschätzt), Lerne (zuletzt „wackelig“ oder „geht schon“), Sitzt. */
  function statusOf(item) {
    if (!item || !item.rating) return 'Neu';
    return item.rating === 'solid' ? 'Sitzt' : 'Lerne';
  }
  /** Zahl der fälligen Bausteine (gültiges `due` ≤ heute). */
  function dueIds(items, today) {
    if (!items || typeof items !== 'object') return [];
    return Object.entries(items).filter(([id, it]) => lickById(id) && it && DATE_RE.test(it.due || '') && it.due <= today)
      .sort((a, b) => a[1].due.localeCompare(b[1].due)).map(([id]) => id);
  }

  /* ------------------------------------------------------------------------
     BEGLEITUNG — 4/4-Groove, neutral: Bassdrum 1 und 3, Snare 2 und 4, Hi-Hat
     als gleichmäßiges Raster. Er spielt den Lick nie vor. level: full
     (alles), backbeat (Bassdrum + Snare), snare (nur Snare), off.
     ------------------------------------------------------------------------ */
  const GROOVE_KICK = [0, 24];
  const GROOVE_SNARE = [12, 36];
  /** Hi-Hat alle 6 Ticks, alle 3, wenn irgendein Ton auf t % 6 ≠ 0 beginnt. */
  const hatStep = (lick) => (lick.notes.some((n) => n[0] % 6 !== 0) ? 3 : 6);
  function grooveFor(lick, level) {
    const out = { kick: [], snare: [], hat: [] };
    if (level === 'full' || level === 'backbeat') out.kick = [...GROOVE_KICK];
    if (level === 'full' || level === 'backbeat' || level === 'snare') out.snare = [...GROOVE_SNARE];
    if (level === 'full') { const st = hatStep(lick); for (let t = 0; t < TICKS_BAR; t += st) out.hat.push(t); }
    return out;
  }

  /* ------------------------------------------------------------------------
     TASTATUR — Lage des Licks: von der weißen Taste auf/unter dem tiefsten
     bis zur weißen Taste auf/über dem höchsten Ton, mindestens 8 weiße
     Tasten (gleichmäßig nach beiden Seiten ergänzt); „Okt −/+“ verschiebt
     um 12, Grenzen MIDI 24–96.
     ------------------------------------------------------------------------ */
  const IS_BLACK = [false, true, false, true, false, false, true, false, true, false, true, false];
  const KEY_MIN = 24, KEY_MAX = 96, MIN_WHITES = 8;
  const isWhite = (m) => !IS_BLACK[mod(m, 12)];
  const whitesBetween = (lo, hi) => { let n = 0; for (let m = lo; m <= hi; m++) if (isWhite(m)) n++; return n; };
  /** Erlaubte Oktavverschiebung eines Licks (−1, 0, 1), damit die Lage in 24–96 bleibt. */
  function octaveLimits(lick) {
    const semis = lick.notes.map((n) => n[2]);
    const lo = lick.root + Math.min(...semis), hi = lick.root + Math.max(...semis);
    return [clamp(Math.ceil((KEY_MIN + 2 - lo) / 12), -1, 0), clamp(Math.floor((KEY_MAX - 2 - hi) / 12), 0, 1)];
  }
  function keyboardRange(lick, octaveShift = 0) {
    const semis = lick.notes.map((n) => n[2]);
    const shift = 12 * clamp(octaveShift, -1, 1);
    let lo = lick.root + Math.min(...semis) + shift, hi = lick.root + Math.max(...semis) + shift;
    while (!isWhite(lo)) lo--;
    while (!isWhite(hi)) hi++;
    let down = true;
    while (whitesBetween(lo, hi) < MIN_WHITES) {
      const canDown = lo - 1 >= KEY_MIN, canUp = hi + 1 <= KEY_MAX;
      if (!canDown && !canUp) break;
      if ((down && canDown) || !canUp) { lo--; while (!isWhite(lo) && lo > KEY_MIN) lo--; } else { hi++; while (!isWhite(hi) && hi < KEY_MAX) hi++; }
      down = !down;
    }
    return [lo, hi];
  }

  /* ------------------------------------------------------------------------
     ZUSTAND UND ABLAGE
     ------------------------------------------------------------------------ */
  const PRESET_NAMES = ['Analog Lead', 'Bright Saw', 'Neon Pluck', 'Growl Bass', 'Soft Brass'];
  const RATINGS = ['shaky', 'ok', 'solid'];
  const STEP_NAMES = ['Hören', 'Mitsingen', 'Startton', 'Stückweise', 'Ganz', 'Durchhalten', 'Notenbild'];
  const freshState = () => ({ v: 1, lick: LICKS[0].id, notes: 'last', glide: true, octave: {}, sound: {}, items: {} });
  const intIn = (v, lo, hi, dflt = lo) => (Number.isInteger(v) ? clamp(v, lo, hi) : dflt);

  /** Gespeicherter Stand → gültiger Stand: unbekannte Lick-IDs verworfen, Zahlen
   *  begrenzt, unbekannte Werte → Standard, fehlendes `v` → leer. */
  function sanitizeLicksState(raw) {
    const out = freshState();
    if (!raw || typeof raw !== 'object' || raw.v !== 1) return out;
    if (lickById(raw.lick)) out.lick = raw.lick;
    out.notes = raw.notes === 'off' ? 'off' : 'last';
    out.glide = typeof raw.glide === 'boolean' ? raw.glide : true;
    const oct = raw.octave && typeof raw.octave === 'object' ? raw.octave : {};
    const snd = raw.sound && typeof raw.sound === 'object' ? raw.sound : {};
    const items = raw.items && typeof raw.items === 'object' ? raw.items : {};
    for (const l of LICKS) {
      if ([-1, 0, 1].includes(oct[l.id])) out.octave[l.id] = oct[l.id];
      if (PRESET_NAMES.includes(snd[l.id])) out.sound[l.id] = snd[l.id];
      const it = items[l.id];
      if (!it || typeof it !== 'object') continue;
      out.items[l.id] = {
        step: intIn(it.step, 0, 7), parts: intIn(it.parts, 0, l.parts.length), whole: intIn(it.whole, 0, 3), hold: intIn(it.hold, 0, 4),
        rating: RATINGS.includes(it.rating) ? it.rating : null, streak: intIn(it.streak, 0, 2),
        due: typeof it.due === 'string' && DATE_RE.test(it.due) ? it.due : null,
      };
    }
    return out;
  }

  const state = freshState();
  const STORAGE_ID = 'licks';
  const storage = (() => { try { return window.parent !== window ? window.parent.chorToolStorage || null : null; } catch { return null; } })();
  const progressApi = (() => { try { return window.parent !== window ? window.parent.chorProgress || null : null; } catch { return null; } })();
  let saveTimer = 0;
  let selfTesting = false;
  function persist() {
    if (!storage || selfTesting) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { Promise.resolve(storage.save(STORAGE_ID, state)).catch(() => {}); }, 300);
  }
  const itemOf = (id) => state.items[id] || (state.items[id] = { step: 0, parts: 0, whole: 0, hold: 0, rating: null, streak: 0, due: null });
  const soundOf = (lick) => state.sound[lick.id] || lick.preset;
  const octaveOf = (lick) => clamp(state.octave[lick.id] || 0, ...octaveLimits(lick));
  /** Schritt k (1–7) geschafft? */
  function stepDone(lick, k) {
    const it = state.items[lick.id];
    if (!it) return false;
    if (k <= 3) return it.step >= k;
    if (k === 4) return it.parts >= lick.parts.length;
    if (k === 5) return it.whole >= 3;
    if (k === 6) return it.hold >= 2;
    return it.step >= 7;
  }
  /** Schritt k wählbar? Man darf jederzeit zurück, vorwärts nur der nächste; Durchhalten
   *  und Notenbild gibt es nach „Ganz“; Notenbild fehlt bei notes: 'off'. */
  function stepUnlocked(lick, k) {
    if (k === 7 && state.notes === 'off') return false;
    let reached = 1;
    while (reached < 5 && stepDone(lick, reached)) reached++;
    if (k <= reached) return true;
    return (k === 6 || k === 7) && stepDone(lick, 5);
  }
  /** Schritte der Leiste (Notenbild fehlt bei notes: 'off'). */
  const stepsShown = () => STEP_NAMES.map((name, i) => ({ k: i + 1, name })).filter((s) => !(s.k === 7 && state.notes === 'off'));

  /* ------------------------------------------------------------------------
     KLANG — Synth und Schlagzeug ohne Samples (Web Audio).

     Synth: Kopie aus groove-lab.js, Stand e63013a (SOUND_DEFAULTS, WAVE_LEVEL, fünf Presets
     unverändert, playTone mit Stimmen-Freigabe, Mono- und Glide-Logik).
     Weggelassen: Hall und Echo (reverbWet/echoWet werden ignoriert), Ebenen
     und Effekt-Busse. Ausgang über einen eigenen Bus (`dest`), der beim
     Stoppen ausblendet.
     ------------------------------------------------------------------------ */
  const SOUND_DEFAULTS = {
    wave: 'triangle', attack: .01, decay: .2, sustain: .6, release: .4,
    cutoff: 3000, resonance: 2, filterEnvAmount: 0, filterType: 'lowpass', drive: 0,
    lfoRate: 0, lfoDepth: 0, lfoSync: 0,
    detune: 0, width: 0, subLevel: 0, pitchDrop: 0,
    vibratoRate: 0, vibratoDepth: 0, vibratoDelay: 0,
    glide: 0, mono: false, reverbWet: .2, echoWet: .1,
  };
  const SYNTH_PRESETS = [
    { name: 'Neon Pluck', wave: 'sawtooth', attack: .004, decay: .1, sustain: .3, release: .16, cutoff: 5200, resonance: 6, filterEnvAmount: 2400, reverbWet: .1, echoWet: .22,
      pitchDrop: 180, width: .3 },
    { name: 'Soft Brass', wave: 'sawtooth', attack: .06, decay: .26, sustain: .58, release: .3, cutoff: 2600, resonance: 4, filterEnvAmount: 1400, reverbWet: .16, echoWet: .08,
      pitchDrop: 55, vibratoRate: 5.5, vibratoDepth: 9, vibratoDelay: .28 },
    { name: 'Analog Lead', wave: 'sawtooth', attack: .008, decay: .15, sustain: .6, release: .25, cutoff: 3800, resonance: 9, filterEnvAmount: 2600, reverbWet: .08, echoWet: .14,
      pitchDrop: 130, vibratoRate: 6, vibratoDepth: 14, vibratoDelay: .18, drive: .2, mono: true, glide: .08 },
    { name: 'Bright Saw', wave: 'sawtooth', attack: .01, decay: .2, sustain: .45, release: .4, cutoff: 7200, resonance: 5, filterEnvAmount: 1600, reverbWet: .2, echoWet: .16,
      pitchDrop: 90, width: .5, vibratoRate: 5, vibratoDepth: 9, vibratoDelay: .2 },
    { name: 'Growl Bass', wave: 'sawtooth', attack: .01, decay: .18, sustain: .6, release: .28, cutoff: 900, resonance: 9, filterEnvAmount: 500, reverbWet: .1, echoWet: .08,
      detune: 6, subLevel: .45, pitchDrop: 220, drive: .5, mono: true, glide: .06 },
  ];
  const WAVE_LEVEL = { sine: 1, triangle: .9, square: .55, sawtooth: .6 };
  const soundFromPreset = (name) => {
    const p = SYNTH_PRESETS.find((x) => x.name === name) || SYNTH_PRESETS[0];
    const { name: n, ...params } = p;
    return { ...SOUND_DEFAULTS, ...params };
  };
  const noteHz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  // Pegel: Vorbild-Ton deutlich über dem Schlagzeug (Bus `run.bus`, siehe drum()).
  const LEAD_VELOCITY = .3;
  const OWN_VELOCITY = .3;
  const VORBILD_GLIDE_DEFAULT = .08; // Dauer des Glides auf Noten mit { glide: true }, wenn das Preset keinen hat

  const engine = {
    ctx: null, master: null, noise: null, voices: new Set(), lastMidi: {}, monoVoice: {},

    async start() {
      if (this.ctx) { if (this.ctx.state !== 'running') await this.ctx.resume(); return; }
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) throw new Error('Web Audio API nicht verfügbar');
      // 'balanced' statt 'interactive': der kleinste Puffer knackt mit Bluetooth-Kopfhörern;
      // die Ausgabelatenz wird über outputLatency/Kalibrierung ohnehin herausgerechnet.
      const ctx = new Ctx({ latencyHint: 'balanced' });
      this.ctx = ctx;
      this.master = ctx.createGain();
      this.master.gain.value = .8;
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -10; limiter.ratio.value = 8;
      this.master.connect(limiter).connect(ctx.destination);
      this.noise = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      await ctx.resume();
    },

    /** Eigener Bus für einen Lauf: ein Gain-Knoten, den man beim Stoppen ausblendet. */
    newBus() { const bus = this.ctx.createGain(); bus.connect(this.master); return bus; },
    fadeBus(bus) {
      if (!bus || !this.ctx) return;
      const t = this.ctx.currentTime;
      bus.gain.cancelScheduledValues(t);
      bus.gain.setValueAtTime(bus.gain.value, t);
      bus.gain.linearRampToValueAtTime(0, t + .08);
      setTimeout(() => bus.disconnect(), 400);
    },

    /* ---- Schlagzeug: Kopie aus metronom.html (drum, tone, noiseHit; Stand
       e08b9d5) mit Ausgang `dest`. Zusätzlich zu kick/snare/rim/hat der
       offene Hi-Hat für den Schlussschlag. Pegel: Begleitung −8 dB gegenüber
       dem Metronom-Tool (DRUM_GAIN), damit der Lick deutlich darüber liegt. ---- */
    tone(time, { freq, type = 'sine', gain, decay, attack = .001, filter }, dest) {
      const ctx = this.ctx;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(.0001, time);
      g.gain.linearRampToValueAtTime(gain, time + attack);
      g.gain.exponentialRampToValueAtTime(.0001, time + attack + decay);
      let node = osc.connect(g);
      if (filter) {
        const f = ctx.createBiquadFilter();
        f.type = filter.type; f.frequency.value = filter.freq; f.Q.value = filter.q ?? .7;
        node = node.connect(f);
      }
      node.connect(dest || this.master);
      osc.start(time); osc.stop(time + attack + decay + .02);
    },
    noiseHit(time, { type = 'highpass', freq, q = .7, gain, decay }, dest) {
      const ctx = this.ctx;
      const src = ctx.createBufferSource();
      const f = ctx.createBiquadFilter();
      const g = ctx.createGain();
      src.buffer = this.noise;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(gain, time);
      g.gain.exponentialRampToValueAtTime(.0001, time + decay);
      src.connect(f).connect(g).connect(dest || this.master);
      src.start(time); src.stop(time + decay + .02);
    },
    drum(kind, time, vel = 1, dest) {
      const v = vel * DRUM_GAIN;
      switch (kind) {
        case 'kick': {
          const ctx = this.ctx;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.frequency.setValueAtTime(150, time);
          osc.frequency.exponentialRampToValueAtTime(45, time + .11);
          g.gain.setValueAtTime(.8 * v, time);
          g.gain.exponentialRampToValueAtTime(.0001, time + .22);
          osc.connect(g).connect(dest || this.master);
          osc.start(time); osc.stop(time + .24);
          break;
        }
        case 'snare':
          this.tone(time, { freq: 185, type: 'triangle', gain: .28 * v, decay: .09 }, dest);
          this.noiseHit(time, { type: 'bandpass', freq: 1800, q: 1.1, gain: .3 * v, decay: .16 }, dest);
          break;
        case 'rim':
          this.tone(time, { freq: 1700, type: 'square', gain: .12 * v, decay: .025, filter: { type: 'bandpass', freq: 2000, q: 3 } }, dest);
          break;
        case 'hat':
          this.noiseHit(time, { freq: 7000, gain: .07 * v, decay: .045 }, dest);
          break;
        case 'open':
          this.noiseHit(time, { freq: 7200, q: .9, gain: .06 * v, decay: .3 }, dest);
          break;
        default: break;
      }
    },
    /** Einzähler-Klick (Klang wie das Metronom „click“). */
    click(time, strong, dest) {
      this.tone(time, { freq: strong ? 1000 : 800, gain: strong ? .22 : .12, decay: .05 }, dest);
    },
    /** Liegender Grundton + Quinte (Sinus, keine Terz), leise — verrät nicht Dur/Moll. */
    drone(midi, dest) {
      const ctx = this.ctx;
      const t = ctx.currentTime + .02;
      const out = [];
      for (const m of [midi, midi + 7]) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = noteHz(m);
        g.gain.setValueAtTime(.0001, t);
        g.gain.linearRampToValueAtTime(DRONE_GAIN, t + .12);
        osc.connect(g).connect(dest || this.master);
        osc.start(t);
        out.push({ osc, g });
      }
      return out;
    },
    stopDrone(list) {
      if (!list || !this.ctx) return;
      const t = this.ctx.currentTime;
      for (const { osc, g } of list) {
        try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(.0001, g.gain.value), t); g.gain.linearRampToValueAtTime(.0001, t + .15); osc.stop(t + .2); } catch { /* schon gestoppt */ }
      }
    },

    /** Eine Synth-Note. Mit `duration` komplett auf der Audio-Uhr geplant,
     *  ohne klingt sie bis releaseVoice(). opts: layer ('lead' = Vorbild,
     *  'own' = eigenes Spiel; der Mono-Modus des Presets gilt nur beim Vorbild),
     *  glide (Sekunden; 0 = aus), dest. */
    playTone(sound, midi, time, velocity, duration, { layer = 'lead', glide = 0, dest } = {}) {
      const ctx = this.ctx;
      if (this.voices.size >= 24) { for (const oldest of this.voices) { this._release(oldest, true); break; } }
      if (sound.mono && layer === 'lead') {
        const prev = this.monoVoice[layer];
        if (prev && !prev.done) this._releaseAt(prev, time);
      }
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const nyquist = ctx.sampleRate * .45;
      const baseCutoff = Math.min(sound.cutoff, nyquist);
      filter.type = sound.filterType || 'lowpass';
      filter.Q.value = sound.resonance;
      const attack = Math.max(.003, sound.attack);
      const peakCutoff = Math.min(baseCutoff + (sound.filterEnvAmount || 0), nyquist);
      filter.frequency.setValueAtTime(baseCutoff, time);
      filter.frequency.linearRampToValueAtTime(peakCutoff, time + attack);
      filter.frequency.linearRampToValueAtTime(baseCutoff, time + attack + sound.decay);
      // Lautstärke-Hüllkurve; ist die Note kürzer als Attack+Decay, wird die Kurve abgeschnitten.
      const voiceCount = 1 + (sound.detune ? 1.1 : 0) + (sound.subLevel || 0) * .6;
      const peak = velocity * (WAVE_LEVEL[sound.wave] ?? 1) / voiceCount;
      const sustainLevel = peak * sound.sustain;
      gain.gain.setValueAtTime(.0001, time);
      if (duration && duration < attack) {
        gain.gain.linearRampToValueAtTime(Math.max(.0001, peak * duration / attack), time + duration);
      } else {
        gain.gain.linearRampToValueAtTime(peak, time + attack);
        if (duration && duration < attack + sound.decay) {
          const v = peak + (sustainLevel - peak) * (duration - attack) / sound.decay;
          gain.gain.linearRampToValueAtTime(Math.max(.0001, v), time + duration);
        } else {
          gain.gain.linearRampToValueAtTime(Math.max(.0001, sustainLevel), time + attack + sound.decay);
        }
      }
      let stopAt = null;
      if (duration) {
        gain.gain.setTargetAtTime(0, time + duration, Math.max(.01, sound.release / 4));
        stopAt = time + duration + sound.release * 1.3 + .05;
      }
      const baseFreq = noteHz(midi);
      const fromMidi = this.lastMidi[layer];
      this.lastMidi[layer] = midi;
      const setPitch = (param, ratio) => {
        if (glide > 0 && fromMidi !== undefined && fromMidi !== midi) {
          param.setValueAtTime(noteHz(fromMidi) * ratio, time);
          param.exponentialRampToValueAtTime(baseFreq * ratio, time + glide);
        } else param.setValueAtTime(baseFreq * ratio, time);
      };
      const oscillators = [];
      const lfos = [];
      const detune = sound.detune || 0;
      const spreads = detune ? [[0, 0], [detune, 1], [-detune, -1]] : [[0, 0]];
      for (const [cents, side] of spreads) {
        const osc = ctx.createOscillator();
        osc.type = sound.wave;
        setPitch(osc.frequency, 1);
        osc.detune.value = cents;
        const voiceGain = ctx.createGain();
        voiceGain.gain.value = cents === 0 ? 1 : .55;
        let out = osc.connect(voiceGain);
        if (side && sound.width && ctx.createStereoPanner) {
          const pan = ctx.createStereoPanner();
          pan.pan.value = side * sound.width;
          out = out.connect(pan);
        }
        out.connect(filter);
        if (sound.vibratoDepth) {
          const lfo = ctx.createOscillator();
          lfo.frequency.value = sound.vibratoRate || 5;
          const lfoGain = ctx.createGain();
          const delay = sound.vibratoDelay ?? .15;
          lfoGain.gain.setValueAtTime(0, time);
          lfoGain.gain.setValueAtTime(0, time + delay);
          lfoGain.gain.linearRampToValueAtTime(sound.vibratoDepth, time + delay + .25);
          lfo.connect(lfoGain).connect(osc.detune);
          lfo.start(time);
          lfos.push(lfo);
        }
        if (sound.pitchDrop) {
          const drop = Math.max(.02, attack);
          osc.detune.setValueAtTime(cents + sound.pitchDrop, time);
          osc.detune.linearRampToValueAtTime(cents, time + drop);
        }
        osc.start(time);
        oscillators.push(osc);
      }
      if (sound.subLevel) {
        const sub = ctx.createOscillator();
        sub.type = 'sine';
        setPitch(sub.frequency, .5);
        const subGain = ctx.createGain();
        subGain.gain.value = sound.subLevel;
        sub.connect(subGain).connect(filter);
        sub.start(time);
        oscillators.push(sub);
      }
      filter.connect(gain).connect(dest || this.master);
      const voice = { oscillators, lfos, gain, release: sound.release, done: false, layer };
      if (stopAt !== null) {
        oscillators.forEach((osc) => osc.stop(stopAt));
        lfos.forEach((lfo) => lfo.stop(stopAt));
      }
      this.voices.add(voice);
      if (sound.mono && layer === 'lead') this.monoVoice[layer] = voice;
      oscillators[0].addEventListener('ended', () => { voice.done = true; this.voices.delete(voice); }, { once: true });
      return voice;
    },
    _release(voice, fast = false) {
      if (!voice || voice.done || !this.ctx) return;
      const now = this.ctx.currentTime;
      const release = fast ? .03 : voice.release;
      try {
        voice.gain.gain.cancelScheduledValues(now);
        voice.gain.gain.setValueAtTime(Math.max(.0001, voice.gain.gain.value), now);
        voice.gain.gain.exponentialRampToValueAtTime(.0001, now + release);
        const stopAt = now + release + .02;
        voice.oscillators.forEach((osc) => osc.stop(stopAt));
        voice.lfos.forEach((lfo) => lfo.stop(stopAt));
      } catch { /* Oszillator kann schon beendet sein */ }
      voice.done = true;
      this.voices.delete(voice);
    },
    /** Mono-Modus: die vorige Stimme genau dann abbrechen, wenn die neue einsetzt. */
    _releaseAt(voice, time) {
      try {
        voice.gain.gain.cancelScheduledValues(time);
        voice.gain.gain.setTargetAtTime(0, time, .015);
        voice.oscillators.forEach((osc) => osc.stop(time + .12));
        voice.lfos.forEach((lfo) => lfo.stop(time + .12));
      } catch { /* schon beendet */ }
      voice.done = true;
      this.voices.delete(voice);
    },
    releaseVoice(voice) { this._release(voice, false); },
    releaseAll() { this.voices.forEach((v) => this._release(v, true)); },
  };
  // Schlagzeug: −8 dB gegenüber dem Metronom-Tool (0,4), Grundton-Liegeklang leise.
  const DRUM_GAIN = .4;
  const DRONE_GAIN = .05;

  /* ------------------------------------------------------------------------
     LAUF — eine Folge von Ereignissen auf der Audio-Uhr. Die Ereignisse
     eines Laufs stehen vorab fest (Zeit in Sekunden ab Start) und werden mit
     Vorlauf eingeplant; kein setTimeout für Töne. Ein Takt = 48 Ticks.
     ------------------------------------------------------------------------ */
  const tickSecOf = (lick) => 60 / lick.bpm / 12;
  const barSecOf = (lick) => TICKS_BAR * tickSecOf(lick);

  /** Baukasten für die Ereignisliste eines Laufs. */
  function makeTimeline(lick) {
    const tickSec = tickSecOf(lick), barSec = barSecOf(lick);
    const events = [];
    const expected = [];   // { t (s ab Start), pc, midi, dur, bar }
    const tl = {
      lick, tickSec, barSec, events, expected, bars: 0,
      /** Einzähler: ein Takt, vier Klicks. */
      countIn(bar) { for (let i = 0; i < 4; i++) events.push({ t: bar * barSec + i * 12 * tickSec, type: 'click', strong: i === 0 }); return bar + 1; },
      /** Begleitung eines Takts (level: full | backbeat | snare | off). */
      groove(bar, level) {
        const g = grooveFor(lick, level);
        for (const [kind, list] of Object.entries(g)) for (const tk of list) events.push({ t: bar * barSec + tk * tickSec, type: 'drum', kind });
      },
      /** Lick-Töne aus den Takten [lickBar0, lickBar1) an Takt `bar` legen; only: Notenindizes. */
      lick(bar, { from = 0, to = lick.bars, only = null, glide = true, expect = false, octave = 0 } = {}) {
        lick.notes.forEach((n, i) => {
          const bi = Math.floor(n[0] / TICKS_BAR);
          if (bi < from || bi >= to || (only && !only.includes(i))) return;
          const t = (bar + bi - from) * barSec + (n[0] % TICKS_BAR) * tickSec;
          const midi = lick.root + n[2] + 12 * octave;
          const dur = n[1] * tickSec;
          if (expect) expected.push({ t, pc: mod(midi, 12), midi, dur, bar: bar + bi - from, i });
          else events.push({ t, type: 'tone', midi, dur, glide: glide && !!(n[3] && n[3].glide) });
        });
      },
      end(bar) { tl.bars = bar; },
    };
    return tl;
  }

  const run = { playing: false, timer: 0, t0: 0, bus: null, idx: 0, events: [], taps: [], onEnd: null, endAt: 0, tl: null, sound: null };
  const LATENCY_CAP = .25;
  /** Lauf starten. tl: Zeitleiste (Ereignisse ab 0, `tl.bars` Takte), onEnd(run). */
  async function startRun(tl, onEnd) {
    stopRun(false);
    try { await engine.start(); } catch { return false; }
    const ctx = engine.ctx;
    run.playing = true;
    run.tl = tl;
    run.sound = soundFromPreset(soundOf(tl.lick));
    run.bus = engine.newBus();
    run.t0 = ctx.currentTime + .15;
    run.events = [...tl.events].sort((a, b) => a.t - b.t);
    run.idx = 0; run.taps = []; run.onEnd = onEnd;
    run.endAt = run.t0 + tl.bars * tl.barSec;
    engine.lastMidi = {};
    const pump = () => {
      if (!run.playing) return;
      const horizon = ctx.currentTime + .25;
      while (run.idx < run.events.length && run.t0 + run.events[run.idx].t < horizon) fire(run.events[run.idx++]);
      if (ctx.currentTime > run.endAt + .25) { const cb = run.onEnd; const info = { taps: run.taps, t0: run.t0, tl: run.tl }; stopRun(false); if (cb) cb(info); }
    };
    run.timer = setInterval(pump, 25);
    pump();
    return true;
  }
  function fire(ev) {
    const time = run.t0 + ev.t;
    if (ev.type === 'click') engine.click(time, ev.strong, run.bus);
    else if (ev.type === 'drum') engine.drum(ev.kind, time, 1, run.bus);
    else if (ev.type === 'tone') {
      const glide = ev.glide ? (run.sound.glide || VORBILD_GLIDE_DEFAULT) : 0;
      engine.playTone(run.sound, ev.midi, time, LEAD_VELOCITY, ev.dur, { layer: 'lead', glide, dest: run.bus });
    }
  }
  /** Lauf abbrechen bzw. beenden; ohne Nachklingen (Bus blendet aus). */
  function stopRun(notify = true) {
    if (!run.playing && !run.timer) return;
    clearInterval(run.timer); run.timer = 0;
    const cb = run.onEnd;
    run.playing = false; run.onEnd = null;
    engine.fadeBus(run.bus); run.bus = null;
    if (notify && cb) cb(null);
  }

  /* ---- Eigenes Spiel: Bildschirmtasten (Pointer Events, Mehrfach-Touch) ---- */
  const own = { voices: new Map(), last: null };
  function ownNoteOn(midi) {
    if (!engine.ctx) { engine.start().then(() => ownNoteOn(midi)); return; }
    if (engine.ctx.state !== 'running') engine.ctx.resume();
    const lick = currentLick();
    const sound = { ...soundFromPreset(lick ? soundOf(lick) : PRESET_NAMES[0]), mono: false };
    const now = engine.ctx.currentTime;
    const glide = state.glide ? (sound.glide || VORBILD_GLIDE_DEFAULT) : 0;
    const voice = engine.playTone(sound, midi, now + .005, OWN_VELOCITY, undefined, { layer: 'own', glide, dest: engine.master });
    own.voices.set(midi, voice);
    if (run.playing) run.taps.push({ t: now - Math.min(LATENCY_CAP, engine.ctx.outputLatency || engine.ctx.baseLatency || 0) - calib.tapMs / 1000, pc: mod(midi, 12), midi });
    return voice;
  }
  function ownNoteOff(midi) {
    const v = own.voices.get(midi);
    own.voices.delete(midi);
    if (v) engine.releaseVoice(v);
  }

  /* ------------------------------------------------------------------------
     ANZEIGE
     ------------------------------------------------------------------------ */
  const ui = {
    view: 'list', cat: 'all', step: 1, part: 0, holdStage: 1, running: '', feedback: '', feedbackKind: '', result: null,
    foundKey: null, pickedKey: null, startFails: 0, drone: null, review: null, visitRated: false, lastRunAt: {}, rollTick: -1,
  };
  const currentLick = () => (ui.view === 'lick' ? lickById(state.lick) : null);
  const SVG_W = 340;

  /** Neutraler Platzhalter statt Raster und Notenbild (Hören statt Sehen). Hängt
   *  von nichts ab — nicht von Länge, Taktzahl oder den Tönen des Bausteins. */
  const placeholderHtml = () => `<div class="stage" data-placeholder><svg viewBox="0 0 ${SVG_W} 104" role="img" aria-label="Nach Gehör"><line class="staff" x1="8" y1="62" x2="${SVG_W - 8}" y2="62"/><text class="hint" x="${SVG_W / 2}" y="44" text-anchor="middle">Nach Gehör</text></svg></div>`;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const statusText = (id) => statusOf(state.items[id]);

  function renderList() {
    $('#cat-chips').innerHTML = CATS.map(([id, label]) => `<button class="chip" type="button" data-cat="${id}" aria-pressed="${ui.cat === id}">${label}</button>`).join('');
    const today = localDate();
    const due = dueIds(state.items, today);
    $('#review-card').hidden = !due.length;
    $('#review-text').textContent = `Heute fällig: ${due.length} ${due.length === 1 ? 'Lick' : 'Licks'}`;
    const list = LICKS.filter((l) => ui.cat === 'all' || l.cat === ui.cat);
    $('#list').innerHTML = list.map((l) => {
      const playing = ui.running === `preview:${l.id}`;
      return `<div class="lick-row" data-id="${l.id}">
        <button class="play" type="button" data-act="preview" data-id="${l.id}" aria-label="${playing ? 'Stoppen' : `${esc(l.name)} anhören`}">${playing
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>'}</button>
        <button class="open" type="button" data-act="open" data-id="${l.id}"><span class="name">${esc(l.name)}</span><span class="sub">${l.preset} · Stufe ${l.level}</span></button>
        <span class="status" data-status="${statusText(l.id)}">${statusText(l.id)}</span></div>`;
    }).join('');
    const nothing = ui.review === 'none';
    $('#list-note').textContent = nothing ? 'Heute ist nichts fällig.' : '';
  }

  function show(view) {
    ui.view = view;
    $('#view-list').hidden = view !== 'list';
    $('#view-lick').hidden = view !== 'lick';
    $('#dock').hidden = view !== 'lick';
    $('[data-act="back"]').hidden = view !== 'lick';
    $('[data-act="settings"]').hidden = view !== 'lick';
  }

  function setFeedback(text, kind = '') { ui.feedback = text; ui.feedbackKind = kind; const el = $('.feedback'); if (el) { el.textContent = text; el.className = `feedback${kind ? ` is-${kind}` : ''}`; } }

  /** Gerät zum ersten Schritt, der noch nicht geschafft ist. */
  function firstOpenStep(lick) {
    for (const s of stepsShown()) if (s.k <= 5 && !stepDone(lick, s.k)) return s.k;
    return 5;
  }

  function openLick(id, step = null) {
    const lick = lickById(id);
    if (!lick) return;
    stopRun(false); releaseDrone();
    state.lick = id;
    ui.view = 'lick';
    Object.assign(ui, { step: step || firstOpenStep(lick), part: 0, foundKey: null, pickedKey: null, startFails: 0, result: null, running: '', visitRated: false, review: ui.review && ui.review.queue ? ui.review : null });
    ui.part = clamp(state.items[id]?.parts || 0, 0, lick.parts.length - 1);
    ui.holdStage = clamp((state.items[id]?.hold || 0) + 1, 1, 4);
    setFeedback('');
    show('lick');
    renderLick();
    persist();
  }

  function renderLick() {
    const lick = lickById(state.lick);
    if (!lick) return;
    const it = itemOf(lick.id);
    $('#lick-name').textContent = lick.name;
    $('#lick-sub').textContent = `${lick.preset} · Stufe ${lick.level} · ${lick.bars} ${lick.bars === 1 ? 'Takt' : 'Takte'} · ♩ = ${lick.bpm}`;
    // Schrittleiste
    $('#steps').innerHTML = stepsShown().map((s) => {
      const done = stepDone(lick, s.k);
      const cls = `step${done ? ' is-done' : ''}${ui.step === s.k ? ' is-now' : ''}${s.k === 7 ? ' is-optional' : ''}`;
      return `<button class="${cls}" type="button" data-step="${s.k}"${stepUnlocked(lick, s.k) ? '' : ' disabled'}${ui.step === s.k ? ' aria-current="step"' : ''}>${done ? '✓ ' : ''}${s.k}. ${s.name}${s.k === 7 ? ' (optional)' : ''}</button>`;
    }).join('');
    renderPanel(lick, it);
    buildKeyboard();
    // Klang und Glide
    $('#sound-select').innerHTML = PRESET_NAMES.map((n) => `<option value="${n}"${n === soundOf(lick) ? ' selected' : ''}>${n}</option>`).join('');
    $('[data-act="glide"]').setAttribute('aria-pressed', String(state.glide));
    const [lo, hi] = octaveLimits(lick);
    const shift = octaveOf(lick);
    $('#oct-range').textContent = shift > 0 ? `+${shift}` : String(shift);
    $('[data-act="oct-down"]').disabled = shift <= lo;
    $('[data-act="oct-up"]').disabled = shift >= hi;
  }

  const runLabel = (key) => ui.running === key;
  const stopBtn = (key) => (runLabel(key) ? '<button class="btn" type="button" data-act="stop">■ Stopp</button>' : '');

  function renderPanel(lick, it) {
    const p = $('#panel');
    if (ui.review && ui.review.queue && ui.review.phase) { p.innerHTML = reviewPanelHtml(lick, it); return; }
    const k = ui.step;
    let html = '';
    if (k === 1) {
      html = `<p>${esc(lick.intro)}</p><p class="more">${esc(lick.more)}</p>${placeholderHtml()}
        <div class="actions"><button class="btn primary" type="button" data-act="hear"${ui.running ? ' disabled' : ''}>▶ Anhören</button>${stopBtn('hear')}
        <button class="btn" type="button" data-act="next-step"${stepDone(lick, 1) || ui.result === 'heard' ? '' : ' disabled'}>Weiter</button></div>
        <p class="note">Der Lick läuft zweimal über einen Groove, dazwischen ein leerer Takt. Noch nichts nachspielen.</p>`;
    } else if (k === 2) {
      html = `<p>Sing mit auf „du“. Die Stimme lernt den Verlauf, die Finger folgen.</p>${placeholderHtml()}
        <div class="actions"><button class="btn primary" type="button" data-act="sing"${ui.running ? ' disabled' : ''}>▶ Hören und mitsingen</button>${stopBtn('sing')}
        <button class="btn" type="button" data-act="next-step"${stepDone(lick, 2) || ui.result === 'sung' ? '' : ' disabled'}>Weiter</button></div>`;
    } else if (k === 3) {
      const found = ui.foundKey !== null;
      html = `<p>Welcher Ton ist der erste? Hör den Lick, dann liegen Grundton und Quinte leise. Probier die Tasten aus – wenn du meinst, den Ton gefunden zu haben, logg ihn ein.</p>${placeholderHtml()}
        <div class="actions"><button class="btn primary" type="button" data-act="startton"${ui.running ? ' disabled' : ''}>▶ Lick und Grundton hören</button>${stopBtn('startton')}
        ${found ? '' : `<button class="btn" type="button" data-act="lock-start"${ui.pickedKey === null || ui.running ? ' disabled' : ''}>✓ Ton einloggen</button>`}
        ${ui.startFails >= 3 && !found ? '<button class="btn" type="button" data-act="startton">Lick nochmal hören</button>' : ''}
        ${ui.startFails >= 6 && !found ? '<button class="btn" type="button" data-act="show-me">Zeig ihn mir</button>' : ''}
        <button class="btn" type="button" data-act="next-step"${found || stepDone(lick, 3) ? '' : ' disabled'}>Weiter</button></div>
        <p class="feedback${ui.feedbackKind ? ` is-${ui.feedbackKind}` : ''}" role="status" aria-live="polite">${esc(ui.feedback)}</p>`;
    } else if (k === 4) {
      const n = lick.parts.length;
      const partNo = clamp(ui.part, 0, n - 1);
      const [a, b] = lick.parts[partNo];
      const last = partNo === n - 1;
      html = `<p><b>Teil ${partNo + 1} von ${n}</b> · ${b - a} Töne. Erst hörst du den Teil, dann ein Takt weiter Groove, dann bist du dran.</p>${ui.result && ui.result.part === partNo ? resultTimelineHtml(ui.result) : placeholderHtml()}
        <p class="feedback${ui.feedbackKind ? ` is-${ui.feedbackKind}` : ''}" role="status" aria-live="polite">${esc(ui.feedback)}</p>
        <div class="actions"><button class="btn primary" type="button" data-act="part-run"${ui.running ? ' disabled' : ''}>▶ ${ui.result && ui.result.part === partNo ? 'Nochmal' : 'Teil starten'}</button>${stopBtn('part')}
        ${ui.result && ui.result.part === partNo && ui.result.ok ? `<button class="btn" type="button" data-act="part-next">${last ? 'Weiter: Ganz' : 'Nächster Teil'}</button>` : ''}
        ${partNo > 0 ? '<button class="btn" type="button" data-act="part-prev">‹ Vorheriger Teil</button>' : ''}</div>`;
    } else if (k === 5) {
      const r = Math.min(it.whole, 2);
      const label = ['mit vollem Groove', 'mit Bassdrum und Snare', 'nur mit der Snare'][r];
      html = `<p><b>Runde ${Math.min(it.whole + 1, 3)} von 3</b> · ${label}. Du hörst den Lick einmal, dann spielst du ihn im selben Takt selbst.${it.whole >= 3 ? ' Alle drei Runden sind geschafft – du kannst weiter üben.' : ''}</p>
        ${ui.result && ui.result.kind === 'whole' ? resultTimelineHtml(ui.result) : placeholderHtml()}
        <p class="feedback${ui.feedbackKind ? ` is-${ui.feedbackKind}` : ''}" role="status" aria-live="polite">${esc(ui.feedback)}</p>${delayCardHtml()}
        <div class="actions"><button class="btn primary" type="button" data-act="whole-run"${ui.running ? ' disabled' : ''}>▶ ${ui.result && ui.result.kind === 'whole' ? 'Nochmal' : 'Runde starten'}</button>${stopBtn('whole')}
        ${it.whole >= 3 ? '<button class="btn" type="button" data-act="next-step">Weiter: Durchhalten</button>' : ''}</div>`;
    } else if (k === 6) {
      html = holdPanelHtml(lick, it);
    } else if (k === 7) {
      html = `<p>So sieht der Lick aus – Zeilen sind die Töne, oben zählst du mit. Die Marke läuft mit, die Tasten leuchten.</p>${rollHtml(lick)}
        <div class="actions"><button class="btn primary" type="button" data-act="roll-run"${ui.running ? ' disabled' : ''}>▶ Mitspielen und mitlesen</button>${stopBtn('roll')}
        <button class="btn" type="button" data-act="roll-done">${stepDone(lick, 7) ? '✓ Fertig' : 'Fertig'}</button></div>`;
    }
    p.innerHTML = html;
    if (k === 6 || (it.whole >= 3 && k === 5)) { /* Einschätzung hängt am Durchhalten (Schritt 6) */ }
  }

  /** Einschätzung: „Wie fühlt es sich an?“ — „Sitzt“ erst nach 8 Takten Durchhalten. */
  function rateHtml(lick, it) {
    return `<p style="margin-top:12px"><b>Wie fühlt es sich an?</b></p>
      <div class="rate"><button class="btn" type="button" data-rate="shaky">Noch wackelig</button><button class="btn" type="button" data-rate="ok">Geht schon</button>
      <button class="btn" type="button" data-rate="solid"${it.hold >= 2 ? '' : ' disabled'}>Sitzt</button></div>
      ${it.hold >= 2 ? '' : '<p class="note">Erst 8 Takte durchhalten.</p>'}
      <p class="note">Bestimmt, wann der Lick wieder in „Heute wiederholen“ auftaucht.${it.rating ? ` Zuletzt: ${{ shaky: 'noch wackelig', ok: 'geht schon', solid: 'sitzt' }[it.rating]}.` : ''}</p>`;
  }

  function holdPanelHtml(lick, it) {
    const stageNo = ui.holdStage;
    const st = HOLD_STAGES[stageNo - 1];
    const ladder = HOLD_STAGES.map((s, i) => {
      const n = i + 1;
      const done = it.hold >= n;
      const next = n === it.hold + 1;
      const enabled = n <= it.hold + 1;
      const label = ['4 Takte', '8 Takte', '8 mit Lücken', '16 mit Lücken'][i];
      return `<button type="button" class="${done ? 'is-done' : ''}${next ? ' is-next' : ''}" data-stage="${n}" aria-pressed="${stageNo === n}"${enabled ? '' : ' disabled'}>${done ? '✓ ' : ''}${label}</button>`;
    }).join('');
    const before = holdBefore(st);
    const result = ui.result && ui.result.kind === 'hold' ? ui.result : null;
    const nextStage = result && result.held && stageNo < 4 ? stageNo + 1 : null;
    return `<div class="ladder" role="group" aria-label="Stufen">${ladder}</div>
      <p>${before}</p>
      ${result ? stripHtml(result) : placeholderHtml()}
      <p class="feedback${ui.feedbackKind ? ` is-${ui.feedbackKind}` : ''}" role="status" aria-live="polite">${esc(ui.feedback)}</p>${delayCardHtml()}
      <div class="actions"><button class="btn primary" type="button" data-act="hold-run"${ui.running ? ' disabled' : ''}>▶ ${result ? 'Nochmal' : 'Start'}</button>${stopBtn('hold')}
      ${nextStage ? `<button class="btn" type="button" data-act="hold-next">Weiter: ${HOLD_STAGES[nextStage - 1].name}</button>` : ''}
      ${result && result.held && stageNo === 4 ? '<span class="note" style="align-self:center">Alle Stufen geschafft.</span>' : ''}</div>
      ${(it.hold >= 1 || result) && !ui.running ? rateHtml(lick, it) : ''}`;
  }
  /** Ein Satz vor dem Start: was kommt (nicht während des Laufs — dort gibt es keinen Zähler). */
  function holdBefore(st) {
    if (!st.on) return `${st.bars} Takte. Die Snare spielt durch – du hältst den Lick über die ganze Zeit. Am Ende ein Schlussschlag.`;
    const times = st.bars / (st.on + st.off);
    const sets = Math.ceil(times);
    return `${st.bars} Takte. Das Schlagzeug setzt ${sets === 2 ? 'zweimal' : sets === 3 ? 'dreimal' : `${sets}-mal`} für ${st.off} Takte aus – spiel weiter. Am Ende ein Schlussschlag.`;
  }

  /* ---- Ergebnis-Anzeigen (erst nach dem Lauf) ---- */

  /** Zeitleiste: Soll-Punkte ○, eigene Töne ● (grün genau, gelb knapp, rot zu viel). */
  function resultTimelineHtml(res) {
    const W = SVG_W - 24, x0 = 12;
    const span = res.span || 1;
    const X = (t) => (x0 + clamp(t / span, -.03, 1.03) * W).toFixed(1);
    const parts = [`<line class="tl" x1="${x0}" y1="52" x2="${x0 + W}" y2="52"/>`];
    for (let b = 0; b <= Math.round(res.bars || 0); b++) parts.push(`<line class="bar-l" x1="${X(b * res.barSec)}" y1="36" x2="${X(b * res.barSec)}" y2="68"/>`);
    for (const e of res.exp) parts.push(`<circle class="tg is-${e.status}" cx="${X(e.t)}" cy="52" r="5"/>`);
    for (const t of res.taps) parts.push(`<rect class="tp is-${t.status}" x="${(Number(X(t.t)) - 2).toFixed(1)}" y="40" width="4" height="24" rx="2"/>`);
    return `<div class="stage" data-result><svg viewBox="0 0 ${SVG_W} 104" role="img" aria-label="Ergebnis: ${res.hits} von ${res.exp.length} Tönen getroffen">${parts.join('')}
      <text class="lbl" x="12" y="92">○ Soll   ● du   grün = genau · gelb = knapp · rot = zu viel</text></svg></div>`;
  }
  /** Taktstreifen nach dem Durchhalten: „sicher“ ≥ 75 %, „wackelig“ ≥ 50 %, „verloren“ < 50 %; stille Takte schraffiert. */
  function stripHtml(res) {
    const cells = res.bars.map((b, i) => {
      const f = b.expected ? b.hit / b.expected : 1;
      const cls = f >= .75 ? 'is-sure' : f >= .5 ? 'is-wobbly' : 'is-lost';
      return `<div class="cell ${cls}${b.silent ? ' is-silent' : ''}" title="Takt ${i + 1}: ${b.hit} von ${b.expected}">${i + 1}</div>`;
    }).join('');
    return `<div class="strip" role="img" aria-label="Takte: ${res.bars.filter((b) => b.expected && b.hit >= .75 * b.expected).length} von ${res.bars.length} sicher">${cells}</div>
      <div class="legend"><span><i style="background:var(--ok-bg)"></i>sicher</span><span><i style="background:var(--wobble-bg)"></i>wackelig</span><span><i style="background:var(--lost-bg)"></i>verloren</span>
      <span><i style="background-image:repeating-linear-gradient(135deg,rgba(36,27,61,.4) 0 2px,transparent 2px 5px)"></i>still (ohne Schlagzeug)</span></div>`;
  }

  /** Piano-Roll (Notenbild, letzter Schritt): Zeilen = vorkommende Töne, oben Zählzeilen „1 e + a“. */
  function rollHtml(lick) {
    const midis = [...new Set(lick.notes.map((n) => lick.root + n[2]))].sort((a, b) => b - a);
    const rowH = 20, top = 22, left = 84, right = SVG_W - 8, total = lick.bars * TICKS_BAR;
    const H = top + midis.length * rowH + 8;
    const X = (tick) => left + (tick / total) * (right - left);
    const Y = (midi) => top + midis.indexOf(midi) * rowH;
    const p = [];
    midis.forEach((m, i) => { if (i % 2 === 0) p.push(`<rect class="row-bg" x="0" y="${top + i * rowH}" width="${SVG_W}" height="${rowH}"/>`); });
    const step = hatStep(lick);
    const labels = step === 3 ? ['1', 'e', '+', 'a'] : ['1', '+'];
    for (let t = 0; t < total; t += step) {
      const inBeat = t % 12;
      const beatNo = Math.floor((t % TICKS_BAR) / 12) + 1;
      const txt = inBeat === 0 ? String(beatNo) : labels[(inBeat / step) % labels.length];
      p.push(`<text class="lbl" x="${X(t) + 1}" y="14">${txt}</text>`);
    }
    for (let b = 0; b <= lick.bars; b++) p.push(`<line class="bar-l" x1="${X(b * TICKS_BAR)}" y1="${top}" x2="${X(b * TICKS_BAR)}" y2="${top + midis.length * rowH}"/>`);
    midis.forEach((m) => p.push(`<text class="row-l" x="6" y="${Y(m) + 14}">${esc(noteLabel(m))} · ${degreeLabel(m - lick.root)}</text>`));
    lick.notes.forEach((n, i) => {
      const m = lick.root + n[2];
      const w = Math.max(3, X(n[0] + n[1]) - X(n[0]) - 1.5);
      p.push(`<rect class="roll-note" x="${X(n[0]).toFixed(1)}" y="${Y(m) + 3}" width="${w.toFixed(1)}" height="${rowH - 6}" rx="3"/>`);
      if (n[3] && n[3].glide && i > 0) {
        const prev = lick.notes[i - 1];
        p.push(`<line class="roll-glide" x1="${(X(prev[0] + prev[1]) - 1).toFixed(1)}" y1="${Y(lick.root + prev[2]) + rowH / 2}" x2="${X(n[0]).toFixed(1)}" y2="${Y(m) + rowH / 2}"/>`);
      }
    });
    p.push(`<line class="ph" id="roll-ph" x1="${left}" y1="${top - 4}" x2="${left}" y2="${top + midis.length * rowH}" style="visibility:hidden"/>`);
    return `<div class="stage" data-roll data-left="${left}" data-right="${right}"><svg viewBox="0 0 ${SVG_W} ${H}" role="img" aria-label="Notenbild von ${esc(lick.name)}">${p.join('')}</svg></div>`;
  }

  /* ---- Tastatur ---- */
  const keyEls = new Map();
  // Die Tastatur wird nur neu gebaut, wenn sich die Lage ändert (anderer Lick, andere Oktave) —
  // sonst würde ein Neuzeichnen mitten im Tastendruck die gedrückte Taste austauschen, ihr
  // pointerup ginge verloren und der Ton bliebe hängen.
  let kbSig = '';
  function buildKeyboard() {
    const lick = currentLick();
    const kb = $('#keyboard');
    const sig = lick ? `${lick.id}|${octaveOf(lick)}` : '';
    if (sig && sig === kbSig && keyEls.size) { paintKeys(); return; }
    kbSig = sig;
    kb.replaceChildren();
    keyEls.clear();
    if (!lick) return;
    const [lo, hi] = keyboardRange(lick, octaveOf(lick));
    const whites = [];
    for (let m = lo; m <= hi; m++) if (isWhite(m)) whites.push(m);
    const wPct = 100 / whites.length;
    whites.forEach((midi, i) => {
      const el = document.createElement('div');
      el.className = 'white';
      el.dataset.midi = String(midi);
      kb.append(el);
      keyEls.set(midi, el);
      const black = midi + 1;
      if (i < whites.length - 1 && IS_BLACK[mod(black, 12)]) {
        const b = document.createElement('div');
        b.className = 'black';
        b.dataset.midi = String(black);
        b.style.left = `${(i + 1) * wPct - wPct * .31}%`;
        b.style.width = `${wPct * .62}%`;
        kb.append(b);
        keyEls.set(black, b);
      }
    });
    paintKeys();
  }
  const keysDown = new Map(); // pointerId → midi
  function paintKeys() {
    const down = new Set(keysDown.values());
    keyEls.forEach((el, midi) => {
      el.classList.toggle('is-down', down.has(midi));
      el.classList.toggle('is-picked', ui.foundKey === null && ui.pickedKey === midi);
      el.querySelector('.key-mark')?.remove();
    });
    // Ausgewählte, noch nicht eingeloggte Taste: neutral markiert, verrät nichts über richtig oder falsch.
    if (ui.foundKey === null && ui.pickedKey !== null && keyEls.has(ui.pickedKey)) {
      const pick = document.createElement('span');
      pick.className = 'key-mark is-pick';
      pick.textContent = '?';
      keyEls.get(ui.pickedKey).append(pick);
    }
    // Die gefundene Starttaste bleibt als kleine Stufenmarke stehen — sie verrät nur den Ausgangston.
    const lick = currentLick();
    if (lick && ui.foundKey !== null && keyEls.has(ui.foundKey)) {
      const mark = document.createElement('span');
      mark.className = 'key-mark';
      mark.textContent = degreeLabel(lick.notes[0][2]);
      keyEls.get(ui.foundKey).append(mark);
    }
  }
  const setLit = (midis) => keyEls.forEach((el, midi) => el.classList.toggle('is-lit', midis.has(midi)));

  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const key = el && el.closest('.white, .black');
    return key ? Number(key.dataset.midi) : null;
  }
  const kbEl = $('#keyboard');
  kbEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const midi = keyAt(e.clientX, e.clientY);
    if (midi === null) return;
    try { kbEl.setPointerCapture(e.pointerId); } catch { /* nicht überall verfügbar */ }
    keysDown.set(e.pointerId, midi);
    ownNoteOn(midi);
    onOwnKey(midi);
    paintKeys();
  });
  // Nicht waagrecht wischbar: kein Gleiten auf andere Tasten, Lagenwechsel nur über „Okt −/+“.
  const upKey = (e) => {
    if (!keysDown.has(e.pointerId)) return;
    const midi = keysDown.get(e.pointerId);
    keysDown.delete(e.pointerId);
    if (![...keysDown.values()].includes(midi)) ownNoteOff(midi);
    paintKeys();
  };
  ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach((type) => kbEl.addEventListener(type, upKey));
  kbEl.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ------------------------------------------------------------------------
     ABLÄUFE DER SCHRITTE
     ------------------------------------------------------------------------ */
  function releaseDrone() { if (ui.drone) { engine.stopDrone(ui.drone); ui.drone = null; } }
  const rerender = () => { const lick = currentLick(); if (lick) { renderPanel(lick, itemOf(lick.id)); if (ui.step !== 7) setLit(new Set()); } };

  /** Lauf mit Statusanzeige: key = Name der Anzeige, evalFn(info) nach dem Ende. */
  async function beginRun(key, tl, evalFn) {
    ui.running = key;
    setFeedback('');
    rerender();
    const ok = await startRun(tl, (info) => {
      ui.running = '';
      if (info && evalFn) evalFn(info);
      const l = currentLick();
      if (l) renderLick(); else renderList();
    });
    if (!ok) { ui.running = ''; setFeedback('Web Audio ist auf diesem Gerät nicht verfügbar.', 'bad'); rerender(); }
    else if (!run.playing) { /* sofort beendet */ }
  }

  /** Vorbild einmal über Groove `full`: Einzähler, Lick, ggf. weiter. */
  function tlHear(lick, times = 1, gapBars = 0) {
    const tl = makeTimeline(lick);
    let bar = tl.countIn(0);
    const octave = state.octave[lick.id] ? octaveOf(lick) : 0;
    for (let k = 0; k < times; k++) {
      for (let b = 0; b < lick.bars; b++) tl.groove(bar + b, 'full');
      tl.lick(bar, { octave });
      bar += lick.bars;
      if (k < times - 1) for (let b = 0; b < gapBars; b++) { tl.groove(bar, 'full'); bar++; }
    }
    tl.end(bar);
    return tl;
  }

  const timeIn = (taps, from, to) => taps.filter((x) => x.t >= from && x.t <= to).sort((a, b) => a.t - b.t);
  const minGapSec = (expList, fallback = 12) => {
    let g = Infinity;
    for (let i = 1; i < expList.length; i++) g = Math.min(g, expList[i].t - expList[i - 1].t);
    return Number.isFinite(g) ? g : fallback * .05;
  };
  /** Jedem Soll-Punkt den nächsten freien Anschlag mit richtiger Tonklasse zuordnen. */
  function assign(exp, taps, tol) {
    const used = new Set();
    const res = exp.map((e) => {
      let best = -1, bd = Infinity;
      taps.forEach((x, i) => { const d = Math.abs(x.t - e.t); if (!used.has(i) && d <= tol && x.pc === e.pc && d < bd) { bd = d; best = i; } });
      if (best < 0) return { t: e.t, status: 'miss' };
      used.add(best);
      return { t: e.t, status: bd <= .04 ? 'good' : 'near', off: taps[best].t - e.t, tap: best };
    });
    const tapStatus = taps.map((x, i) => ({ t: x.t, status: 'extra' }));
    res.forEach((r) => { if (r.tap !== undefined) tapStatus[r.tap].status = r.status; });
    return { exp: res, taps: tapStatus, hits: res.filter((r) => r.status !== 'miss').length };
  }

  /* Schritt 1–3 */
  function stepHear() {
    const lick = currentLick();
    beginRun('hear', tlHear(lick, 2, 1), () => { ui.result = 'heard'; });
  }
  function stepSing() {
    const lick = currentLick();
    beginRun('sing', tlHear(lick, 2, 0), () => { ui.result = 'sung'; });
  }
  function stepStartton() {
    const lick = currentLick();
    releaseDrone();
    beginRun('startton', tlHear(lick, 1), (info) => {
      if (!info || ui.step !== 3 || !engine.ctx) return;
      // Grundton + Quinte leise, in mittlerer Lage: keine Terz (verrät nicht Dur/Moll).
