<!--
  PIANO (Datei: piano.html) — Klavier zum Singen-Üben: Anfangstöne geben,
  Linien spielen, Intervalle prüfen. Querformat zuerst (große Tasten über
  die ganze Breite), im Hochformat kompakter mit Hinweis zum Drehen.
  In der App: Einstellungen → Tools → Piano (Vollbild-iframe, ?embedded=1,
  der Schließen-Knopf gehört der App). Offline über SHELL_OPTIONAL in sw.js.
  Nur Deutsch, keine Abhängigkeiten.

  Klang ohne Samples und ohne Bibliotheken (Web Audio):
  - je Taste zwei leicht gegeneinander verstimmte "Saiten" (Schwebung wie
    beim echten Klavier, das zwei bis drei Saiten je Ton hat),
  - Wellenform mit Obertönen nach dem Anschlagpunkt des Hammers
    (Amplitude ~ |sin(π·n/7)|/n — der 7. Oberton fehlt fast),
  - Tiefpass, der nach dem Anschlag dunkler wird (hohe Obertöne klingen
    beim Klavier schneller ab), Anschlagstärke → Helligkeit,
  - zweistufiges Abklingen (schneller "Anschlagteil", langer Nachklang),
    tiefe Töne klingen länger als hohe,
  - kurzes Hammergeräusch und ein kleiner, erzeugter Raumhall.
-->
<style>
  :root {
    --accent: #F868B0; --accent-rgb: 248,104,176;
    --bg: #fff7ec; --surface: #ffffff; --surface-2: #fff1e2; --line: #f1ddd0;

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }

    display: flex; flex-direction: column; color: var(--text); background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; background: none; border: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-foreground); outline-offset: 2px; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  .bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  }
  /* Quer: eine Zeile, knapp, damit die Klaviatur ihre Höhe behält. */
  @media (orientation: landscape) { .bar { flex-wrap: nowrap; gap: 6px; padding-top: max(3px, env(safe-area-inset-top)); padding-bottom: 3px; } }
  .bar .k-title { margin: 0 6px 0 0; }
  @media (orientation: landscape) { .bar .k-title { margin-right: 2px; } }
  .group { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 0; }
  .group button { min-width: 44px; height: 44px; padding: 0 10px; border-radius: 999px; font-size: .74rem; font-weight: 800; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .group button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .group .range { min-width: 70px; text-align: center; font-size: .74rem; font-weight: 800; }
  .vol { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .vol input { width: 90px; min-height: 44px; accent-color: var(--accent-foreground); }
  .spacer { flex: 1; }
  .hint { flex: 0 0 auto; margin: 0 12px 8px; padding: 8px 12px; border-radius: 12px; background: rgba(var(--accent-rgb), .12); color: var(--text); font-size: .74rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .hint svg { color: var(--accent-foreground); flex: 0 0 auto; }
  @media (orientation: landscape) { .hint:not(.hint-solf) { display: none; } }
  .hint-solf[hidden] { display: none; }

  .keyboard-wrap { flex: 1 1 auto; min-height: 0; display: flex; padding: 0 max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
  .keyboard { position: relative; flex: 1; display: flex; touch-action: none; border-radius: 0 0 12px 12px; overflow: hidden;
    border-top: 6px solid var(--text); box-shadow: 0 8px 22px rgba(36,27,61,.18); }
  @media (orientation: portrait) { .keyboard-wrap { align-items: flex-end; } .keyboard { height: min(62vh, 100%); } }
  .white { position: relative; flex: 1 1 0; border-right: 1px solid #d9cfd6; background: linear-gradient(#fff, #fbf7f3 85%, #efe6ea); border-radius: 0 0 8px 8px; }
  .white:last-child { border-right: 0; }
  .white.is-down { background: linear-gradient(#f3eaf0, rgba(var(--accent-rgb), .35)); }
  .black { position: absolute; top: 0; height: 60%; z-index: 2; border-radius: 0 0 6px 6px;
    background: linear-gradient(#3a3350, #1c1730 88%); box-shadow: inset 0 -4px 0 rgba(255,255,255,.08), 0 3px 5px rgba(0,0,0,.35); }
  .black.is-down { background: linear-gradient(#2a2340, rgb(var(--accent-rgb))); }
  .label { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: .72rem; font-weight: 800; color: var(--muted); pointer-events: none; }
  .black .label { bottom: 8px; color: rgba(255,255,255,.75); font-size: .58rem; }
  .white.is-c .label { color: var(--text); }
  .mid-c::after { content: ""; position: absolute; left: 50%; bottom: 34px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--accent); pointer-events: none; }
  .white.is-mark { box-shadow: inset 0 -5px 0 rgba(var(--accent-rgb), .55); }
</style>

<body>
<div class="bar">
  <!-- Zurück: eingebettet schließt es das Tool (die App blendet ihr ✕ per data-own-back aus), eigenständig versteckt. -->
  <button class="k-round" type="button" data-own-back-btn aria-label="Zurück" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <h1 class="k-title">Piano</h1>
  <div class="group" role="group" aria-label="Lage">

<div class="keyboard-wrap"><div class="keyboard" aria-label="Klaviatur"></div></div>

<script src="./harmony.js"></script>
<script src="./piano-samples.js"></script>
<script>
(function () {
  'use strict';

  const EMBEDDED = new URLSearchParams(location.search).has('embedded');
  if (EMBEDDED) {
    document.documentElement.classList.add('is-embedded');
    // Eigener runder Zurück-Knopf: die App blendet dann ihr ✕ aus (data-own-back).
    document.documentElement.setAttribute('data-own-back', '');
  }
  // In der App eingebettet: deren Akzentfarbe übernehmen (gleiche Herkunft).
  try {
    if (window.parent !== window) {
      const appStyle = getComputedStyle(window.parent.document.documentElement);
      const accent = appStyle.getPropertyValue('--accent').trim();
      const rgb = appStyle.getPropertyValue('--accent-rgb').trim();
      if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
      if (/^\d+,\s*\d+,\s*\d+$/.test(rgb)) document.documentElement.style.setProperty('--accent-rgb', rgb);
      // Dunkle Textvariante der Akzentfarbe (≥ 4,5:1, deriveAccentForeground in app.js).
      const fg = appStyle.getPropertyValue('--accent-foreground').trim();
      if (/^#[0-9a-f]{6}$/i.test(fg)) document.documentElement.style.setProperty('--accent-foreground', fg);
    }
  } catch { /* eigenständig geöffnet */ }

  const $ = (sel) => document.querySelector(sel);
  const backBtn = $('[data-own-back-btn]');
  backBtn.hidden = !EMBEDDED || window.parent === window;
  backBtn.addEventListener('click', () => { if (window.parent !== window) window.parent.postMessage({ type: 'chor-tool-close' }, location.origin); });
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const mod = (n, m) => ((n % m) + m) % m;


  // Feste Solmisation (romanische Tradition: Si = H) mit Vorzeichen wie
  // die neutralen Tonnamen — keine bewegliche Do-Silbe.
  const SOLF = ['Do', 'Do♯', 'Re', 'Mi♭', 'Mi', 'Fa', 'Fa♯', 'Sol', 'La♭', 'La', 'Si♭', 'Si'];
  // Tonnamen aus harmony.js (gemeinsam mit Groove Lab, Ausbildung, Einsingen).
  const { spell, noteLabel, spellCheck } = window.ChorHarmony;
  const IS_BLACK = [false, true, false, true, false, false, true, false, true, false, true, false];
  const LOWEST_C = 24;   // C1
  const HIGHEST = 96;    // C7

  /* ---------------- Zustand & Ablage ---------------- */

  // keySize: Stufe der Tastenbreite (KEY_SIZES), Standard breiter als früher.
  // solfHint: Hinweis „Do = C“ schon einmal gezeigt (beim ersten Einschalten von „Do Re Mi (fest)“).
  const state = { startC: 48, labels: 'names', pedal: false, volume: .8, keySize: 2, solfHint: false };
  const STORAGE_ID = 'piano';
  const storage = (() => { try { return window.parent !== window ? window.parent.chorToolStorage || null : null; } catch { return null; } })();
  let saveTimer = 0;
  function persist() {
    if (!storage) return;
    clearTimeout(saveTimer);
    // Nur Lage, Beschriftung und Lautstärke — das Pedal ist beim Öffnen
    // immer aus (sonst klingt ungewollt alles nach).
    saveTimer = setTimeout(writeNow, 300);
  }
  function writeNow() {
    saveTimer = 0;
    try { return Promise.resolve(storage.save(STORAGE_ID, { startC: state.startC, labels: state.labels, volume: state.volume, keySize: state.keySize, solfHint: state.solfHint })).catch(() => {}); } catch { return null; /* Ablage weg */ }
  }
  /* Noch ausstehendes Speichern sofort erledigen: Die App ruft das vor dem
     Schließen des Tools auf (danach liefe der Timer im entfernten iframe nie
     mehr — „Sitzt“ tippen und gleich zurück ging sonst verloren), dazu
     pagehide, wenn die ganze Seite geht. */
  function flushSave() {
    if (!saveTimer) return null;
    clearTimeout(saveTimer);
    return writeNow();
  }
  window.chorToolFlush = flushSave;
  window.addEventListener('pagehide', flushSave);
  async function restore() {
    if (!storage) return;
    try {
      const data = await storage.load(STORAGE_ID);
      if (!data || typeof data !== 'object') return;
      if (Number.isInteger(data.startC) && mod(data.startC, 12) === 0) state.startC = clamp(data.startC, LOWEST_C, 72);
      if (['none', 'names', 'solf'].includes(data.labels)) state.labels = data.labels;
      if (Number.isFinite(data.volume)) state.volume = clamp(data.volume, 0, 1);
      if (Number.isInteger(data.keySize) && data.keySize >= 0 && data.keySize < KEY_SIZES.length) state.keySize = data.keySize;
      if (data.solfHint === true) state.solfHint = true;
    } catch { /* nichts gespeichert */ }
  }

  /* ---------------- Klang ---------------- */

  const audio = { ctx: null, master: null, dry: null, wet: null, noise: null, waves: new Map(), voices: new Map(), all: new Set() };

  function ensureAudio() {
    if (audio.ctx) {
      if (audio.ctx.state !== 'running' && audio.ctx.resume) Promise.resolve(audio.ctx.resume()).catch(() => {}); // (Offline-Kontext im Selbsttest)
      return audio.ctx;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = new AC({ latencyHint: 'interactive' });
    audio.ctx = ctx;
    const master = ctx.createGain();
    master.gain.value = state.volume;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -10; limiter.ratio.value = 8; limiter.attack.value = .003; limiter.release.value = .2;
    master.connect(limiter).connect(ctx.destination);
    // Kleiner Raum: erzeugter Nachhall (abklingendes Rauschen, stereo).
    const convolver = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 1.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * (i < 200 ? i / 200 : 1);
    }
    convolver.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = .16;
    const dry = ctx.createGain(); dry.gain.value = 1;
    dry.connect(master);
    dry.connect(convolver).connect(wet).connect(master);
    Object.assign(audio, { master, dry, wet });
    ensureNoise();
    return ctx;
  }
  /** Hammergeräusch: ein kurzer Rauschpuffer, je Anschlag gefiltert. */
  function ensureNoise() {
    if (audio.noise) return;
    const ctx = audio.ctx, nlen = Math.floor(ctx.sampleRate * .03);
    const noise = ctx.createBuffer(1, nlen, ctx.sampleRate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nlen; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nlen, 2);
    audio.noise = noise;
  }

  /** Wellenform je Lage (gecacht): Obertöne nach dem Anschlagpunkt —
   *  tiefe Töne obertonreicher, hohe fast sinusförmig. */
  function waveFor(midi) {
    const band = midi < 48 ? 0 : midi < 64 ? 1 : midi < 76 ? 2 : 3;
    // Je Kontext (eine PeriodicWave gehört ihrem Kontext – Selbsttest rendert offline).
    if (audio.waves.get(band)?.ctx === audio.ctx) return audio.waves.get(band).wave;
    const count = [28, 20, 12, 6][band];
    const real = new Float32Array(count + 1);
    const imag = new Float32Array(count + 1);
    for (let n = 1; n <= count; n++) {
      const strike = Math.abs(Math.sin(Math.PI * n / 7.2));
      imag[n] = (strike + .08) / Math.pow(n, band === 0 ? .95 : 1.15);
    }
    const wave = audio.ctx.createPeriodicWave(real, imag, { disableNormalization: false });
    audio.waves.set(band, { ctx: audio.ctx, wave });
    return wave;
  }

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
  const MAX_VOICES = 28;
  /** Abklingzeit der Synthese (s): tief lang, hoch kurz – auch Maß für den
   *  verlängerten Ausklang der Samples. */
  const decayOf = (f) => clamp(9 * Math.pow(110 / f, .55), 1.1, 14);

  /* ---------------- Samples (echtes Klavier) ----------------
     Salamander Grand Piano (Yamaha C5, Alexander Holm, CC BY 3.0) über
     piano-samples.js – dasselbe Klavier wie in Hören/Singen und Einsingen.
     Alle Töne C1–C7, je nach Lage auf den natürlichen Ausklang gekürzt
     (tief bis 10 s, hoch 3 s), auf gleichstufig umgestimmt. Geladen beim
     Öffnen (offline aus dem Sample-Cache); bis dahin bzw. ohne Netz die
     Synthese unten. */
  const PLAY_GAIN = 1; // Pegel gegenüber der Synthese (piano.selfCheckAudio misst)
  const smp = { set: null, loading: null, failedAt: 0 };
  const keepOf = (n) => clamp(decayOf(hz(n)) * 1.1, 3, 10);
  function loadPianoSamples() {
    if (smp.set) return Promise.resolve(smp.set);
    if (smp.loading) return smp.loading;
    if (!window.ChorPiano) return Promise.reject(new Error('piano-samples.js fehlt'));
    smp.loading = ChorPiano.load({ keepSec: keepOf })
      .then((set) => (smp.set = set))
      .catch((err) => { smp.failedAt = Date.now(); throw err; })
      .finally(() => { smp.loading = null; });
    return smp.loading;
  }
  /** Ton aus den Samples; gleiche Stimme wie die Synthese ({ out, oscs, … }),
   *  damit Dämpfen, Pedal und Stimmenzahl unverändert funktionieren.
   *  Anschlagstärke: lauter und heller (eine Aufnahme, der Filter macht leise Töne weicher). */
  function sampledVoice(ctx, midi, velocity, t) {
    const f = hz(midi);
    const { src, out } = ChorPiano.play(ctx, smp.set, midi, t, {
      gain: PLAY_GAIN * (.3 + velocity * .7) * (midi < 40 ? .8 : 1),
      cutoff: clamp(f * (3 + velocity * 16), 1200, 18000),
    });
    return { out, oscs: [src] };
  }

  function noteOn(midi, velocity = .8) {
    const ctx = ensureAudio();
    if (!ctx) return;
    // Gleiche Taste nochmal: alte Saite abdämpfen (wie beim echten Klavier).
    const old = audio.voices.get(midi);
    if (old) damp(old, .03);
    if (audio.all.size >= MAX_VOICES) { const oldest = audio.all.values().next().value; damp(oldest, .02); }
    const t = ctx.currentTime + .005;
    const f = hz(midi);
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) pan.pan.value = clamp((midi - 60) / 40, -.5, .5);
    // Laden fehlgeschlagen (offline)? Beim Spielen höchstens alle 30 s neu versuchen.
    if (!smp.set && !smp.loading && Date.now() - smp.failedAt > 30000) loadPianoSamples().catch(() => {});
    if (smp.set) {
      const { out, oscs } = sampledVoice(ctx, midi, velocity, t);
      if (pan) out.connect(pan).connect(audio.dry); else out.connect(audio.dry);
      const voice = { midi, out, oscs, done: false, held: true, sampled: true };
      oscs[0].addEventListener('ended', () => { voice.done = true; audio.all.delete(voice); if (audio.voices.get(midi) === voice) audio.voices.delete(midi); }, { once: true });
      audio.voices.set(midi, voice);
      audio.all.add(voice);
      return;
    }
    // Synthese (bis die Samples geladen sind, ohne Netz). Abklingzeit: tief lang, hoch kurz.
    const decay = decayOf(f);
    const peak = .22 * (.45 + velocity * .55) * (midi < 40 ? .8 : 1);

    const out = ctx.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(peak, t + .004);
    out.gain.setTargetAtTime(peak * .42, t + .006, decay * .07);        // Anschlagteil
    out.gain.setTargetAtTime(0.0001, t + decay * .18, decay * .32);    // Nachklang

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.Q.value = .4;
    const bright = clamp(f * (5 + velocity * 9), 900, 15000);
    lp.frequency.setValueAtTime(bright, t);
    lp.frequency.setTargetAtTime(clamp(f * 2.2, 400, 6000), t + .02, decay * .22);

    const wave = waveFor(midi);
    const oscs = [0, 1].map((i) => {
      const o = ctx.createOscillator();
      o.setPeriodicWave(wave);
      o.frequency.value = f;
      o.detune.value = i ? 1.8 : -.6;  // zwei Saiten, leicht verstimmt → Schwebung
      const g = ctx.createGain(); g.gain.value = i ? .45 : .55;
      o.connect(g).connect(lp);
      o.start(t);
      return o;
    });
    lp.connect(out);
    if (pan) out.connect(pan).connect(audio.dry); else out.connect(audio.dry);

    // Hammer: kurzes, gefiltertes Rauschen.
    const n = ctx.createBufferSource();
    n.buffer = audio.noise;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = clamp(f * 3.5, 400, 7000); bp.Q.value = .9;
    const ng = ctx.createGain(); ng.gain.value = .05 * velocity;
    n.connect(bp).connect(ng).connect(out);
    n.start(t);

    const voice = { midi, out, oscs, done: false, held: true };
    const stopAt = t + decay * 2.2;
    oscs.forEach((o) => o.stop(stopAt));
    oscs[0].addEventListener('ended', () => { voice.done = true; audio.all.delete(voice); if (audio.voices.get(midi) === voice) audio.voices.delete(midi); }, { once: true });
    audio.voices.set(midi, voice);
    audio.all.add(voice);
  }

  function damp(voice, time = .09) {
    if (!voice || voice.done || !audio.ctx) return;
    const now = audio.ctx.currentTime;
    try {
      voice.out.gain.cancelScheduledValues(now);
      voice.out.gain.setValueAtTime(Math.max(voice.out.gain.value, .0001), now);
      voice.out.gain.setTargetAtTime(0, now, time);
      voice.oscs.forEach((o) => o.stop(now + time * 8));
    } catch { /* schon gestoppt */ }
    voice.done = true;
    audio.all.delete(voice);
    if (audio.voices.get(voice.midi) === voice) audio.voices.delete(voice.midi);
  }

  function noteOff(midi) {
    const voice = audio.voices.get(midi);
    if (!voice) return;
    voice.held = false;
    // Sehr hohe Saiten haben beim Klavier keinen Dämpfer.
    if (!state.pedal && midi < 89) damp(voice);
  }

  let pedalTouched = false;
  function setPedal(on) {
    pedalTouched = true;
    state.pedal = on;
    $('[data-act="pedal"]').setAttribute('aria-pressed', String(on));
    if (!on) audio.voices.forEach((v) => { if (!v.held && v.midi < 89) damp(v); });
    persist();
  }

  /* ---------------- Klaviatur ---------------- */

  let whiteCount = 14;
  const keyEls = new Map();

  // Mindestbreite einer weißen Taste in px je Stufe (−/+ in der Leiste);
  // Stufe 0 entspricht der früheren Breite, Standard ist Stufe 2.
  const KEY_SIZES = [[34, 40], [42, 48], [50, 56], [60, 66], [72, 80]]; // [hoch, quer]
  function visibleWhiteKeys() {
    const w = $('.keyboard').clientWidth || window.innerWidth;
    const landscape = window.innerWidth > window.innerHeight;
    const min = KEY_SIZES[state.keySize][landscape ? 1 : 0];
    return clamp(Math.floor(w / min), 5, 36);
  }

  function build() {
    whiteCount = visibleWhiteKeys();
    // Nicht über das obere Ende hinaus: Start notfalls nach unten schieben.
    const whites = [];
    let m = state.startC;
    while (whites.length < whiteCount) { if (!IS_BLACK[mod(m, 12)]) whites.push(m); m++; }
    while (whites[whites.length - 1] > HIGHEST && state.startC > LOWEST_C) { state.startC -= 12; return build(); }
    const kb = $('.keyboard');
    kb.replaceChildren();
    keyEls.clear();
    const wPct = 100 / whites.length;
    whites.forEach((midi, i) => {
      const el = document.createElement('div');
      el.className = `white${mod(midi, 12) === 0 ? ' is-c' : ''}${midi === 60 ? ' mid-c' : ''}`;
      el.dataset.midi = String(midi);
      el.innerHTML = '<span class="label"></span>';
      kb.append(el);
      keyEls.set(midi, el);
      const black = midi + 1;
      if (i < whites.length - 1 && IS_BLACK[mod(black, 12)]) {
        const b = document.createElement('div');
        b.className = 'black';
        b.dataset.midi = String(black);
        b.style.left = `${(i + 1) * wPct - wPct * .31}%`;
        b.style.width = `${wPct * .62}%`;
        b.innerHTML = '<span class="label"></span>';
        kb.append(b);
        keyEls.set(black, b);
      }
    });
    renderLabels();
    $('.range').textContent = `${noteLabel(whites[0])} – ${noteLabel(whites[whites.length - 1])}`;
    $('[data-act="down"]').disabled = state.startC <= LOWEST_C;
    $('[data-act="narrower"]').disabled = state.keySize <= 0;
    $('[data-act="wider"]').disabled = state.keySize >= KEY_SIZES.length - 1;
    $('[data-act="up"]').disabled = whites[whites.length - 1] + 12 > HIGHEST;
    paintDown();
  }

  /** Tastenbeschriftung in Helmholtz-Schreibweise: jedes C mit Oktave
   *  (c′ = MIDI 60), die übrigen Tasten nur mit Namen in der Groß-/
   *  Kleinschreibung ihrer Oktave (H, c, d … h, c′). */
  function keyLabel(midi) {
    if (mod(midi, 12) === 0) return noteLabel(midi);
    const name = spell(midi);
    return Math.floor(midi / 12) - 1 >= 3 ? name.toLowerCase() : name;
  }

  function renderLabels() {
    keyEls.forEach((el, midi) => {
      const pc = mod(midi, 12);
      let text = '';
      if (state.labels === 'names') text = keyLabel(midi);
      else if (state.labels === 'solf') text = SOLF[pc];
      el.querySelector('.label').textContent = text;
    });
    $$('[data-labels]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.labels === state.labels)));
  }

  /* ---------------- Spielen: Finger, Maus, Tastatur ---------------- */

  const pointers = new Map();   // pointerId → midi
  const keysDown = new Map();   // KeyboardEvent.code → midi
  let lastGroup = [];
  let lastGroupAt = 0;

  function paintDown() {
    const down = new Set([...pointers.values(), ...keysDown.values()]);
    keyEls.forEach((el, midi) => el.classList.toggle('is-down', down.has(midi)));
  }

  function press(midi, velocity) {
    noteOn(midi, velocity);
    const now = performance.now();
    if (now - lastGroupAt > 90) lastGroup = [];
    lastGroup.push(midi);
    lastGroupAt = now;
  }

  function release(midi) {
    const stillDown = [...pointers.values(), ...keysDown.values()].includes(midi);
    if (!stillDown) noteOff(midi);
  }

  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const key = el && el.closest('.white, .black');
    return key ? Number(key.dataset.midi) : null;
  }

  /** Anschlagstärke aus der Tiefe des Tipps auf der Taste (vorn = kräftig). */
  function velocityAt(midi, y) {
    const el = keyEls.get(midi);
    if (!el) return .75;
    const r = el.getBoundingClientRect();
    return clamp(.45 + ((y - r.top) / r.height) * .55, .4, 1);
  }

  const kb = $('.keyboard');
  kb.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const midi = keyAt(e.clientX, e.clientY);
    if (midi === null) return;
    pointers.set(e.pointerId, midi);
    press(midi, velocityAt(midi, e.clientY));
    paintDown();
  });
  // Gleiten: jeder Finger wechselt beim Überstreichen auf die neue Taste.
  kb.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const midi = keyAt(e.clientX, e.clientY);
    const prev = pointers.get(e.pointerId);
    if (midi === null || midi === prev) return;
    pointers.set(e.pointerId, midi);
    release(prev);
    press(midi, .7);
    paintDown();
  });
  const up = (e) => {
    if (!pointers.has(e.pointerId)) return;
    const midi = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    release(midi);
    paintDown();
  };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => kb.addEventListener(type, up));
  kb.addEventListener('contextmenu', (e) => e.preventDefault());

  // Computertastatur: zwei Reihen wie bei vielen Keyboard-Programmen, ab dem
  // ersten sichtbaren C (Z und Y sind beide G♯ — deutsches und englisches Layout).
  const KEY_OFFSETS = {
    KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7, KeyY: 8, KeyZ: 8, KeyH: 9, KeyU: 10, KeyJ: 11,
    KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16, Quote: 17,
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (document.documentElement.classList.contains('is-embedded')) window.parent.postMessage({ type: 'chor-tool-close' }, location.origin);
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches('input')) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) setPedal(true); return; }
    if (e.repeat) return;
    const off = KEY_OFFSETS[e.code];
    if (off === undefined) return;
    e.preventDefault();
    const midi = state.startC + off;
    keysDown.set(e.code, midi);
    press(midi, .75);
    paintDown();
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { setPedal(false); return; }
    const midi = keysDown.get(e.code);
    if (midi === undefined) return;
    keysDown.delete(e.code);
    release(midi);
    paintDown();
  });

  /* ---------------- Bedienleiste ---------------- */

  document.querySelector('.bar').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    if (btn.dataset.labels) { state.labels = btn.dataset.labels; showSolfHint(); renderLabels(); persist(); return; }
    if (act === 'down') { state.startC = Math.max(LOWEST_C, state.startC - 12); build(); persist(); }
    else if (act === 'up') { state.startC = Math.min(72, state.startC + 12); build(); persist(); }
    else if (act === 'narrower' || act === 'wider') { state.keySize = clamp(state.keySize + (act === 'wider' ? 1 : -1), 0, KEY_SIZES.length - 1); build(); persist(); }
    else if (act === 'pedal') setPedal(!state.pedal);
    else if (act === 'repeat' && lastGroup.length) {
      const group = [...lastGroup];
      group.forEach((midi) => noteOn(midi, .75));
      group.forEach((midi) => { const el = keyEls.get(midi); if (el) { el.classList.add('is-mark'); setTimeout(() => el.classList.remove('is-mark'), 500); } });
      setTimeout(() => group.forEach((midi) => { if (!state.pedal) { const v = audio.voices.get(midi); if (v) { v.held = false; damp(v, .25); } } }), 1400);
    }
  });
  /** Beim ersten Einschalten der festen Silben einmal erklären: Das Klavier
   *  zählt mit festem Do (Do = C), alle Übungen mit beweglichem do. */
  let solfHintTimer = 0;
  function showSolfHint() {
    const el = $('.hint-solf');
    if (state.labels !== 'solf') { el.hidden = true; return; }
    if (state.solfHint) return;
    state.solfHint = true;
    el.hidden = false;
    clearTimeout(solfHintTimer);
    solfHintTimer = setTimeout(() => { el.hidden = true; }, 8000);
  }
  $('.vol input').addEventListener('input', (e) => {
    state.volume = Number(e.target.value);
    if (audio.master) audio.master.gain.setTargetAtTime(state.volume, audio.ctx.currentTime, .02);
    persist();
  });

  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(build, 120); });
  // Beim Wegschalten alles abdämpfen, damit nichts hängen bleibt.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pointers.clear(); keysDown.clear(); audio.all.forEach((v) => damp(v, .05)); paintDown(); }
  });

  // Für Tests: Zugriff auf die Klangerzeugung.
  /** Selbstprüfung (Konsole des iframes: `piano.selfCheck()`) — leer = ok. */
  function selfCheck() {
    const errors = [...spellCheck()];
    if (SOLF.length !== 12 || SOLF[11] !== 'Si' || SOLF[10] !== 'Si♭' || SOLF[8] !== 'La♭' || SOLF[1] !== 'Do♯') errors.push(`Solmisation: ${SOLF.join(' ')}`);
    if (document.documentElement.hasAttribute('data-own-back') !== EMBEDDED) errors.push('data-own-back passt nicht zu ?embedded');
    if (!backBtn || !backBtn.hasAttribute('data-own-back-btn') || backBtn.hidden === (EMBEDDED && window.parent !== window)) errors.push('Zurück-Knopf fehlt oder falsch sichtbar');
    if (state.pedal && !pedalTouched) errors.push('Pedal ist nach dem Öffnen an');
    [[60, 'c′'], [62, 'd'], [59, 'h'], [47, 'H'], [58, 'b'], [49, 'cis'], [37, 'Cis'], [36, 'C']].forEach(([midi, want]) => {
      if (keyLabel(midi) !== want) errors.push(`Tastenname ${midi} = ${keyLabel(midi)}, erwartet ${want}`);
    });
    // Tastenbreite: breiter = weniger Tasten, nie unter 5.
    const savedSize = state.keySize;
    const counts = KEY_SIZES.map((_, i) => { state.keySize = i; return visibleWhiteKeys(); });
    state.keySize = savedSize;
    if (counts.some((n, i) => i && n > counts[i - 1]) || Math.min(...counts) < 5) errors.push(`Tastenbreite: ${counts.join(',')}`);
    if (KEY_SIZES[state.keySize] === undefined) errors.push('Tastenbreite ungültig');
    // Festes Do: Knopf mit title, Hinweis genau beim ersten Einschalten (Übe-Korrekturen 10d).
    {
      const saved = { labels: state.labels, solfHint: state.solfHint }, el = $('.hint-solf');
      const wasHidden = el.hidden;
      if (!/Do ist hier immer C/.test($('[data-labels="solf"]').title)) errors.push('Do Re Mi (fest): title fehlt');
      state.solfHint = false; state.labels = 'solf'; showSolfHint();
      if (el.hidden || !state.solfHint) errors.push('Hinweis „Do = C“ erscheint nicht beim ersten Einschalten');
      el.hidden = true; state.labels = 'names'; showSolfHint(); state.labels = 'solf'; showSolfHint();
      if (!el.hidden) errors.push('Hinweis „Do = C“ erscheint ein zweites Mal');
      clearTimeout(solfHintTimer);
      state.labels = saved.labels; state.solfHint = saved.solfHint; el.hidden = wasHidden;
    }
    return errors;
  }

  /** Klang-Prüfung (async, Konsole: `await piano.selfCheckAudio()`): Samples
   *  geladen, Tonhöhe auch zwischen den Dateien, verlängerter Ausklang ohne
   *  Sprung, Pegel wie die Synthese, Rückfall auf die Synthese. */
  async function selfCheckAudio() {
    const errors = [];
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return ['OfflineAudioContext fehlt'];
    try { await loadPianoSamples(); } catch (err) { return [`Klavier-Samples nicht geladen (${err.message})`]; }
    const sr = 48000;
    const render = async (sec, fn) => {
      const ctx = new OAC(1, Math.round(sr * sec), sr);
      const save = { ctx: audio.ctx, dry: audio.dry, voices: audio.voices, all: audio.all };
      Object.assign(audio, { ctx, dry: ctx.destination, voices: new Map(), all: new Set() });
      try { fn(); } finally { Object.assign(audio, save); }
      return (await ctx.startRendering()).getChannelData(0);
    };
    const rms = (x, a, b) => { let e = 0; const i0 = Math.round(a * sr), i1 = Math.round(b * sr); for (let i = i0; i < i1; i++) e += x[i] * x[i]; return Math.sqrt(e / (i1 - i0)); };
    // Tonhöhe im Spektrum (fein gerasterte DFT, Hann-Fenster); bis 40 am 2. Teilton.
    const cents = (x, midi, a, b) => {
      const h = midi <= 40 ? 2 : 1, f0 = h * hz(midi), i0 = Math.round(a * sr), n = Math.round((b - a) * sr);
      const w = new Float64Array(n); for (let i = 0; i < n; i++) w[i] = x[i0 + i] * (.5 - .5 * Math.cos(2 * Math.PI * i / (n - 1)));
      const mag = (c) => { const k = 2 * Math.PI * f0 * Math.pow(2, c / 1200) / sr; let re = 0, im = 0; for (let i = 0; i < n; i++) { re += w[i] * Math.cos(k * i); im -= w[i] * Math.sin(k * i); } return re * re + im * im; };
      let best = 0, bm = -1;
      for (let c = -40; c <= 40; c += 2) { const v = mag(c); if (v > bm) { bm = v; best = c; } }
      for (let c = best - 2; c <= best + 2; c += .1) { const v = mag(c); if (v > bm) { bm = v; best = c; } }
      return best;
    };
    for (const midi of [26, 31, 40, 50, 61, 71, 79, 85]) {
      const x = await render(1.5, () => noteOn(midi, .8));
      const c = cents(x, midi, .15, 1.1);
      if (!(Math.abs(c) <= 4)) errors.push(`Sample ${noteLabel(midi)}: ${c.toFixed(1)} Cent daneben`);
    }
    // Langer tiefer Ton mit Pedal: klingt über die Datei hinaus weiter, ohne Sprung an den Nahtstellen.
    {
      const x = await render(9, () => noteOn(31, .8));
      const lv = []; for (let t = 1; t < 8.5; t += .25) lv.push(20 * Math.log10(rms(x, t, t + .25) + 1e-9));
      if (!(lv[lv.length - 8] > -90)) errors.push('Sample: tiefer Ton bricht nach der Datei ab');
      const jumps = lv.slice(1).map((v, i) => v - lv[i]).filter((dv) => dv > 3);
      if (jumps.length) errors.push(`Sample: Ausklang springt (${jumps.map((v) => v.toFixed(1))} dB)`);
    }
    // Pegel wie die Synthese (Mitte der Klaviatur, 0,05–0,6 s), Rückfall ohne Samples.
    const sampled = await render(1, () => noteOn(60, .8));
    const set = smp.set; smp.set = null; smp.failedAt = Date.now(); // kein Nachladen während der Prüfung
    let synth;
    try { synth = await render(1, () => { ensureNoise(); noteOn(60, .8); }); } finally { smp.set = set; }
    const ratio = rms(sampled, .05, .6) / rms(synth, .05, .6);
    if (!(ratio > .5 && ratio < 2)) errors.push(`Sample: Pegel ${ratio.toFixed(2)} × Synthese`);
    if (!(rms(synth, .05, .6) > 1e-3)) errors.push('Rückfall: ohne Samples keine Synthese');
    return errors;
  }

  window.piano = { state, audio, noteOn, noteOff, spell, noteLabel, keyLabel, SOLF, selfCheck, selfCheckAudio, loadPianoSamples, samplesReady: () => !!smp.set };

  restore().then(() => {
    $('.vol input').value = String(state.volume);
    $('[data-act="pedal"]').setAttribute('aria-pressed', String(state.pedal));
    build();
  });
  build();
  loadPianoSamples().catch((err) => console.warn('Klavier-Samples nicht geladen – Synthese:', err));
})();
</script>
</body>
</html>
