<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Groove Lab · Werkbank</title>
<!--
  WERKBANK für das Groove Lab — lädt ausschließlich ../groove-lab.js und
  ../strings.js, ohne die restliche App (kein app.js, keine IndexedDB, kein
  Service-Worker-Cache). Gedacht zum schnellen Ausprobieren von Änderungen
  am Lab: Datei ändern, pushen, diese Seite neu laden — fertig.

  Frische statt Cache: Der Service Worker der App lässt alles unter /dev/
  und jede Anfrage mit ?dev=… durch (siehe fetch-Handler in sw.js). Die
  beiden Skripte werden hier mit einem Zeitstempel geladen, damit auch der
  HTTP-Cache (GitHub Pages: max-age=600) nicht dazwischenfunkt.

  Kein Teil der App-Shell (steht nicht in SHELL_REQUIRED/SHELL_OPTIONAL).
-->
<style>
  :root { color-scheme: light dark; --accent: #F868B0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 16px; background: #fff7ec; color: #241b3d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #16121f; color: #f2eefa; } }
  main { width: 100%; max-width: 420px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.3rem; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  p { margin: 0; font-size: .85rem; line-height: 1.45; opacity: .75; }
  fieldset { border: 1px solid rgba(127,127,127,.3); border-radius: 14px; padding: 12px 14px; margin: 0; display: grid; gap: 10px; }
  legend { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .7; padding: 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  label.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: currentColor; }
  button.primary {
    font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 14px 20px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { font: inherit; border: 1px solid rgba(127,127,127,.35); border-radius: 999px; padding: 10px 16px; background: none; color: inherit; cursor: pointer; }
  code { font-size: .8em; }
  #error { color: #d33; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Groove Lab <span>Werkbank</span></h1>
  <p>Lädt nur <code>groove-lab.js</code> — ohne die restliche App, ohne Service-Worker-Cache. Nach einer Änderung einfach diese Seite neu laden.</p>

  <fieldset>
    <legend>Sprache</legend>
    <div class="row" id="langs">
      <label class="chip"><input type="radio" name="lang" value="de" checked> Deutsch</label>
      <label class="chip"><input type="radio" name="lang" value="en"> English</label>
      <label class="chip"><input type="radio" name="lang" value="pl"> Polski</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Akzentfarbe</legend>
    <div class="row" id="accents"></div>
  </fieldset>

  <button class="primary" type="button" id="open">Groove Lab öffnen</button>
  <div class="row">
    <button class="secondary" type="button" id="reload">Neu laden (frische Dateien)</button>
  </div>
  <p id="error" role="alert"></p>
  <p>Der Stand beim Schließen geht verloren — das Lab speichert (noch) nichts.</p>
</main>

<script type="module">
  // Dieselben sechs Töne wie ACCENT_PRESETS in app.js.
  const ACCENTS = ['#F868B0', '#FF6B6B', '#FFD93D', '#4ECDC4', '#A78BFA', '#6BCB77'];
  const params = new URLSearchParams(location.search);
  const bust = Date.now();

  let lang = ['de', 'en', 'pl'].includes(params.get('lang')) ? params.get('lang') : 'de';
  let accent = ACCENTS.includes(params.get('accent')) ? params.get('accent') : ACCENTS[0];

  const errorEl = document.getElementById('error');
  const showError = (err) => { errorEl.textContent = String(err?.message || err); console.error(err); };

  // strings.js ist ein reines Daten-Modul (keine Imports) — t() hier genau
  // wie in app.js nachgebaut: gewählte Sprache, sonst Deutsch, sonst Schlüssel.
  let STRINGS = {};
  try {
    ({ STRINGS } = await import(`../strings.js?dev=${bust}`));
  } catch (err) { showError(err); }
  const t = (key) => STRINGS[lang]?.[key] ?? STRINGS.de?.[key] ?? key;

  const labReady = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = `../groove-lab.js?dev=${bust}`;
    script.onload = () => window.ChorGrooveLab ? resolve(window.ChorGrooveLab) : reject(new Error('Groove Lab wurde nicht registriert.'));
    script.onerror = () => reject(new Error('groove-lab.js konnte nicht geladen werden.'));
    document.head.append(script);
  });

  async function openLab() {
    try {
      const lab = await labReady;
      lab.open({ accent, t, lang });
    } catch (err) { showError(err); }
  }

  function syncUrl() {
    const next = new URLSearchParams({ lang, accent });
    history.replaceState(null, '', `?${next}`);
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.lang = lang;
  }

  for (const input of document.querySelectorAll('input[name=lang]')) {
    input.checked = input.value === lang;
    input.addEventListener('change', () => { lang = input.value; syncUrl(); });
  }

  const accentHost = document.getElementById('accents');
  for (const hex of ACCENTS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch';
    btn.style.background = hex;
    btn.setAttribute('aria-label', hex);
    btn.setAttribute('aria-pressed', String(hex === accent));
    btn.addEventListener('click', () => {
      accent = hex;
      accentHost.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      syncUrl();
    });
    accentHost.append(btn);
  }

  document.getElementById('open').addEventListener('click', openLab);
  document.getElementById('reload').addEventListener('click', () => location.reload());
  syncUrl();

  // Direkt öffnen — Audio startet ohnehin erst mit dem ersten Tipp auf Play.
  // ?closed=1 unterdrückt das, falls man erst Sprache/Farbe wählen will.
  if (params.get('closed') !== '1') openLab();
</script>
</body>
</html>
