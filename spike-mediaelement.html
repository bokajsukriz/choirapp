<!doctype html>
<!--
  Phase-0-Spike (siehe Arbeitsanweisung „Audio-Ebene auf natives <audio>-
  Element umbauen"): klärt, ob ein <audio>-Element seine Mediensitzung
  behält, wenn es durch eine Web-Audio-Kanalmatrix läuft (wie im
  Fahrradfahren-Modus), oder ob das die Sperrbildschirm-Wiedergabe bricht.

  Eigenständig, ohne Abhängigkeiten. Nicht Teil der App — vor dem Merge
  wieder entfernen.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike: Mediensitzung durch Matrix</title>
</head>
<body>
<h1>Spike: Mediensitzung durch Matrix</h1>
<p>MP3 wählen, A oder B abspielen, Sperrbildschirm-Steuerung prüfen,
   Bildschirm sperren, 90 Sekunden warten, entsperren, Protokoll unten lesen.</p>

<input type="file" id="file" accept="audio/*">
<audio id="el" playsinline preload="auto" style="display:none"></audio>
<p>
  <button id="btnA" disabled>A — direkt abspielen</button>
  <button id="btnB" disabled>B — über Matrix abspielen</button>
</p>
<pre id="log" style="white-space:pre-wrap;font:12px monospace;border:1px solid #ccc;padding:8px;max-height:60vh;overflow:auto"></pre>

<script>
const fileInput = document.getElementById('file');
const el = document.getElementById('el');
const btnA = document.getElementById('btnA');
const btnB = document.getElementById('btnB');
const log = document.getElementById('log');

let objectUrl = null;
let ctx = null;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  el.src = objectUrl;
  btnA.disabled = false;
  btnB.disabled = false;

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: file.name,
      artist: 'Spike-Test',
      artwork: [{ src: './icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    navigator.mediaSession.setActionHandler('play', () => el.play());
    navigator.mediaSession.setActionHandler('pause', () => el.pause());
  }
});

// A — direkt: kein Web-Audio-Kontakt.
btnA.addEventListener('click', () => el.play());

// B — über eine Kanalmatrix, verdrahtet wie in audioInit() (index.html,
// ab Zeile ~4630): Splitter -> vier Gains -> Merger -> destination.
// Mono-Mischung aktiv, damit die Matrix nachweislich mitarbeitet.
btnB.addEventListener('click', () => {
  if (!ctx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    ctx = new Ctx({ latencyHint: 'playback' });
    const src = ctx.createMediaElementSource(el);
    const splitter = ctx.createChannelSplitter(2);
    const merger = ctx.createChannelMerger(2);
    const gLL = ctx.createGain(), gLR = ctx.createGain();
    const gRL = ctx.createGain(), gRR = ctx.createGain();
    // Mono: beide Kanäle je zur Hälfte auf beide Ausgänge.
    gLL.gain.value = 0.5; gRR.gain.value = 0.5;
    gLR.gain.value = 0.5; gRL.gain.value = 0.5;
    src.connect(splitter);
    splitter.connect(gLL, 0); gLL.connect(merger, 0, 0);
    splitter.connect(gLR, 0); gLR.connect(merger, 0, 1);
    splitter.connect(gRL, 1); gRL.connect(merger, 0, 0);
    splitter.connect(gRR, 1); gRR.connect(merger, 0, 1);
    merger.connect(ctx.destination);
  }
  ctx.resume();
  el.play();
});

setInterval(() => {
  const line = `${new Date().toLocaleTimeString()}  currentTime=${el.currentTime.toFixed(1)}  paused=${el.paused}  ctx.state=${ctx?.state ?? '—'}\n`;
  log.textContent += line;
  log.scrollTop = log.scrollHeight;
}, 1000);
</script>
</body>
</html>
